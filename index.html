<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>آغازِ اساس — Aghaaz-e-Asaas</title>
  <meta name="description" content="Aghaaz-e-Asaas: 3 se 7 saal ke bachon ke liye Qaida, harf, rang, dua aur khel — dekho, suno, likho, rang bharo, yaad karo.">
  <meta name="theme-color" content="#FFF4DC">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aghaaz Asaas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   Aghaaz-e-Asaas Kids — app.css
   Design: garam cream background, chunky "dabne wale" buttons,
   bade touch targets (min 56px), narm rang, koi lal "galti" ka dar nahi.
   ========================================================== */

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Fredoka', 'Baloo 2', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--ink);
  line-height: 1.4; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 4px solid var(--c4); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
img, svg { display: block; }

/* ---------- Tokens ---------- */
:root {
  --bg: #FFF4DC; --bg2: #FFE7B0; --ink: #2B2250; --ink2: #6B6490;
  --card: #FFFFFF; --line: #F1E1B8; --soft: #FFF9EC;
  --c1: #FF7A59; --c1d: #D9553A;
  --c2: #FFB020; --c2d: #D98F00;
  --c3: #2ED1A0; --c3d: #1AA67C;
  --c4: #3DA9FC; --c4d: #2184D6;
  --c5: #8B6CFF; --c5d: #6A4FDB;
  --c6: #FF6FA8; --c6d: #D9487F;
  --c7: #12B5A6; --c7d: #0A8E82;
  --ok: #2ED1A0; --ok-bg: #DDF9EE; --oops-bg: #FFE9E3;
  --shadow: 0 6px 0 rgba(43, 34, 80, .09), 0 16px 30px rgba(43, 34, 80, .10);
  --shadow-s: 0 4px 0 rgba(43, 34, 80, .09);
  --r: 28px; --r-s: 18px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
[data-theme='night'] {
  --bg: #1B1740; --bg2: #262058; --ink: #FFF6E0; --ink2: #B7B0E0;
  --card: #2E2870; --line: #433B93; --soft: #272160;
  --ok-bg: #16503F; --oops-bg: #5A2A3A;
  --shadow: 0 6px 0 rgba(0, 0, 0, .25), 0 16px 30px rgba(0, 0, 0, .25);
  --shadow-s: 0 4px 0 rgba(0, 0, 0, .25);
}

/* ---------- Script fonts ---------- */
.ur { font-family: 'Noto Naskh Arabic', 'Noto Nastaliq Urdu', 'Amiri', 'Segoe UI', serif; direction: rtl; font-weight: 700; line-height: 1.55; unicode-bidi: isolate; }
.ar { font-family: 'Amiri Quran', 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', serif; direction: rtl; unicode-bidi: isolate; line-height: 1.9; }
.ar-big { font-family: 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', serif; font-weight: 700; direction: rtl; unicode-bidi: isolate; line-height: 1.5; }
.sub { color: var(--ink2); font-size: .92rem; }
.ic { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- App shell ---------- */
#app { position: fixed; inset: 0; max-width: 680px; margin: 0 auto; background: var(--bg); overflow: hidden; box-shadow: 0 0 0 100vmax var(--bg2); clip-path: inset(0 -100vmax); }
#stage { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--sat); padding-bottom: calc(var(--sab) + 24px); animation: slideIn .28s ease-out both; }
.screen.noscroll { overflow: hidden; display: flex; flex-direction: column; }
.pad { padding: 0 16px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.gap-s { gap: 8px; }

/* ---------- Topbar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(var(--bg) 78%, rgba(255, 244, 220, 0)); }
[data-theme='night'] .topbar { background: linear-gradient(var(--bg) 78%, rgba(27, 23, 64, 0)); }
.tb-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.tb-title b { font-size: 1.55rem; text-align: right; display: block; direction: rtl; }
.tb-title small { font-size: .82rem; color: var(--ink2); text-align: right; }
html[dir] .tb-title { text-align: start; }
.tb-right { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; box-shadow: var(--shadow-s); border: 2px solid var(--line); transition: transform .08s; flex-shrink: 0; }
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn.sm { width: 44px; height: 44px; }
.icon-btn.on { background: var(--c2); color: #fff; border-color: var(--c2d); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-weight: 700; font-size: 1.05rem; box-shadow: var(--shadow-s); }
.chip.bump { animation: bump .5s; }
.chip-ic { font-size: 1.1rem; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 10px 26px; border-radius: 999px; background: var(--c1); color: #fff; font-weight: 700; font-size: 1.15rem; box-shadow: 0 6px 0 var(--c1d); transition: transform .08s, box-shadow .08s, opacity .2s; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--c1d); }
.btn.big { min-height: 74px; font-size: 1.4rem; padding: 12px 36px; }
.btn.small { min-height: 46px; font-size: 1rem; padding: 6px 18px; box-shadow: 0 4px 0 var(--c1d); }
.btn.block { width: 100%; }
.btn.green { background: var(--c3); box-shadow: 0 6px 0 var(--c3d); }
.btn.green:active:not(:disabled) { box-shadow: 0 1px 0 var(--c3d); }
.btn.blue { background: var(--c4); box-shadow: 0 6px 0 var(--c4d); }
.btn.sun { background: var(--c2); box-shadow: 0 6px 0 var(--c2d); color: #4A3200; }
.btn.grape { background: var(--c5); box-shadow: 0 6px 0 var(--c5d); }
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
.btn.ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pulse { animation: btnPulse 1.4s ease-in-out infinite; }

/* ---------- Cards ---------- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.section-title { font-size: 1.15rem; font-weight: 700; margin: 18px 16px 10px; display: flex; align-items: center; gap: 8px; }

/* ---------- Mascot ---------- */
.noori { width: 100%; height: auto; overflow: visible; }
.noori .n-body { animation: float 3.2s ease-in-out infinite; transform-origin: 100px 190px; transform-box: view-box; }
.noori .n-eyes { animation: blink 4.5s infinite; transform-origin: 100px 116px; }
.noori .n-arm-r { transform-origin: 150px 128px; animation: wave 2.6s ease-in-out infinite; }
.noori .n-arm-l { transform-origin: 50px 128px; animation: wave 2.6s ease-in-out infinite reverse; }
.noori .n-open { display: none; }
.noori[data-mood='cheer'] .n-smile { display: none; }
.noori[data-mood='cheer'] .n-open { display: block; }
.noori[data-mood='cheer'] .n-body { animation: jump .7s ease-in-out infinite; }
.noori[data-mood='cheer'] .n-arm-r, .noori[data-mood='cheer'] .n-arm-l { animation: wave .5s ease-in-out infinite; }

/* ---------- Home ---------- */
.home-hero { position: relative; padding: 12px 16px 26px; background: linear-gradient(#B8E4FF 0%, #E8F6FF 45%, var(--bg) 100%); border-radius: 0 0 44px 44px; overflow: hidden; }
[data-theme='night'] .home-hero { background: linear-gradient(#251F63, #2B2570 50%, var(--bg)); }
.home-hero::before { content: '☁️'; position: absolute; top: 74px; right: 18px; font-size: 54px; opacity: .8; animation: drift 14s ease-in-out infinite alternate; }
.home-hero::after { content: '☁️'; position: absolute; top: 116px; left: -6px; font-size: 38px; opacity: .6; animation: drift 18s ease-in-out infinite alternate-reverse; }
[data-theme='night']  .home-hero::before { content: '⭐'; }
[data-theme='night']  .home-hero::after { content: '✨'; }
.home-bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; }
.kid-chip { display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 6px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow-s); border: 2px solid var(--line); max-width: 52%; }
.kid-chip .av { width: 40px; height: 40px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; font-size: 1.5rem; }
.kid-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.05rem; }
.hero-body { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 6px; margin-top: 8px; }
.hero-noori { width: 38%; max-width: 190px; flex-shrink: 0; margin-bottom: -6px; }
.hero-talk { flex: 1; min-width: 0; padding-bottom: 12px; }
.bubble-say { position: relative; background: var(--card); border-radius: 26px 26px 26px 8px; padding: 12px 16px; box-shadow: var(--shadow-s); font-weight: 600; font-size: 1.08rem; margin-bottom: 14px; }
.bubble-say b { color: var(--c1); }
.cta { width: 100%; justify-content: space-between; text-align: start; padding: 12px 18px 12px 22px; min-height: 80px; }
.cta .t { display: flex; flex-direction: column; line-height: 1.15; }
.cta .t small { font-size: .85rem; font-weight: 500; opacity: .92; }
.cta .go { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .3); display: grid; place-items: center; }
.missions { margin: 14px 16px 0; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.mis { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--ink2); font-weight: 600; }
.mis .st { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.7rem; background: var(--soft); border: 3px dashed var(--line); filter: grayscale(1); opacity: .5; transition: .3s; }
.mis.on .st { filter: none; opacity: 1; background: #FFF1B8; border: 3px solid var(--c2); animation: pop .5s; }
.week { display: flex; justify-content: space-between; padding: 0 20px; margin-top: 10px; }
.week i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.week i.on { background: var(--c2); box-shadow: 0 0 0 3px #FFE9A8; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; }
.tile { position: relative; border-radius: var(--r); padding: 14px 12px 12px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; color: #fff; text-align: center; background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 7px 0 var(--d), 0 16px 26px rgba(43, 34, 80, .14); transition: transform .08s, box-shadow .08s; overflow: hidden; }
.tile:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--d); }
.tile::after { content: ''; position: absolute; right: -26px; top: -26px; width: 90px; height: 90px; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.tile .te { width: 76px; height: 76px; border-radius: 50%; background: rgba(255, 255, 255, .28); display: grid; place-items: center; font-size: 2.8rem; line-height: 1; z-index: 1; }
.tile .tt { font-weight: 700; font-size: 1.35rem; line-height: 1.35; z-index: 1; }
.tile .ts { font-size: .86rem; opacity: .95; font-weight: 500; z-index: 1; margin-top: -4px; }
.tile .badge { position: absolute; top: 8px; left: 8px; background: rgba(255, 255, 255, .92); color: var(--d); font-weight: 700; font-size: .78rem; padding: 2px 10px; border-radius: 99px; z-index: 2; }
.tile.wide { grid-column: span 2; min-height: 104px; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 12px 18px; text-align: start; }
.tile.wide .tt, .tile.wide .ts { text-align: start; }
.home-foot { display: flex; justify-content: center; gap: 10px; padding: 4px 16px 20px; }

/* ---------- Welcome / profile ---------- */
.welcome { padding: 22px 18px 40px; text-align: center; }
.welcome .noori { width: 170px; margin: 0 auto; }
.welcome h1 { font-size: 2rem; margin-top: 4px; }
.welcome .ur { font-size: 2.2rem; color: var(--c1); }
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 6px; }
.avatars button { aspect-ratio: 1; border-radius: 22px; background: var(--card); border: 4px solid var(--line); font-size: 2.2rem; box-shadow: var(--shadow-s); }
.avatars button.on { border-color: var(--c1); background: #FFEDE6; transform: scale(1.06); }
.text-in { width: 100%; padding: 14px 18px; border-radius: 22px; border: 3px solid var(--line); font: inherit; font-size: 1.2rem; text-align: center; background: var(--card); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
.text-in:focus { border-color: var(--c4); }
.age-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.age-pick button { padding: 14px 8px; border-radius: 26px; background: var(--card); border: 4px solid var(--line); box-shadow: var(--shadow-s); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; }
.age-pick button .e { font-size: 2.4rem; }
.age-pick button small { font-weight: 500; color: var(--ink2); font-size: .82rem; }
.age-pick button.on { border-color: var(--c3); background: var(--ok-bg); }
.profile-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.profile-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border-radius: 26px; box-shadow: var(--shadow-s); border: 3px solid var(--line); text-align: start; width: 100%; }
.profile-row .av { width: 54px; height: 54px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; font-size: 2rem; }

/* ---------- Learn path ---------- */
.song-card { margin: 4px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(120deg, var(--c5), var(--c6)); color: #fff; border-radius: var(--r); box-shadow: 0 6px 0 var(--c5d); text-align: start; width: calc(100% - 32px); }
.song-card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--c5d); }
.song-card .se { font-size: 2.4rem; }
.manzil { margin: 16px 16px 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.manzil-h { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--mc); color: #fff; }
.manzil-h .me { font-size: 1.7rem; }
.manzil-h b { font-size: 1.15rem; line-height: 1.2; }
.manzil-h small { display: block; opacity: .9; font-size: .8rem; }
.manzil-h .cnt { margin-left: auto; background: rgba(255, 255, 255, .25); padding: 2px 12px; border-radius: 99px; font-weight: 700; }
.letters-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 16px 12px 8px; }
.lchip { position: relative; width: 74px; height: 74px; border-radius: 24px; background: var(--soft); border: 4px solid var(--line); font-size: 2.5rem; display: grid; place-items: center; box-shadow: 0 5px 0 var(--line); line-height: 1; transition: transform .08s; }
.lchip:active { transform: translateY(4px); box-shadow: none; }
.lchip .ar-big { line-height: 1.3; }
.lchip.done { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 5px 0 var(--c3d); }
.lchip.next { background: #FFF1B8; border-color: var(--c2); box-shadow: 0 5px 0 var(--c2d); animation: btnPulse 1.4s ease-in-out infinite; }
.lchip.thirsty::after { content: '💧'; position: absolute; right: -8px; top: -10px; font-size: 1.15rem; animation: bounce 1.2s infinite; }
.lchip .tick { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--c3); color: #fff; display: grid; place-items: center; border: 3px solid #fff; }
.lchip .tick .ic { width: 14px; height: 14px; stroke-width: 4; }
.manzil-f { padding: 8px 14px 14px; display: flex; justify-content: center; }
.chapter { margin: 16px 16px 0; padding: 16px; display: flex; align-items: center; gap: 14px; text-align: start; width: calc(100% - 32px); }
.chapter .ce { font-size: 2.4rem; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 22px; background: var(--bg2); flex-shrink: 0; }
.chapter b { font-size: 1.2rem; display: block; line-height: 1.2; }
.chapter .lockmsg { color: var(--ink2); font-size: .85rem; }

/* ---------- Lesson ---------- */
.lesson { display: flex; flex-direction: column; height: 100%; }
.lesson-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px 4px; }
.steps { flex: 1; display: flex; justify-content: center; gap: 8px; }
.step-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; background: var(--card); border: 3px solid var(--line); opacity: .55; transition: .3s; }
.step-dot.on { opacity: 1; border-color: var(--c1); background: #FFEDE6; transform: scale(1.18); box-shadow: 0 4px 0 var(--c1d); }
.step-dot.done { opacity: 1; background: var(--ok-bg); border-color: var(--ok); }
.lesson-main { flex: 1; overflow-y: auto; padding: 8px 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lesson-foot { padding: 10px 16px calc(14px + var(--sab)); display: flex; gap: 12px; justify-content: center; align-items: center; }
.step-say { text-align: center; font-weight: 700; font-size: 1.25rem; min-height: 1.6em; }
.step-say .ur { font-size: 1.6rem; color: var(--c1); }
.letter-card { position: relative; width: 100%; max-width: 380px; background: var(--card); border-radius: 40px; box-shadow: var(--shadow); padding: 10px 14px 16px; text-align: center; transition: transform .1s; }
.letter-card:active { transform: scale(.98); }
.big-letter { font-size: clamp(120px, 40vw, 190px); line-height: 1.35; color: var(--ink); display: block; }
.letter-name { display: inline-block; background: var(--c1); color: #fff; padding: 2px 20px; border-radius: 99px; font-weight: 700; font-size: 1.4rem; box-shadow: 0 4px 0 var(--c1d); }
.speak-fab { position: absolute; right: 12px; top: 12px; width: 52px; height: 52px; border-radius: 50%; background: var(--c4); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--c4d); }
.pic-card { width: 100%; max-width: 380px; display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 30px; padding: 10px 18px; box-shadow: var(--shadow); text-align: start; }
.pic-card:active { transform: scale(.98); }
.pic-card .pe { font-size: 4.2rem; line-height: 1; width: 92px; text-align: center; }
.pic-card .pw { flex: 1; display: flex; flex-direction: column; align-items: flex-end; }
.pic-card .pw .ar-big { font-size: 2.1rem; }
.pic-card .pw .ur { font-size: 1.5rem; color: var(--c1); }
.pic-card .pw small { color: var(--ink2); }
.cue { max-width: 380px; text-align: center; color: var(--ink2); font-size: .95rem; padding: 0 8px; }
.forms { display: flex; gap: 8px; width: 100%; max-width: 380px; }
.forms > div { flex: 1; background: var(--card); border-radius: 20px; padding: 6px 2px 2px; text-align: center; box-shadow: var(--shadow-s); }
.forms .ar-big { font-size: 2.4rem; display: block; line-height: 1.5; }
.forms small { color: var(--ink2); font-size: .72rem; }
.echo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.mic-ring { width: 130px; height: 130px; border-radius: 50%; background: #FFEDE6; display: grid; place-items: center; font-size: 3.4rem; position: relative; }
.mic-ring.live::before, .mic-ring.live::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--c1); animation: ring 1.4s ease-out infinite; }
.mic-ring.live::after { animation-delay: .7s; }
.counter-dots { display: flex; gap: 10px; }
.counter-dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--line); transition: .3s; }
.counter-dots i.on { background: var(--c2); transform: scale(1.2); }

/* ---------- Tracing / colouring ---------- */
.board { position: relative; width: min(88vw, 390px); aspect-ratio: 1; background: #fff; border-radius: 36px; box-shadow: var(--shadow); overflow: hidden; touch-action: none; }
[data-theme='night'] .board { background: #FFFDF6; }
.board canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.meter { width: min(88vw, 390px); height: 20px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, var(--c2), var(--c3)); border-radius: 99px; transition: width .25s; }
.meter b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .75rem; color: var(--ink); }
.palette { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 390px; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; background: var(--sw); box-shadow: 0 3px 0 rgba(0, 0, 0, .2); transition: transform .1s; }
.swatch.rainbow { background: conic-gradient(#FF4D4D, #FFB020, #FFE14D, #2ED1A0, #3DA9FC, #8B6CFF, #FF4D4D); }
.swatch.on { transform: scale(1.22); outline: 4px solid var(--ink); outline-offset: 1px; }
.tools { display: flex; gap: 10px; align-items: center; justify-content: center; }

/* ---------- Choices / quiz ---------- */
.opt-grid { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 14px; width: 100%; max-width: 420px; }
.opt { position: relative; min-height: 108px; border-radius: 30px; background: var(--card); box-shadow: var(--shadow); border: 5px solid transparent; font-size: 3.4rem; display: grid; place-items: center; line-height: 1.2; transition: transform .08s; padding: 4px; }
.opt:active:not(:disabled) { transform: translateY(4px); }
.opt .ar-big { font-size: 3.6rem; line-height: 1.4; }
.opt.sm { font-size: 2.3rem; min-height: 90px; }
.opt.txt { font-size: 1.5rem; font-weight: 700; }
.opt .disc { width: 78px; height: 78px; border-radius: 50%; background: var(--hex); box-shadow: inset -7px -9px 0 rgba(0, 0, 0, .13), inset 5px 6px 0 rgba(255, 255, 255, .3), 0 3px 0 rgba(0, 0, 0, .12); border: 2px solid rgba(0, 0, 0, .08); }
.opt svg.shape { width: 78px; height: 78px; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); animation: pop .45s; }
.opt.wrong { animation: shake .45s; border-color: #FFB6A6; background: var(--oops-bg); }
.opt.hint { animation: btnPulse .8s ease-in-out infinite; border-color: var(--c2); }
.opt.fade { opacity: .35; }
.q-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.q-prompt { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 110px; width: 100%; background: var(--card); border-radius: 34px; box-shadow: var(--shadow); padding: 10px 14px; }
.q-prompt .big { font-size: 4.6rem; line-height: 1.1; }
.q-prompt .ar-big { font-size: 5.6rem; line-height: 1.4; }
.q-prompt.listen { min-height: 120px; }
.listen-btn { width: 96px; height: 96px; border-radius: 50%; background: var(--c4); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 var(--c4d); }
.listen-btn .ic { width: 46px; height: 46px; }
.listen-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--c4d); }
.q-text { text-align: center; font-weight: 700; font-size: 1.2rem; }
.q-text .ur { font-size: 1.5rem; color: var(--c1); }
.dots-row { display: flex; gap: 8px; justify-content: center; padding: 4px 0; }
.dots-row i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); transition: .3s; display: block; }
.dots-row i.cur { background: var(--c2); transform: scale(1.35); }
.dots-row i.ok { background: var(--c3); }
.dots-row i.helped { background: var(--c4); }

/* ---------- Games ---------- */
.games-head { padding: 0 16px; }
.gtile { position: relative; border-radius: var(--r); padding: 12px 10px 10px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff; text-align: center; background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 7px 0 var(--d), 0 16px 26px rgba(43, 34, 80, .14); overflow: hidden; }
.gtile:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--d); }
.gtile .ge { font-size: 3.4rem; line-height: 1.1; }
.gtile .gt { font-weight: 700; font-size: 1.3rem; line-height: 1.3; }
.gtile .gs { font-size: .85rem; opacity: .95; }
.gtile .gstars { position: absolute; bottom: 6px; font-size: .95rem; letter-spacing: 1px; }
.gtile .glvl { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, .92); color: var(--d); font-weight: 700; font-size: .75rem; padding: 2px 9px; border-radius: 99px; }
.game { display: flex; flex-direction: column; height: 100%; }
.game-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }
.game-top .gt-mid { flex: 1; text-align: center; min-width: 0; }
.game-top .gt-mid b { display: block; font-size: 1.25rem; line-height: 1.2; }
.game-stage { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px 18px; overflow-y: auto; }
.game-stage.free { padding: 0; justify-content: flex-start; touch-action: none; }
.target-pill { display: inline-flex; align-items: center; gap: 10px; background: var(--card); border-radius: 99px; padding: 8px 20px; font-weight: 700; font-size: 1.25rem; box-shadow: var(--shadow-s); border: 3px solid var(--line); }
.target-pill .ar-big { font-size: 2.6rem; line-height: 1.3; }
.target-pill .disc-s { width: 38px; height: 38px; border-radius: 50%; background: var(--hex); border: 3px solid rgba(0, 0, 0, .12); }
.result { text-align: center; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.result .noori { width: 150px; }
.result h2 { font-size: 1.8rem; }
.result .rstars { font-size: 3.2rem; letter-spacing: 6px; }
.result .rstars .off { filter: grayscale(1); opacity: .25; }
.bubble-b { position: absolute; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem; color: #fff; background: radial-gradient(circle at 30% 26%, rgba(255, 255, 255, .95) 0 9%, rgba(255, 255, 255, .0) 11%), radial-gradient(circle at 50% 55%, var(--bc1), var(--bc2)); box-shadow: inset -8px -10px 0 rgba(0, 0, 0, .12), 0 6px 14px rgba(43, 34, 80, .18); animation: rise var(--dur) linear forwards; bottom: -110px; will-change: transform; touch-action: manipulation; border: 3px solid rgba(255, 255, 255, .55); }
.bubble-b .ar-big { font-size: 3rem; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .2); line-height: 1.3; }
.bubble-b.popped { animation: popOut .28s ease-out forwards !important; }
.bubble-b.wob { animation-play-state: paused; }
.basket { position: absolute; bottom: 14px; width: 110px; font-size: 4.4rem; text-align: center; transform: translateX(-50%); line-height: 1; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .12)); transition: transform .12s; }
.basket.good { animation: bounceB .35s; }
.fall { position: absolute; top: 0; left: 0; width: 66px; height: 66px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 2.2rem; box-shadow: var(--shadow-s); border: 3px solid var(--line); will-change: transform; line-height: 1; }
.fall .ar-big { font-size: 2.6rem; line-height: 1.35; }
.fall.is-target { border-color: var(--c2); }
.pad { }
.drive { position: absolute; bottom: 20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 255, 255, .8); display: grid; place-items: center; box-shadow: var(--shadow-s); border: 3px solid var(--line); }
.drive.l { left: 16px; } .drive.r { right: 16px; }
.mem-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 12px; width: 100%; max-width: 430px; }
.mcard { aspect-ratio: 1; perspective: 700px; }
.mcard .mc-in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.mcard.flip .mc-in { transform: rotateY(180deg); }
.mcard .face, .mcard .back { position: absolute; inset: 0; border-radius: 24px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow-s); }
.mcard .back { background: linear-gradient(145deg, var(--c5), var(--c4)); color: #fff; font-size: 2.2rem; border: 4px solid rgba(255, 255, 255, .5); }
.mcard .face { background: var(--card); transform: rotateY(180deg); font-size: 3rem; border: 4px solid var(--line); }
.mcard .face .ar-big { font-size: 3.6rem; line-height: 1.4; }
.mcard.match .face { border-color: var(--ok); background: var(--ok-bg); }
.slots { display: flex; gap: 10px; justify-content: center; direction: rtl; flex-wrap: wrap; }
.slot { width: 68px; height: 84px; border-radius: 22px; border: 4px dashed var(--line); background: var(--soft); display: grid; place-items: center; font-size: 3rem; transition: .2s; }
.slot.fill { border-style: solid; border-color: var(--c3); background: var(--ok-bg); animation: pop .3s; }
.slot .ar-big { line-height: 1.5; font-size: 3rem; }
.tiles-bank { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 400px; }
.ltile { width: 78px; height: 88px; border-radius: 24px; background: var(--card); box-shadow: 0 6px 0 var(--line), 0 12px 18px rgba(43, 34, 80, .1); border: 3px solid var(--line); display: grid; place-items: center; }
.ltile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line); }
.ltile.used { visibility: hidden; }
.ltile.wrong { animation: shake .4s; border-color: #FFB6A6; }
.ltile.hint { animation: btnPulse .8s infinite; border-color: var(--c2); }
.ltile .ar-big { font-size: 3rem; line-height: 1.5; }
.word-done { font-size: 5rem; color: var(--c3d); }
.odd-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 12px; width: 100%; max-width: 400px; }
.odd { min-height: 96px; border-radius: 26px; background: var(--card); box-shadow: var(--shadow-s); border: 4px solid transparent; display: grid; place-items: center; }
.odd .ar-big { font-size: 3.4rem; line-height: 1.5; }
.odd.right { border-color: var(--ok); background: var(--ok-bg); animation: pop .4s; }
.odd.wrong { animation: shake .4s; border-color: #FFB6A6; background: var(--oops-bg); }
.odd.hint { animation: btnPulse .8s infinite; border-color: var(--c2); }
.count-field { position: relative; width: 100%; max-width: 420px; min-height: 190px; background: var(--card); border-radius: 34px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 14px; }
.cobj { font-size: 3rem; line-height: 1; padding: 4px; transition: transform .2s; }
.cobj.counted { transform: scale(1.18); filter: drop-shadow(0 0 8px rgba(255, 176, 32, .9)); }
.cobj .cn { position: absolute; font-size: 1rem; font-weight: 700; background: var(--c1); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; transform: translate(14px, -26px); }
.cobj { position: relative; }
.shape-board { position: relative; width: 100%; max-width: 420px; height: 300px; }
.hole { position: absolute; width: 96px; height: 96px; }
.hole svg { width: 100%; height: 100%; fill: rgba(43, 34, 80, .1); stroke: rgba(43, 34, 80, .25); stroke-width: 3; stroke-dasharray: 6 6; }
.hole.filled svg { fill: var(--sc); stroke: rgba(0, 0, 0, .15); stroke-dasharray: none; }
.piece { position: absolute; width: 96px; height: 96px; touch-action: none; cursor: grab; z-index: 5; }
.piece svg { width: 100%; height: 100%; fill: var(--sc); stroke: rgba(0, 0, 0, .18); stroke-width: 3; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .12)); }
.piece.drag { z-index: 30; filter: drop-shadow(0 12px 12px rgba(0, 0, 0, .2)); transform: scale(1.1); }
.piece.back { transition: left .25s, top .25s; }
.piece.placed { pointer-events: none; opacity: 0; }

/* ---------- Early learning cards ---------- */
.cards-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 16px; flex: 1; justify-content: center; }
.fcard { width: 100%; max-width: 380px; background: var(--card); border-radius: 44px; box-shadow: var(--shadow); padding: 22px 16px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: pop .35s; }
.fcard:active { transform: scale(.98); }
.fcard .fe { font-size: 7.2rem; line-height: 1.15; }
.fcard .disc-xl { width: 150px; height: 150px; border-radius: 50%; background: var(--hex); box-shadow: inset -14px -18px 0 rgba(0, 0, 0, .12), inset 10px 12px 0 rgba(255, 255, 255, .3), 0 8px 0 rgba(0, 0, 0, .1); border: 3px solid rgba(0, 0, 0, .08); margin: 8px 0; }
.fcard svg.shape { width: 160px; height: 160px; margin: 4px 0; fill: var(--sc); stroke: rgba(0, 0, 0, .15); stroke-width: 3; }
.fcard .num { font-size: 7rem; font-weight: 700; color: var(--c1); line-height: 1.1; }
.fcard .fu { font-size: 2.6rem; color: var(--c1); }
.fcard .fr { font-size: 1.5rem; font-weight: 700; }
.fcard .fen { color: var(--ink2); font-size: 1.05rem; }
.fcard .things { font-size: 2.2rem; letter-spacing: 2px; margin-top: 6px; line-height: 1.3; }
.fcard .snd { margin-top: 4px; background: var(--bg2); padding: 4px 16px; border-radius: 99px; font-weight: 700; color: var(--c1d); }
.cards-nav { display: flex; align-items: center; justify-content: center; gap: 18px; }
.cards-nav .count { font-weight: 700; color: var(--ink2); min-width: 64px; text-align: center; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 16px; }

/* ---------- Colouring pages ---------- */
.art-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 16px; }
.art-tile { position: relative; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 10px 8px; text-align: center; border: 4px solid transparent; }
.art-tile:active { transform: translateY(4px); }
.art-tile svg { width: 100%; height: auto; aspect-ratio: 1; }
.art-tile b { display: block; font-size: 1.2rem; }
.art-tile .done-tag { position: absolute; top: 6px; right: 8px; font-size: 1.4rem; }
.art-svg { width: min(92vw, 420px); aspect-ratio: 1; background: #fff; border-radius: 34px; box-shadow: var(--shadow); touch-action: manipulation; }
.art-svg [data-r] { fill: #fff; stroke: #2B2250; stroke-width: 3; stroke-linejoin: round; cursor: pointer; transition: fill .15s; }
.art-svg .ol { fill: none; stroke: #2B2250; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

/* ---------- Deen ---------- */
.list { display: flex; flex-direction: column; gap: 12px; padding: 8px 16px; }
.lrow { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 26px; padding: 10px 14px; box-shadow: var(--shadow-s); text-align: start; width: 100%; border: 3px solid transparent; }
.lrow:active { transform: translateY(3px); }
.lrow .le { width: 62px; height: 62px; border-radius: 20px; background: var(--lc, var(--bg2)); display: grid; place-items: center; font-size: 2rem; flex-shrink: 0; }
.lrow .lt { flex: 1; min-width: 0; }
.lrow .lt b { display: block; font-size: 1.2rem; line-height: 1.5; }
.lrow .lt small { color: var(--ink2); }
.lrow .lr { font-size: 1.5rem; }
.lrow.done { border-color: var(--ok); }
.dua-ar { font-size: 2.3rem; line-height: 2.1; text-align: center; padding: 8px 4px; }
.dua-ar .part { display: inline; padding: 2px 6px; border-radius: 12px; transition: background .2s; }
.dua-ar .part.on { background: #FFE9A8; color: #6A4300; }
.dua-ar .part.hid { filter: blur(9px); }
.surah-ayah { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 26px; padding: 10px 12px; box-shadow: var(--shadow-s); width: 100%; border: 4px solid transparent; transition: border-color .2s; }
.surah-ayah.on { border-color: var(--c2); background: #FFF9DE; }
.surah-ayah .no { width: 38px; height: 38px; border-radius: 50%; background: var(--c4); color: #fff; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.surah-ayah .ar { flex: 1; font-size: 1.9rem; text-align: right; transition: filter .25s; }
.surah-ayah.hide .ar { filter: blur(10px); }
.seg { display: flex; background: var(--card); border-radius: 99px; padding: 5px; box-shadow: var(--shadow-s); border: 2px solid var(--line); gap: 4px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 99px; font-weight: 700; font-size: .95rem; color: var(--ink2); }
.seg button.on { background: var(--c4); color: #fff; box-shadow: 0 3px 0 var(--c4d); }
.step-card { width: 100%; max-width: 400px; background: var(--card); border-radius: 40px; box-shadow: var(--shadow); padding: 22px 16px; text-align: center; animation: pop .35s; }
.step-card .se { font-size: 6.6rem; line-height: 1.15; }
.step-card .ur { font-size: 2rem; color: var(--c1); }
.step-card .cnt { display: inline-block; margin-top: 6px; background: var(--c2); color: #4A3200; padding: 4px 20px; border-radius: 99px; font-weight: 700; font-size: 1.3rem; }
.fig { width: 230px; height: 190px; margin: 0 auto; }
.habit { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 26px; padding: 10px 14px; box-shadow: var(--shadow-s); border: 4px solid transparent; width: 100%; text-align: start; }
.habit .he { font-size: 2.4rem; width: 64px; text-align: center; }
.habit .ht { flex: 1; }
.habit .ht .ur { font-size: 1.4rem; display: block; }
.habit .ht small { color: var(--ink2); }
.habit .hs { width: 54px; height: 54px; border-radius: 50%; border: 4px dashed var(--line); display: grid; place-items: center; font-size: 1.7rem; filter: grayscale(1); opacity: .5; }
.habit.on { border-color: var(--ok); background: var(--ok-bg); }
.habit.on .hs { border: 4px solid var(--c2); background: #FFF1B8; filter: none; opacity: 1; animation: pop .4s; }

/* ---------- Album ---------- */
.stk-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 8px 16px; }
.stk { aspect-ratio: 1; border-radius: 22px; background: var(--card); display: grid; place-items: center; font-size: 2.3rem; box-shadow: var(--shadow-s); border: 3px solid var(--line); }
.stk.locked { background: var(--soft); border-style: dashed; filter: grayscale(1); opacity: .5; font-size: 1.5rem; }
.stk:not(.locked):active { animation: wobble .5s; }
.progress-sticker { margin: 6px 16px 0; padding: 12px 14px; }
.bar { height: 18px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--c2), var(--c1)); border-radius: 99px; transition: width .4s; }
.tree-wrap { margin: 8px 12px 0; background: linear-gradient(#C9ECFF, #EAF8FF 55%, #D6F5C5 55.1%, #B9EBA0); border-radius: 36px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
[data-theme='night'] .tree-wrap { background: linear-gradient(#2B2570, #3A3290 55%, #1F5A44 55.1%, #174634); }
.tree-wrap svg { width: 100%; height: auto; }
.fruit { cursor: pointer; transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.fruit:active { transform: scale(1.2); }
.fruit.s3 { opacity: .55; }
.tree-msg { margin: 10px 16px 0; text-align: center; }

/* ---------- Parent area ---------- */
.parent { padding-bottom: 60px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Fredoka', sans-serif; }
.parent .topbar { background: var(--bg); }
.pa { margin: 14px 16px 0; background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow-s); border: 2px solid var(--line); }
.pa h3 { font-size: 1.05rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.pa p { color: var(--ink2); font-size: .9rem; margin: 4px 0; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--soft); border-radius: 16px; padding: 10px 4px; text-align: center; }
.kpi b { display: block; font-size: 1.5rem; line-height: 1.2; }
.kpi small { color: var(--ink2); font-size: .74rem; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 92px; margin-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; font-size: .7rem; color: var(--ink2); }
.bars i { display: block; width: 100%; max-width: 28px; border-radius: 8px 8px 3px 3px; background: var(--c4); min-height: 3px; }
.bars div.today i { background: var(--c1); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row .lbl b { display: block; font-size: .98rem; }
.set-row .lbl small { color: var(--ink2); font-size: .8rem; }
.toggle { position: relative; width: 56px; height: 32px; border-radius: 99px; background: var(--line); transition: .2s; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: .2s; }
.toggle.on { background: var(--c3); }
.toggle.on::after { left: 27px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

<script>
/* js/util.js */
/* Aghaaz-e-Asaas Kids — util.js
   Chhote helper functions. Sab kuch window.AA namespace mein. */
(function () {
  'use strict';
  const AA = (window.AA = { screens: {}, games: {}, data: {}, ui: {}, voice: {}, store: {} });

  AA.$ = (s, r) => (r || document).querySelector(s);
  AA.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  AA.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  AA.rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  AA.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  AA.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  AA.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  // arr mein se n alag items, excl wale chhod kar
  AA.sample = (arr, n, excl) => AA.shuffle(arr.filter((x) => !(excl || []).includes(x))).slice(0, n);
  AA.wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const pad = (n) => String(n).padStart(2, '0');
  AA.dayStr = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  AA.today = () => AA.dayStr(new Date());
  AA.addDays = (str, n) => { const [y, m, d] = str.split('-').map(Number); const dt = new Date(y, m - 1, d + n); return AA.dayStr(dt); };
  AA.daysBetween = (a, b) => { const p = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 86400000); };
  AA.weekDays = () => { const out = []; const t = AA.today(); for (let i = 6; i >= 0; i--) out.push(AA.addDays(t, -i)); return out; };

  AA.lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch (e) { return fb; } };
  AA.lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  AA.lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

  // Dobara-dobara na chalne wala debounce
  AA.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  AA.reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  AA.vibrate = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
})();

<script>
/* js/audio.js */
/* Aghaaz-e-Asaas Kids — audio.js
   1) Voice: awaaz (walidain ki record ki hui awaaz > phone ki TTS awaaz)
   2) SFX : chhoti chhoti khushi ki awaazein (koi file nahi — WebAudio se bani hain)  */
(function () {
  'use strict';
  const AA = window.AA;

  /* ============================ VOICE ============================ */
  const Voice = (AA.voice = {
    on: true,
    speed: 1,        // parent setting
    base: 0.85,      // umar ke hisaab se (nanha dheere)
    bilingual: false,
    voices: [],
    token: 0,
    clips: {},
    audio: null,
    ready: false
  });

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    Voice.voices = window.speechSynthesis.getVoices() || [];
  }
  Voice.init = function () {
    if ('speechSynthesis' in window) {
      loadVoices();
      try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {}
    }
    // walidain ki recording (IndexedDB) + optional audio/ustad-awaaz.json
    try {
      fetch('audio/ustad-awaaz.json').then((r) => (r.ok ? r.json() : {})).then((j) => { Object.assign(Voice.clips, j || {}); }).catch(() => {});
    } catch (e) {}
    Voice.loadClips();
    Voice.ready = true;
  };

  /* ---------- IndexedDB clips (record.html wala hi format: db 'qa-voice', store 'clips') ---------- */
  function openDb() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('qa-voice', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('clips')) r.result.createObjectStore('clips'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  Voice.loadClips = function () {
    return openDb().then((db) => new Promise((res) => {
      const s = db.transaction('clips', 'readonly').objectStore('clips');
      const k = s.getAllKeys(), v = s.getAll();
      v.onsuccess = () => { k.result.forEach((key, i) => { if (v.result[i] && v.result[i].data) Voice.clips[key] = v.result[i].data; }); res(); };
      v.onerror = () => res();
    })).catch(() => {});
  };
  Voice.saveClip = function (key, dataUrl) {
    Voice.clips[key] = dataUrl;
    return openDb().then((db) => new Promise((res) => { const t = db.transaction('clips', 'readwrite'); t.objectStore('clips').put({ data: dataUrl }, key); t.oncomplete = () => res(); t.onerror = () => res(); })).catch(() => {});
  };
  Voice.deleteClip = function (key) {
    delete Voice.clips[key];
    return openDb().then((db) => new Promise((res) => { const t = db.transaction('clips', 'readwrite'); t.objectStore('clips').delete(key); t.oncomplete = () => res(); t.onerror = () => res(); })).catch(() => {});
  };

  /* ---------- awaaz chunna ---------- */
  function findVoice(kind) {
    const list = Voice.voices.length ? Voice.voices : (loadVoices(), Voice.voices);
    const by = (re) => list.find((v) => re.test(v.lang.replace('_', '-')));
    if (kind === 'ar') return by(/^ar/i) || null;
    if (kind === 'ur') return by(/^ur/i) || null;
    if (kind === 'hi') return by(/^hi/i) || null;
    if (kind === 'en') return by(/^en-(IN|GB|US)/i) || by(/^en/i) || null;
    return null;
  }
  Voice.hasUrdu = () => !!findVoice('ur');
  Voice.hasArabic = () => !!findVoice('ar');

  Voice.rate = function (mult) { return AA.clamp(Voice.base * Voice.speed * (mult || 1), 0.5, 1.4); };

  // Quran ke chhote nishan jo TTS ko uljhate hain unhein saaf karo
  Voice.cleanAr = function (t) {
    return String(t)
      .replace(/[ۖ-ۜ۟-۠ۢ-۪ۨ-ۭ]/g, '')
      .replace(/ۡ/g, 'ْ')
      .replace(/[ٰٱ]/g, 'ا')
      .replace(/‍/g, '');
  };

  function tts(text, lang, voice, rate) {
    return new Promise((resolve) => {
      const ss = window.speechSynthesis;
      if (!ss || !text) return resolve();
      let done = false, tm;
      const fin = () => { if (done) return; done = true; clearTimeout(tm); resolve(); };
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = lang;
        u.rate = rate; u.pitch = 1.08;
        u.onend = fin; u.onerror = fin;
        tm = setTimeout(fin, Math.max(1800, (text.length * 230) / rate) + 1000);
        setTimeout(() => { try { ss.speak(u); } catch (e) { fin(); } }, 40);
      } catch (e) { fin(); }
    });
  }

  function playClip(url) {
    return new Promise((resolve, reject) => {
      try {
        const a = new Audio(url);
        Voice.audio = a;
        a.onended = () => resolve();
        a.onerror = () => reject(new Error('clip'));
        const p = a.play();
        if (p && p.catch) p.catch(reject);
      } catch (e) { reject(e); }
    });
  }

  Voice.stop = function () {
    Voice.token++;
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    try { if (Voice.audio) { Voice.audio.pause(); Voice.audio = null; } } catch (e) {}
  };

  // Arabic lafz (harf, lafz, dua). Pehle ustad/ammi ki recording, warna TTS.
  Voice.arab = async function (text, mult) {
    if (!Voice.on || !text) return;
    const tok = Voice.token;
    if (Voice.clips[text]) {
      try { await playClip(Voice.clips[text]); return; } catch (e) { /* TTS par jao */ }
    }
    if (tok !== Voice.token) return;
    await tts(Voice.cleanAr(text), 'ar-SA', findVoice('ar'), Voice.rate(mult || 0.85));
  };

  // Urdu/Hindi/Roman jumla. spec = { ur, hi, ro, en }
  Voice.urdu = async function (spec, mult) {
    if (!Voice.on || !spec) return;
    if (typeof spec === 'string') spec = { ro: spec, en: spec };
    if (spec.ar) return Voice.arab(spec.ar, mult);
    const ur = findVoice('ur'), hi = findVoice('hi'), en = findVoice('en');
    const r = Voice.rate(mult || 1);
    if (ur && spec.ur) return tts(spec.ur, 'ur-PK', ur, r);
    if (hi && spec.hi) return tts(spec.hi, 'hi-IN', hi, r);
    if (spec.hi) return tts(spec.hi, 'hi-IN', null, r);   // voice list khali ho to bhi hi-IN try
    return tts(spec.ro || spec.en || '', 'en-IN', en, r);
  };

  Voice.english = async function (text, mult) {
    if (!Voice.on || !text) return;
    return tts(text, 'en-US', findVoice('en'), Voice.rate(mult || 1));
  };

  // Ek item bolo (Urdu), bilingual ho to English bhi
  Voice.word = async function (item, mult) {
    if (!Voice.on) return;
    const tok = Voice.token;
    await Voice.urdu(item, mult);
    if (Voice.bilingual && item.en && tok === Voice.token) { await AA.wait(150); if (tok === Voice.token) await Voice.english(item.en, mult); }
  };

  // Tareeb-war bolo: list mein { ar }, { ur.. }, { en:'..', lang:'en' }, ya number (pause ms)
  Voice.seq = async function (list) {
    if (!Voice.on) return;
    Voice.stop();
    const tok = Voice.token;
    for (const it of list) {
      if (tok !== Voice.token) return;
      if (typeof it === 'number') { await AA.wait(it); continue; }
      if (it.ar) await Voice.arab(it.ar, it.rate);
      else if (it.lang === 'en') await Voice.english(it.en, it.rate);
      else await Voice.word(it, it.rate);
    }
  };

  // Aasaan shortcut: naya bolna shuru karo (purana band)
  Voice.say = function (spec, mult) {
    Voice.stop();
    if (spec.ar) return Voice.arab(spec.ar, mult);
    return Voice.word(spec, mult);
  };
  Voice.sayAr = function (text, mult) { Voice.stop(); return Voice.arab(text, mult); };

  Voice.praise = function () { return Voice.say(AA.pick(AA.data.PRAISE)); };
  Voice.hasClip = (k) => !!Voice.clips[k];

  /* ============================ SFX ============================ */
  const SFX = (AA.sfx = { on: true, ctx: null });
  function ctx() {
    if (!SFX.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { SFX.ctx = new C(); } catch (e) { return null; }
    }
    if (SFX.ctx.state === 'suspended') SFX.ctx.resume().catch(() => {});
    return SFX.ctx;
  }
  function tone(freq, start, dur, type, vol, slideTo) {
    const c = ctx(); if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  SFX.unlock = () => { ctx(); };
  SFX.play = function (name) {
    if (!SFX.on || !Voice.on) return;
    switch (name) {
      case 'tap': tone(520, 0, 0.06, 'triangle', 0.08); break;
      case 'pop': tone(700, 0, 0.12, 'sine', 0.22, 180); tone(1100, 0, 0.05, 'triangle', 0.08, 300); break;
      case 'good': tone(660, 0, 0.14, 'sine', 0.16); tone(880, 0.1, 0.2, 'sine', 0.16); break;
      case 'great': [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, 'triangle', 0.16)); break;
      case 'oops': tone(300, 0, 0.18, 'sine', 0.12, 210); break;       // narm — daraane wali nahi
      case 'star': tone(1175, 0, 0.1, 'sine', 0.12); tone(1568, 0.08, 0.22, 'sine', 0.12); break;
      case 'whoosh': tone(300, 0, 0.18, 'sawtooth', 0.04, 900); break;
      case 'win': [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.26, 'triangle', 0.17)); break;
      case 'drop': tone(420, 0, 0.1, 'sine', 0.14, 260); break;
    }
  };

  // Pehli touch par audio ko jagao (browser ki shart)
  window.addEventListener('pointerdown', () => { SFX.unlock(); }, { once: true, passive: true });
})();

</script>
<script>
/* js/store.js */
/* Aghaaz-e-Asaas Kids — store.js
   Bachon ki progress, sitare, stickers, "yaad ka nizam" (spaced repetition), settings.
   Sab kuch sirf is phone mein (localStorage) — koi account, koi password, koi server nahi. */
(function () {
  'use strict';
  const AA = window.AA;
  const Store = AA.store;
  const D = AA.data;

  const K_PROFILES = 'aa:profiles', K_ACTIVE = 'aa:active', K_SET = 'aa:settings', K_P = 'aa:p:';
  // Dohrane ka waqfa (din): box 0..6
  const INTERVALS = [0, 1, 2, 4, 8, 16, 32];

  Store.settings = { sound: true, speed: 1, bilingual: false, limit: 0, theme: 'auto' };
  Store.profiles = [];
  Store.profile = null;
  Store.p = null;
  const listeners = {};
  Store.on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); };
  Store.off = (ev, fn) => { listeners[ev] = (listeners[ev] || []).filter((f) => f !== fn); };
  const emit = (ev, a) => (listeners[ev] || []).slice().forEach((f) => { try { f(a); } catch (e) { console.error(e); } });

  function blank() {
    return {
      v: 2, stars: 0, stickers: [], letters: {},
      harkat: { seen: [], found: 0 },
      games: {}, days: {}, habits: {}, surahs: {}, duas: {}, namaz: { wudu: 0, postures: 0, namazein: 0 },
      art: {}, early: {}, song: 0,
      missions: { date: '', learn: false, play: false, deen: false, bonus: false }
    };
  }

  /* ---------------- settings ---------------- */
  Store.loadSettings = function () {
    Object.assign(Store.settings, AA.lsGet(K_SET, {}));
    Store.applySettings();
  };
  Store.saveSettings = function () { AA.lsSet(K_SET, Store.settings); Store.applySettings(); };
  Store.applySettings = function () {
    const s = Store.settings;
    AA.voice.on = !!s.sound; AA.sfx.on = !!s.sound;
    AA.voice.speed = s.speed || 1;
    AA.voice.bilingual = !!s.bilingual;
    AA.voice.base = Store.profile && Store.profile.age === 'bada' ? 0.92 : 0.8;
    const night = s.theme === 'night' || (s.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', night ? 'night' : 'light');
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', night ? '#1B1740' : '#FFF4DC');
  };

  /* ---------------- profiles ---------------- */
  Store.init = function () {
    Store.profiles = AA.lsGet(K_PROFILES, []) || [];
    Store.loadSettings();
    const act = AA.lsGet(K_ACTIVE, null);
    const prof = Store.profiles.find((x) => x.id === act) || null;
    if (prof) Store.switchProfile(prof.id, true);
  };
  Store.addProfile = function (o) {
    const id = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const prof = { id, name: (o.name || '').trim().slice(0, 14) || 'Nanha Dost', avatar: o.avatar || '🦁', age: o.age === 'bada' ? 'bada' : 'nanha', created: AA.today() };
    Store.profiles.push(prof);
    AA.lsSet(K_PROFILES, Store.profiles);
    AA.lsSet(K_P + id, blank());
    return id;
  };
  Store.switchProfile = function (id, silent) {
    const prof = Store.profiles.find((x) => x.id === id);
    if (!prof) return false;
    Store.profile = prof;
    const saved = AA.lsGet(K_P + id, null);
    Store.p = Object.assign(blank(), saved || {});
    // purane data mein naye khane na hon to bhar do
    ['harkat', 'games', 'days', 'habits', 'surahs', 'duas', 'art', 'early', 'letters', 'missions', 'namaz'].forEach((k) => { if (!Store.p[k]) Store.p[k] = blank()[k]; });
    AA.lsSet(K_ACTIVE, id);
    Store.applySettings();
    if (!silent) emit('profile', prof);
    return true;
  };
  Store.updateProfile = function (id, patch) {
    const prof = Store.profiles.find((x) => x.id === id); if (!prof) return;
    Object.assign(prof, patch);
    AA.lsSet(K_PROFILES, Store.profiles);
    if (Store.profile && Store.profile.id === id) Store.applySettings();
  };
  Store.deleteProfile = function (id) {
    Store.profiles = Store.profiles.filter((x) => x.id !== id);
    AA.lsSet(K_PROFILES, Store.profiles);
    AA.lsDel(K_P + id);
    if (Store.profile && Store.profile.id === id) { Store.profile = null; Store.p = null; AA.lsDel(K_ACTIVE); }
  };
  Store.resetProgress = function () { if (Store.profile) { Store.p = blank(); Store.save(); } };
  Store.exportProfile = () => JSON.stringify({ profile: Store.profile, progress: Store.p });

  let saveT = 0;
  Store.save = function () {
    if (!Store.profile || !Store.p) return;
    AA.lsSet(K_P + Store.profile.id, Store.p);
    emit('save');
  };
  Store.saveSoon = function () { clearTimeout(saveT); saveT = setTimeout(Store.save, 400); };
  window.addEventListener('pagehide', () => Store.save());
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.save(); });

  /* ---------------- harf aur yaad ka nizam ---------------- */
  Store.L = function (i) {
    const m = Store.p.letters;
    if (!m[i]) m[i] = { box: 0, due: '', seen: 0, done: false, right: 0, wrong: 0, lastUp: '', steps: {} };
    return m[i];
  };
  Store.isLearned = (i) => !!(Store.p.letters[i] && Store.p.letters[i].done);
  Store.learnedList = () => D.LETTERS.map((_, i) => i).filter((i) => Store.isLearned(i));
  Store.masteredList = () => Store.learnedList().filter((i) => Store.p.letters[i].box >= 3);
  Store.markSeen = function (i) { Store.L(i).seen++; Store.saveSoon(); };
  Store.finishLetter = function (i) {
    const L = Store.L(i);
    const first = !L.done;
    L.done = true;
    if (L.box < 1) L.box = 1;
    L.lastUp = AA.today();
    L.due = AA.addDays(AA.today(), INTERVALS[L.box]);
    Store.save();
    return first;
  };
  // ok = pehli koshish mein sahi? (din mein sirf pehla nateeja ginta hai)
  Store.srs = function (i, ok) {
    const L = Store.p.letters[i];
    if (!L || !L.done) return;           // seekhe hue harf hi
    const t = AA.today();
    if (ok) L.right++; else L.wrong++;
    if (L.lastUp !== t) {
      L.box = ok ? Math.min(6, Math.max(1, L.box + 1)) : Math.max(1, L.box - 1);
      L.lastUp = t;
    }
    L.due = AA.addDays(t, INTERVALS[L.box]);
    Store.saveSoon();
  };
  // Aaj dohrane layak harf (due pehle, phir kamzor)
  Store.dueList = function (limit) {
    const t = AA.today();
    const learned = Store.learnedList().map((i) => ({ i, L: Store.p.letters[i] }));
    const due = learned.filter((x) => x.L.due && x.L.due <= t).sort((a, b) => (a.L.due < b.L.due ? -1 : a.L.due > b.L.due ? 1 : a.L.box - b.L.box));
    return due.slice(0, limit || 99).map((x) => x.i);
  };
  Store.dueCount = () => Store.dueList().length;
  Store.weakList = function (n) {
    return Store.learnedList().map((i) => ({ i, L: Store.p.letters[i] }))
      .filter((x) => x.L.wrong > 0 && x.L.box <= 2)
      .sort((a, b) => b.L.wrong - a.L.wrong).slice(0, n || 5).map((x) => x.i);
  };
  // Tree ke liye: har harf ki halat  0=abhi nahi, 1=seekh raha, 2=yaad, 3=yaad par paani chahiye
  Store.letterState = function (i) {
    const L = Store.p.letters[i];
    if (!L || !L.done) return 0;
    const overdue = L.due && AA.daysBetween(L.due, AA.today()) >= 2;
    if (L.box >= 3) return overdue ? 3 : 2;
    return overdue ? 3 : 1;
  };
  // Games ke liye harf ka "pool": seekhe hue; kam hon to shuru ke kuch harf
  Store.pool = function (min) {
    min = min || 4;
    const learned = Store.learnedList();
    if (learned.length >= min) return learned;
    const out = learned.slice();
    for (let i = 0; out.length < min && i < 28; i++) if (!out.includes(i)) out.push(i);
    return out;
  };

  /* ---------------- sitare aur stickers ---------------- */
  Store.addStars = function (n, why) {
    if (!n || n < 0) return [];
    Store.p.stars += n;
    const earned = [];
    let k = Store.p.stickers.length;
    while (k < D.STICKERS.length && Store.p.stars >= D.stickerAt(k + 1)) {
      const unowned = D.STICKERS.filter((s) => !Store.p.stickers.includes(s));
      if (!unowned.length) break;
      const s = AA.pick(unowned);
      Store.p.stickers.push(s); earned.push(s); k++;
    }
    Store.save();
    emit('stars', { n, why, earned });
    return earned;
  };
  Store.nextStickerInfo = function () {
    const k = Store.p.stickers.length;
    if (k >= D.STICKERS.length) return { done: true, have: Store.p.stars, need: Store.p.stars, prev: Store.p.stars };
    const need = D.stickerAt(k + 1), prev = k === 0 ? 0 : D.stickerAt(k);
    return { done: false, have: Store.p.stars, need, prev };
  };

  /* ---------------- din ka hisaab ---------------- */
  Store.day = function (d) {
    d = d || AA.today();
    if (!Store.p.days[d]) Store.p.days[d] = { sec: 0, learn: 0, play: 0, deen: 0, letters: 0 };
    return Store.p.days[d];
  };
  Store.tick = function (sec) { const d = Store.day(); d.sec += sec; Store.saveSoon(); return d.sec; };
  Store.todayMinutes = () => Math.round(Store.day().sec / 60);

  // kind: 'learn' | 'play' | 'deen'. Aaj ke 3 sitaron ka hisaab.
  Store.mission = function (kind) {
    const m = Store.p.missions, t = AA.today();
    if (m.date !== t) { m.date = t; m.learn = m.play = m.deen = m.bonus = false; }
    Store.day()[kind]++;
    let bonus = false;
    if (!m[kind]) {
      m[kind] = true;
      if (m.learn && m.play && m.deen && !m.bonus) { m.bonus = true; bonus = true; }
    }
    Store.save();
    emit('mission', { kind, bonus });
    return bonus;
  };
  Store.missionToday = function () {
    const m = Store.p.missions;
    if (m.date !== AA.today()) return { learn: false, play: false, deen: false, bonus: false };
    return m;
  };
  Store.active = (d) => { const x = Store.p.days[d]; return !!(x && (x.learn || x.play || x.deen)); };
  Store.streak = function () {
    let t = AA.today(), n = 0;
    if (!Store.active(t)) t = AA.addDays(t, -1);
    while (Store.active(t)) { n++; t = AA.addDays(t, -1); }
    return n;
  };

  /* ---------------- games ka level ---------------- */
  Store.game = function (id) {
    if (!Store.p.games[id]) Store.p.games[id] = { lvl: 1, best: 0, played: 0 };
    return Store.p.games[id];
  };

  /* ---------------- achhi baatein ---------------- */
  Store.habitsToday = () => (Store.p.habits[AA.today()] || []);
  Store.toggleHabit = function (id) {
    const t = AA.today();
    const a = Store.p.habits[t] || (Store.p.habits[t] = []);
    const i = a.indexOf(id);
    if (i >= 0) { a.splice(i, 1); Store.save(); return false; }
    a.push(id); Store.save(); return true;
  };
})();

</script>
<script>
/* js/ui.js */
/* Aghaaz-e-Asaas Kids — ui.js
   Screen router, Noori (mascot), toast, jashn (celebration), parent gate, screen-time. */
(function () {
  'use strict';
  const AA = window.AA;
  const UI = AA.ui;
  const Store = AA.store;
  const D = AA.data;
  const $ = AA.$;

  /* ------------------------- icons ------------------------- */
  const ICONS = {
    back: '<path d="M15 5l-7 7 7 7" />',
    home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    sound: '<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/>',
    mute: '<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    play: '<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
    next: '<path d="M9 5l7 7-7 7"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5" />',
    redo: '<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>',
    undo: '<path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/>',
    erase: '<path d="M4 16l9-9a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3l-6 6H8z" fill="currentColor"/><path d="M12 20h8"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>'
  };
  UI.icon = (n, cls) => '<svg class="ic ' + (n === 'back' || n === 'next' || n === 'undo' || n === 'redo' ? 'flip ' : '') + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';

  /* ------------------------- Noori (mascot) ------------------------- */
  UI.mascot = function (mood, cls) {
    mood = mood || 'happy';
    return '<svg class="noori ' + (cls || '') + '" data-mood="' + mood + '" viewBox="0 0 200 200" aria-hidden="true">' +
      '<ellipse cx="100" cy="190" rx="52" ry="7" fill="#2B2250" opacity=".12"/>' +
      '<g class="n-body">' +
        '<g class="n-arm-l"><circle cx="34" cy="138" r="13" fill="#FFB400"/></g>' +
        '<g class="n-arm-r"><circle cx="166" cy="138" r="13" fill="#FFB400"/></g>' +
        '<circle cx="100" cy="116" r="70" fill="#FFC83D"/>' +
        '<path d="M52 92a56 56 0 0 1 30-32" stroke="#FFE38A" stroke-width="9" stroke-linecap="round" fill="none"/>' +
        '<path d="M42 82Q100 4 158 82Z" fill="#2ED1A0"/>' +
        '<rect x="40" y="74" width="120" height="16" rx="8" fill="#12B5A6"/>' +
        '<path d="M100 36l4.2 9.2 10 1-7.5 6.7 2.2 9.8-8.9-5.2-8.9 5.2 2.2-9.8-7.5-6.7 10-1z" fill="#FFF4C2" transform="translate(0 6) scale(1)"/>' +
        '<circle cx="62" cy="138" r="11" fill="#FF8FA3" opacity=".65"/><circle cx="138" cy="138" r="11" fill="#FF8FA3" opacity=".65"/>' +
        '<g class="n-eyes"><ellipse cx="76" cy="116" rx="9" ry="12" fill="#2B2250"/><ellipse cx="124" cy="116" rx="9" ry="12" fill="#2B2250"/>' +
        '<circle cx="79" cy="111" r="3.6" fill="#fff"/><circle cx="127" cy="111" r="3.6" fill="#fff"/></g>' +
        '<path class="n-smile" d="M84 140Q100 156 116 140" stroke="#2B2250" stroke-width="5.5" stroke-linecap="round" fill="none"/>' +
        '<g class="n-open"><path d="M82 136Q100 172 118 136Z" fill="#7A2340"/><path d="M92 156Q100 150 108 156Q100 164 92 156Z" fill="#FF7A90"/></g>' +
      '</g></svg>';
  };

  /* ------------------------- helpers ------------------------- */
  UI.stage = () => $('#stage');
  UI.bind = function (root, handlers) {
    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-act]');
      if (!t || !root.contains(t) || t.disabled) return;
      const fn = handlers[t.dataset.act];
      if (fn) fn(t, e);
    });
  };
  UI.starsChip = () => '<span class="chip stars" data-stars><span class="chip-ic">⭐</span><b>' + (Store.p ? Store.p.stars : 0) + '</b></span>';
  Store.on('stars', () => {
    AA.$$('[data-stars] b').forEach((b) => { b.textContent = Store.p.stars; });
    AA.$$('[data-stars]').forEach((c) => { c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); });
  });

  UI.topbar = function (o) {
    return '<header class="topbar">' +
      '<button class="icon-btn back" data-act="back" aria-label="Wapas">' + UI.icon('back') + '</button>' +
      '<div class="tb-title">' + (o.ur ? '<b class="ur">' + AA.esc(o.ur) + '</b>' : '') + '<small>' + AA.esc(o.ro || '') + '</small></div>' +
      '<div class="tb-right">' + (o.right || UI.starsChip()) + '</div></header>';
  };

  UI.toast = function (msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(UI.toast._t); UI.toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  };

  /* ------------------------- router ------------------------- */
  UI.stack = [];
  UI.cur = null;
  UI.go = function (name, params, opts) {
    opts = opts || {};
    const S = AA.screens[name];
    if (!S) { console.error('screen nahi mili', name); return; }
    leaveCurrent();
    if (opts.replace && UI.stack.length) UI.stack[UI.stack.length - 1] = { name, params };
    else if (opts.root) { UI.stack = [{ name, params }]; }
    else UI.stack.push({ name, params });
    if (!opts.replace) { try { history.pushState({ n: UI.stack.length }, ''); } catch (e) {} }
    mount(name, params);
  };
  UI._skipPop = 0;
  function doPop() {
    leaveCurrent();
    UI.stack.pop();
    const top = UI.stack[UI.stack.length - 1];
    mount(top.name, top.params);
  }
  UI.back = function () {
    if (closeTopModal()) return;
    if (UI.stack.length <= 1) return;
    doPop();
    UI._skipPop++;
    try { history.back(); } catch (e) { UI._skipPop = 0; }
    setTimeout(() => { UI._skipPop = 0; }, 600);
  };
  window.addEventListener('popstate', () => {
    if (UI._skipPop > 0) { UI._skipPop--; return; }
    if (closeTopModal()) { try { history.pushState({ n: UI.stack.length }, ''); } catch (e) {} return; }
    if (UI.stack.length > 1) doPop();
    else { try { history.pushState({ n: 1 }, ''); } catch (e) {} }
  });
  function leaveCurrent() {
    if (!UI.cur) return;
    const S = AA.screens[UI.cur.name];
    try { if (S && S.leave) S.leave(UI.cur.root); } catch (e) { console.error(e); }
    AA.voice.stop();
    UI.cur = null;
  }
  function mount(name, params) {
    const S = AA.screens[name];
    const stage = UI.stage();
    const root = document.createElement('section');
    root.className = 'screen s-' + name;
    root.innerHTML = S.render(params || {});
    stage.innerHTML = '';
    stage.appendChild(root);
    UI.cur = { name, params, root };
    UI.bind(root, { back: () => UI.back() });
    try { if (S.mount) S.mount(root, params || {}); } catch (e) { console.error(e); }
    root.scrollTop = 0; window.scrollTo(0, 0);
    document.body.dataset.screen = name;
  }
  UI.refresh = () => { if (UI.cur) { const { name, params } = UI.cur; leaveCurrent(); mount(name, params); } };

  /* ------------------------- modal ------------------------- */
  UI.modals = [];
  UI.modal = function (html, o) {
    o = o || {};
    const el = document.createElement('div');
    el.className = 'modal ' + (o.cls || '');
    el.innerHTML = '<div class="modal-card ' + (o.cardCls || '') + '">' + html + '</div>';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('open'));
    const m = { el, onClose: o.onClose, dismiss: o.dismiss !== false };
    UI.modals.push(m);
    if (m.dismiss) el.addEventListener('click', (e) => { if (e.target === el) UI.closeModal(m); });
    return m;
  };
  UI.closeModal = function (m) {
    m = m || UI.modals[UI.modals.length - 1];
    if (!m) return;
    UI.modals = UI.modals.filter((x) => x !== m);
    m.el.classList.remove('open');
    setTimeout(() => m.el.remove(), 220);
    if (m.onClose) m.onClose();
  };
  function closeTopModal() {
    const m = UI.modals[UI.modals.length - 1];
    if (!m || !m.dismiss) return !!m;
    UI.closeModal(m); return true;
  }

  /* ------------------------- confetti ------------------------- */
  UI.confetti = function (host, n) {
    if (AA.reduceMotion()) return;
    host = host || document.body;
    const cols = ['#FF7A59', '#FFC83D', '#2ED1A0', '#3DA9FC', '#8B6CFF', '#FF6FA8'];
    const lay = document.createElement('div');
    lay.className = 'confetti';
    for (let i = 0; i < (n || 34); i++) {
      const p = document.createElement('i');
      p.style.left = AA.rand(2, 98) + '%';
      p.style.background = AA.pick(cols);
      p.style.setProperty('--dx', AA.rand(-80, 80) + 'px');
      p.style.setProperty('--rot', AA.rand(-540, 540) + 'deg');
      p.style.animationDelay = (Math.random() * 0.35).toFixed(2) + 's';
      p.style.animationDuration = (1.4 + Math.random() * 1.1).toFixed(2) + 's';
      p.style.borderRadius = Math.random() < 0.5 ? '50%' : '3px';
      lay.appendChild(p);
    }
    host.appendChild(lay);
    setTimeout(() => lay.remove(), 3000);
  };
  UI.floatText = function (host, text, x, y, cls) {
    const el = document.createElement('div');
    el.className = 'float-text ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    host.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  };

  /* ------------------------- jashn (celebration) ------------------------- */
  // o: { title, sub, big (emoji ya html), voice (spec), btn, btn2 }  -> Promise<'ok'|'two'>
  UI.celebrate = function (o) {
    return new Promise((resolve) => {
      let res = 'ok';
      const m = UI.modal(
        '<div class="cele">' + UI.mascot('cheer', 'cele-noori') +
        '<h2 class="cele-title">' + AA.esc(o.title || 'MashaAllah!') + '</h2>' +
        (o.big ? '<div class="cele-big">' + o.big + '</div>' : '') +
        (o.sub ? '<p class="cele-sub">' + AA.esc(o.sub) + '</p>' : '') +
        '<div class="cele-btns"><button class="btn big" data-m="ok">' + AA.esc(o.btn || 'Aage chalo') + ' ' + UI.icon('next') + '</button>' +
        (o.btn2 ? '<button class="btn ghost" data-m="two">' + AA.esc(o.btn2) + '</button>' : '') + '</div></div>',
        { cls: 'cele-modal', dismiss: false, onClose: () => resolve(res) });
      m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b) return; res = b.dataset.m; UI.closeModal(m); });
      UI.confetti(m.el, 40);
      AA.sfx.play(o.sfx || 'win');
      if (o.voice) AA.voice.seq(o.voice);
    });
  };
  UI.stickerModal = function (emoji) {
    return UI.celebrate({ title: 'Naya Sticker!', big: '<span class="sticker-pop">' + emoji + '</span>', sub: 'Sitare jama karke sticker mila', btn: 'Wah!', voice: [AA.data.T.nayaSticker], sfx: 'win' });
  };

  /* ------------------------- sitare dene ka ek hi raasta ------------------------- */
  // n sitare do, animation dikhao, naya sticker mila to jashn karo
  UI.reward = async function (n, why) {
    if (!n) return;
    const earned = Store.addStars(n, why);
    AA.sfx.play('star');
    UI.flyStars(n);
    for (const s of earned) { await AA.wait(500); await UI.stickerModal(s); }
  };
  UI.flyStars = function (n) {
    if (AA.reduceMotion()) return;
    const host = document.body;
    for (let i = 0; i < Math.min(n, 5); i++) {
      const s = document.createElement('div');
      s.className = 'fly-star'; s.textContent = '⭐';
      s.style.left = (45 + i * 4) + '%';
      s.style.animationDelay = i * 0.1 + 's';
      host.appendChild(s);
      setTimeout(() => s.remove(), 1500 + i * 100);
    }
  };
  // Aaj ke teen sitaron ka hisaab: kind = learn | play | deen
  UI.mission = async function (kind) {
    const bonus = Store.mission(kind);
    if (bonus) {
      await UI.reward(3, 'bonus');
      await UI.celebrate({ title: 'Aaj ke teeno sitare!', big: '🌟🌟🌟', sub: 'Seekha, khela aur deen ki baat bhi ki. +3 sitare', voice: [AA.pick(D.PRAISE)] });
    }
  };

  /* ------------------------- parent gate ------------------------- */
  UI.parentGate = function (why) {
    return new Promise((resolve) => {
      const a = AA.rand(23, 48), b = AA.rand(17, 39), ans = String(a + b);
      let typed = '', done = false;
      const m = UI.modal(
        '<div class="gate"><div class="gate-ic">' + UI.icon('lock') + '</div>' +
        '<h3>Sirf walidain ke liye</h3><p class="sub">' + AA.esc(why || 'Aage jaane ke liye hisaab hal karein') + '</p>' +
        '<div class="gate-q">' + a + ' + ' + b + ' = <b id="gate-a">?</b></div>' +
        '<div class="keypad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map((k) => '<button class="key" data-k="' + k + '">' + k + '</button>').join('') + '</div>' +
        '<button class="btn ghost small" data-k="x">Wapas</button></div>',
        { cls: 'gate-modal', dismiss: false, onClose: () => { if (!done) resolve(false); } });
      const out = m.el.querySelector('#gate-a');
      m.el.addEventListener('click', (e) => {
        const k = e.target.closest('[data-k]'); if (!k) return;
        const v = k.dataset.k;
        if (v === 'x') { UI.closeModal(m); return; }
        if (v === '⌫') typed = typed.slice(0, -1);
        else if (v === '✓') {
          if (typed === ans) { done = true; resolve(true); UI.closeModal(m); return; }
          typed = ''; m.el.querySelector('.gate-q').classList.add('shake'); setTimeout(() => m.el.querySelector('.gate-q') && m.el.querySelector('.gate-q').classList.remove('shake'), 500);
        } else if (typed.length < 3) typed += v;
        out.textContent = typed || '?';
      });
    });
  };

  /* ------------------------- screen time ------------------------- */
  let lastInput = Date.now(), restShown = false, extraSec = 0;
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => { lastInput = Date.now(); }, { passive: true }));
  UI.startTimer = function () {
    if (UI._timer) return;
    UI._timer = setInterval(() => {
      if (document.hidden || !Store.p) return;
      if (Date.now() - lastInput > 45000) return;   // bachcha door hai — waqt na ginein
      const sec = Store.tick(5);
      const lim = Store.settings.limit;
      if (lim > 0 && !restShown && sec >= lim * 60 + extraSec) UI.restOverlay();
    }, 5000);
  };
  UI.restOverlay = function () {
    restShown = true;
    AA.voice.stop();
    const m = UI.modal(
      '<div class="rest">' + UI.mascot('happy', 'rest-noori') + '<h2>Aaram ka waqt 🌙</h2>' +
      '<p>Aaj ke liye bohat khel liya. Ab aankhon ko aaram do, kal phir milenge, in shaa Allah!</p>' +
