        }).join('') + '</div>' +
        (bada ? '' : '<p class="center sub" style="padding:0 20px">Har card dabao — awaaz aayegi 🔊</p>');
    },
    mount(root) { UI.bind(root, { cat(t) { AA.sfx.play('whoosh'); UI.go('cards', { k: t.dataset.k }); } }); }
  };

  function cardHtml(k, it) {
    if (k === 'rang') return '<div class="disc-xl" style="--hex:' + it.hex + '"></div><div class="fu ur">' + it.ur + '</div><div class="fr">' + it.ro + '</div><div class="fen">' + it.en + '</div><div class="things">' + it.things.join(' ') + '</div>';
    if (k === 'jaanwar') return '<div class="fe">' + it.e + '</div><div class="fu ur">' + it.ur + '</div><div class="fr">' + it.ro + '</div><div class="fen">' + it.en + '</div><div class="snd">🔊 ' + it.snd + '</div>';
    if (k === 'ginti') return '<div class="num">' + it.n + '</div><div class="things">' + Array.from({ length: it.n }, () => D.COUNT_THINGS[it.n % D.COUNT_THINGS.length]).join('') + '</div><div class="fu ur">' + it.ur + '</div><div class="fr">' + it.ro + '</div><div class="fen">' + it.en + '</div>';
    const cols = D.COLORS.slice(0, 6);
    return AA.shapeSvg(it, cols[D.SHAPES.indexOf(it) % 6].hex) + '<div class="fu ur">' + it.ur + '</div><div class="fr">' + it.ro + '</div><div class="fen">' + it.en + '</div>';
  }
  function speakCard(k, it) {
    if (k === 'ginti') { const list = []; for (let i = 0; i < it.n; i++) list.push(D.NUMBERS[i], 250); list.push(400, it); return V.seq(list.length > 12 ? [it] : list); }
    if (k === 'jaanwar') return V.seq([it, { lang: 'en', en: it.snd }]);
    return V.seq([it]);
  }

  S.cards = {
    render(p) {
      const c = CATS[p.k];
      return '<div class="lesson">' + UI.topbar({ ur: c.ur, ro: c.ro }) +
        '<div class="cards-wrap"><button class="fcard" id="fc" data-act="say"></button>' +
        '<div class="cards-nav"><button class="btn ghost" data-act="prev" aria-label="Pichla">' + UI.icon('back') + '</button><span class="count" id="fc-n"></span><button class="btn big green" data-act="next" aria-label="Agla">' + UI.icon('next') + '</button></div>' +
        '<button class="btn blue small" data-act="play">🎮 Khelo</button></div></div>';
    },
    mount(root, p) {
      const k = p.k, c = CATS[k], items = c.items();
      const rec = Store.p.early[k] || (Store.p.early[k] = { seen: [], done: false });
      let i = 0;
      function show(speak) {
        const it = items[i];
        const el = AA.$('#fc', root);
        el.innerHTML = cardHtml(k, it); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
        AA.$('#fc-n', root).textContent = (i + 1) + ' / ' + items.length;
        if (!rec.seen.includes(i)) { rec.seen.push(i); Store.saveSoon(); }
        if (speak) speakCard(k, it);
        if (!rec.done && rec.seen.length >= items.length) { rec.done = true; Store.save(); UI.reward(2, 'early').then(() => UI.mission('learn')); }
      }
      UI.bind(root, {
        say() { speakCard(k, items[i]); AA.sfx.play('pop'); },
        next() { i = (i + 1) % items.length; AA.sfx.play('tap'); show(true); },
        prev() { i = (i + items.length - 1) % items.length; AA.sfx.play('tap'); show(true); },
        play() { UI.go('play', { id: c.game }); }
      });
      show(false);
      setTimeout(() => speakCard(k, items[0]), 450);
    }
  };
})();

</script>

<script>

  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;

      return UI.topbar({ ur: d.ur, ro: d.ro }) +
        '<div class="pad col" style="align-items:center"><div class="step-card"><div class="se">' + d.e + '</div>' +
        '<div class="dua-ar ar" id="dua-ar">' + d.parts.map((x, k) => '<span class="part" data-p="' + k + '">' + AA.esc(x) + '</span>').join(' ') + '</div></div>' +
        '<div class="mic-ring" id="dmic" style="width:90px;height:90px;font-size:2.4rem;display:none">🗣️</div>' +
        '<div class="row wrap" style="justify-content:center"><button class="btn big blue" data-act="listen">' + UI.icon('sound') + ' Suno</button>' +
        '<button class="btn big green" data-act="echo">' + UI.icon('mic') + ' Saath bolo</button></div>' +
        '<button class="btn ' + (known ? 'sun' : 'ghost') + ' block" id="dknow" data-act="know">' + (known ? '⭐ Mujhe yaad hai!' : '☆ Mujhe yaad ho gayi') + '</button>' +
        '<div class="note" style="max-width:420px"><b>Matlab (walidain ke liye):</b> ' + AA.esc(d.tr) + '</div></div>';
    },
    mount(root, p) {
      const d = D.DUAS.find((x) => x.id === p.id);
      const rec = Store.p.duas[d.id] || (Store.p.duas[d.id] = { known: false, heard: 0 });
      const parts = AA.$$('.part', root), mic = AA.$('#dmic', root);
      const clear = () => { parts.forEach((x) => x.classList.remove('on')); mic.style.display = 'none'; mic.classList.remove('live'); };
      async function credit() {
        rec.heard++; Store.save();
        if (rec.heard === 1) { await UI.reward(1, 'dua'); }
        UI.mission('deen');
      }
      UI.bind(root, {
        async listen() {
          const my = ++duaRun; clear(); V.stop();
          await V.arab(d.ar, 0.8);
          if (my === duaRun) credit();
        },
        async echo() {
          const my = ++duaRun; V.stop(); clear();
          for (let k = 0; k < d.parts.length && my === duaRun; k++) {
            clear(); parts[k].classList.add('on');
            await V.arab(d.parts[k], 0.8);
            if (my !== duaRun) return;
            mic.style.display = 'grid'; mic.classList.add('live');
            await AA.wait(Math.max(1500, d.parts[k].length * 120) / sp());
          }
          if (my === duaRun) { clear(); AA.sfx.play('good'); V.praise(); credit(); }
        },
        async know(t) {
          rec.known = !rec.known; Store.save();
          t.className = 'btn block ' + (rec.known ? 'sun' : 'ghost'); t.textContent = rec.known ? '⭐ Mujhe yaad hai!' : '☆ Mujhe yaad ho gayi';
          if (rec.known) { AA.sfx.play('great'); UI.confetti(root, 24); if (!rec.rewarded) { rec.rewarded = true; Store.save(); await UI.reward(2, 'dua-known'); } }
        }
      });
    },
    leave() { duaRun++; }
  };

  /* ========================= SURAHEIN ========================= */
  // Awaaz: pehle offline cache, phir internet, warna phone ki awaaz
  AA.audioCache = 'aa-audio-v1';
  async function ayahSrc(url) {
    try {
      if ('caches' in window) { const c = await caches.open(AA.audioCache); const hit = await c.match(url); if (hit) return URL.createObjectURL(await hit.blob()); }
    } catch (e) {}
    return url;
  }
  let ayahAudio = null;
  function stopAyah() { try { if (ayahAudio) { ayahAudio.pause(); ayahAudio = null; } } catch (e) {} }
  async function playAyah(n, idx, text) {
    stopAyah(); V.stop();
    if (!Store.settings.sound) return;
    const url = D.ayahUrl(n, idx + 1);
    const key = text;
    if (V.clips[key]) return V.arab(key);
    const src = await ayahSrc(url);
    return new Promise((resolve) => {
      const a = new Audio(); ayahAudio = a; let done = false;
      const fin = (fallback) => { if (done) return; done = true; clearTimeout(tm); if (fallback) V.arab(text, 0.75).then(resolve); else resolve(); };
      const tm = setTimeout(() => { try { a.pause(); } catch (e) {} fin(true); }, 7000);
      a.onplaying = () => clearTimeout(tm);
      a.onended = () => fin(false);
      a.onerror = () => fin(true);
      a.src = src;
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => fin(true));
    });
  }
  AA.cacheSurahAudio = async function (onProgress) {
    if (!('caches' in window)) throw new Error('no cache');
    const c = await caches.open(AA.audioCache);
    const urls = [];
    D.SURAHS.forEach((s) => s.ayat.forEach((_, i) => urls.push(D.ayahUrl(s.n, i + 1))));
    let ok = 0;
    for (let i = 0; i < urls.length; i++) {
      try { if (!(await c.match(urls[i]))) { const r = await fetch(urls[i], { mode: 'cors' }); if (r.ok) await c.put(urls[i], r); else throw new Error('x'); } ok++; } catch (e) { /* is ayat ko chhod do */ }
      if (onProgress) onProgress(i + 1, urls.length, ok);
    }
    return { ok, total: urls.length };
  };

  S.surahs = {
    render() {
      return UI.topbar({ ur: 'چھوٹی سورتیں', ro: 'Suno aur yaad karo' }) +
        '<div class="list">' + D.SURAHS.map((s) => {
          const k = Store.p.surahs[s.n] && Store.p.surahs[s.n].known;
          return '<button class="lrow ' + (k ? 'done' : '') + '" data-act="open" data-n="' + s.n + '" style="--lc:' + s.color + '33"><span class="le">' + s.e + '</span><span class="lt"><b class="ur">' + s.ur + '</b><small>' + s.ro + ' • ' + s.ayat.length + ' ayat</small></span><span class="lr">' + (k ? '✅' : '▶') + '</span></button>';
        }).join('') + '</div><p class="center sub" style="padding:0 20px">Qari ki awaaz ke liye internet chahiye. Walidain "Parent" hissay se offline bhi kar sakte hain.</p>';
    },
    mount(root) { UI.bind(root, { open(t) { AA.sfx.play('whoosh'); UI.go('surah', { n: +t.dataset.n }); } }); }
  };

  let surahRun = 0;
  S.surah = {
    render(p) {
      const s = D.SURAHS.find((x) => x.n === p.n);
      const known = Store.p.surahs[s.n] && Store.p.surahs[s.n].known;
      return UI.topbar({ ur: s.ur, ro: s.ro }) +
        '<div class="pad col" style="align-items:center">' +
        '<div class="row wrap" style="justify-content:center"><button class="btn blue" data-act="all">' + UI.icon('play') + ' Suno</button><button class="btn green" data-act="echo">' + UI.icon('mic') + ' Dohrao</button><button class="btn ghost" id="hidebtn" data-act="hide">🙈 Chhupao</button></div>' +
        (s.n !== 1 ? '<div class="ar center" style="font-size:1.6rem;color:var(--ink2)">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>' : '') +
        '<div class="col" style="width:100%;max-width:460px" id="ayat">' + s.ayat.map((a, i) => '<div class="surah-ayah" data-act="ayah" data-i="' + i + '"><span class="no">' + (s.n === 1 ? i + 1 : i + 1) + '</span><span class="ar">' + AA.esc(a) + '</span></div>').join('') + '</div>' +
        '<button class="btn ' + (known ? 'sun' : 'ghost') + ' block" id="sknow" data-act="know" style="max-width:460px">' + (known ? '⭐ Mujhe yaad hai!' : '☆ Mujhe yaad ho gayi') + '</button>' +
        '<div class="note" style="max-width:460px">' + AA.esc(s.m) + '<br>Qari: Husary (Muallim) — har ayat ruk ruk kar, sikhane ke andaz mein.</div></div>';
    },
    mount(root, p) {
      const s = D.SURAHS.find((x) => x.n === p.n);
      const rec = Store.p.surahs[s.n] || (Store.p.surahs[s.n] = { known: false, heard: 0 });
      const cards = AA.$$('.surah-ayah', root);
      const mark = (i) => cards.forEach((c, k) => c.classList.toggle('on', k === i));
      let hiding = false;
      async function credit() {
        rec.heard++; Store.save();
        if (rec.heard === 1) await UI.reward(2, 'surah');
        UI.mission('deen');
      }
      UI.bind(root, {
        async all() {
          const my = ++surahRun; stopAyah(); V.stop();
          for (let i = 0; i < s.ayat.length && my === surahRun; i++) { mark(i); cards[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); await playAyah(s.n, i, s.ayat[i]); await AA.wait(250); }
          if (my === surahRun) { mark(-1); credit(); }
        },
        async echo() {
          const my = ++surahRun; stopAyah(); V.stop();
          for (let i = 0; i < s.ayat.length && my === surahRun; i++) {
            mark(i); cards[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
            await playAyah(s.n, i, s.ayat[i]);
            if (my !== surahRun) return;
            UI.floatText(root, '🗣️ Ab tum bolo', window.innerWidth / 2 - 70, window.innerHeight * 0.5, 'soft');
            await AA.wait(Math.max(1800, s.ayat[i].length * 110) / sp());
          }
          if (my === surahRun) { mark(-1); AA.sfx.play('good'); V.praise(); credit(); }
        },
        hide(t) { hiding = !hiding; cards.forEach((c) => c.classList.toggle('hide', hiding)); t.classList.toggle('on', hiding); t.innerHTML = hiding ? '👀 Dikhao' : '🙈 Chhupao'; },
        async ayah(t) {
          const i = +t.dataset.i; ++surahRun; mark(i);
          if (hiding) t.classList.remove('hide');
          await playAyah(s.n, i, s.ayat[i]);
          mark(-1);
        },
        async know(t) {
          rec.known = !rec.known; Store.save();
          t.className = 'btn block ' + (rec.known ? 'sun' : 'ghost'); t.textContent = rec.known ? '⭐ Mujhe yaad hai!' : '☆ Mujhe yaad ho gayi';
          if (rec.known) { AA.sfx.play('win'); UI.confetti(root, 30); if (!rec.rewarded) { rec.rewarded = true; Store.save(); await UI.reward(3, 'surah-known'); } }
        }
      });
    },
    leave() { surahRun++; stopAyah(); }
  };

  /* ========================= NAMAZ ========================= */
  S.namaz = {
    render() {
      const n = Store.p.namaz;
      const row = (act, e, ur, ro, done) => '<button class="lrow ' + (done ? 'done' : '') + '" data-act="' + act + '"><span class="le">' + e + '</span><span class="lt"><b class="ur">' + ur + '</b><small>' + ro + '</small></span><span class="lr">' + (done ? '✅' : '▶') + '</span></button>';
      return UI.topbar({ ur: 'نماز', ro: 'Wudu aur Namaz' }) +
        '<div class="list">' + row('wudu', '💧', 'وضو کیسے کریں', 'Wudu kaise karein', n.wudu > 0) + row('namazein', '🕌', 'پانچ نمازیں', 'Panch namazein', n.namazein > 0) + row('postures', '🧎', 'نماز کا طریقہ', 'Namaz ka tareeqa', n.postures > 0) + '</div>' +
        '<div class="note" style="margin:8px 16px">Namaz ke tafseeli masail apne ustad ya alim se seekhein — tareeqay mein fiqh ka farq ho sakta hai. Yahan bachon ke liye sirf bunyadi tasveeri tareeqa hai.</div>';
    },
    mount(root) { UI.bind(root, { wudu() { UI.go('wudu'); }, namazein() { UI.go('namazein'); }, postures() { UI.go('postures'); } }); }
  };

  // chhote "stepper" wale screens ke liye ek hi dhancha
  function stepper(name, titleUr, titleRo, items, cardFn, speakFn, key) {
    S[name] = {
      render() {
        return '<div class="lesson">' + UI.topbar({ ur: titleUr, ro: titleRo }) +
          '<div class="cards-wrap"><div class="dots-row" id="sd"></div><div class="step-card" id="sc" data-act="say"></div>' +
          '<div class="cards-nav"><button class="btn ghost" data-act="prev" aria-label="Pichla">' + UI.icon('back') + '</button><span class="count" id="sn"></span><button class="btn big green" data-act="next" aria-label="Agla">' + UI.icon('next') + '</button></div></div></div>';
      },
      mount(root) {
        let i = 0, maxI = 0, rewarded = Store.p.namaz[key] > 0;
        function show(speak) {
          const el = AA.$('#sc', root); el.innerHTML = cardFn(items[i], i); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
          AA.$('#sn', root).textContent = (i + 1) + ' / ' + items.length;
          AA.$('#sd', root).innerHTML = items.map((_, k) => '<i class="' + (k < i ? 'ok' : k === i ? 'cur' : '') + '"></i>').join('');
          if (speak) speakFn(items[i]);
        }
        UI.bind(root, {
          say() { speakFn(items[i]); },
          async next() {
            if (i < items.length - 1) { i++; maxI = Math.max(maxI, i); AA.sfx.play('tap'); show(true); }
            else if (!rewarded) { rewarded = true; Store.p.namaz[key] = 1; Store.save(); await UI.reward(3, key); UI.mission('deen'); UI.celebrate({ title: 'MashaAllah!', big: '🕌', sub: titleRo + ' seekh liya', voice: [AA.pick(D.PRAISE)] }); }
            else { AA.sfx.play('win'); UI.toast('Aap ne sab dekh liya ✅'); }
          },
          prev() { if (i > 0) { i--; show(true); } }
        });
        show(false); setTimeout(() => speakFn(items[0]), 400);
      },
      leave() {}
    };
  }
  stepper('wudu', 'وضو', 'Wudu — 8 qadam', D.WUDU,
    (w, i) => '<div class="se">' + w.e + '</div><div class="ur">' + w.ur + '</div>' + (w.cnt ? '<span class="cnt">' + w.cnt + ' baar</span>' : '') + '<div class="sub" style="margin-top:6px">' + w.ro + '</div>' + (w.ar ? '<div class="ar" style="font-size:2rem">' + w.ar + '</div>' : ''),
    (w) => { const list = [w]; if (w.ar) list.push({ ar: w.ar }); if (w.cnt) list.push({ ur: w.cnt === '1' ? 'ایک بار' : w.cnt === '3' ? 'تین بار' : w.cnt, hi: w.cnt === '1' ? 'एक बार' : 'तीन बार', ro: w.cnt + ' baar' }); V.seq(list); }, 'wudu');
  stepper('namazein', 'پانچ نمازیں', 'Panch Namazein', D.NAMAZEIN,
    (n) => '<div class="se">' + n.e + '</div><div class="ur" style="font-size:2.6rem">' + n.ur + '</div><span class="cnt">' + n.rak + ' rakat (fard)</span><div class="sub" style="margin-top:8px">' + n.when + '</div>',
    (n) => V.seq([n, { ur: D.NUMBERS[n.rak - 1].ur + ' رکعت', hi: D.NUMBERS[n.rak - 1].hi + ' रकअत', ro: n.rak + ' rakat' }]), 'namazein');

  // Namaz ke aasan figures
  function fig(id) {
    const body = '#FF7A59', skin = '#FFD9B0', cap = '#2ED1A0';
    const L = (x1, y1, x2, y2, c, w) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (c || body) + '" stroke-width="' + (w || 12) + '" stroke-linecap="round"/>';
    const H = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="15" fill="' + skin + '" stroke="#2B2250" stroke-width="2.5"/><path d="M' + (x - 15) + ' ' + (y - 3) + ' A15 15 0 0 1 ' + (x + 15) + ' ' + (y - 3) + ' Z" fill="' + cap + '"/>';
    const mat = '<rect x="10" y="172" width="210" height="14" rx="7" fill="#43A047"/>';
    let g = '';
    if (id === 'takbeer') g = L(95, 56, 95, 118) + L(95, 118, 88, 168, '#4B6BFB') + L(95, 118, 104, 168, '#4B6BFB') + L(95, 68, 74, 46) + L(95, 68, 116, 46) + H(95, 38);
    else if (id === 'qiyam') g = L(95, 56, 95, 118) + L(95, 118, 88, 168, '#4B6BFB') + L(95, 118, 104, 168, '#4B6BFB') + L(95, 70, 78, 90) + L(95, 70, 112, 90) + L(78, 90, 112, 90, '#FFD9B0', 8) + H(95, 38);
    else if (id === 'ruku') g = L(60, 100, 134, 100) + L(60, 100, 60, 168, '#4B6BFB') + L(60, 100, 74, 168, '#4B6BFB') + L(126, 102, 64, 134, '#FFD9B0', 9) + H(152, 100);
    else if (id === 'sajda') g = L(76, 112, 94, 168, '#4B6BFB') + L(94, 168, 40, 170, '#4B6BFB') + L(76, 112, 128, 154) + L(128, 154, 150, 172, '#FFD9B0', 9) + H(146, 156);
    else g = L(62, 92, 62, 150) + L(62, 150, 110, 156, '#4B6BFB') + L(110, 156, 50, 168, '#4B6BFB') + L(62, 100, 98, 148, '#FFD9B0', 9) + H(id === 'salam' ? 70 : 62, 72);
    return '<svg class="fig" viewBox="0 0 230 190" aria-hidden="true">' + mat + g + (id === 'salam' ? '<text x="150" y="62" font-size="28">↔️</text>' : '') + '</svg>';
  }
  stepper('postures', 'نماز کا طریقہ', 'Namaz kaise padhein', D.POSTURES,
    (p) => fig(p.id) + '<div class="ur" style="font-size:1.7rem">' + p.ur + '</div><div class="sub">' + p.ro + '</div>' + (p.ar ? '<div class="ar" style="font-size:1.8rem;line-height:1.7">' + p.ar + '</div>' : ''),
    (p) => { const l = [p]; if (p.ar) l.push({ ar: p.ar }); V.seq(l); }, 'postures');

  /* ========================= ACHHI BAATEIN ========================= */
  S.habits = {
    render() {
      const today = Store.habitsToday();
      return UI.topbar({ ur: 'اچھی باتیں', ro: 'Aaj main ne kya kiya?' }) +
        '<p class="center sub" style="padding:0 20px">Jo kaam aaj kiya uspar dabao — sitara milega ⭐</p>' +
        '<div class="list">' + D.HABITS.map((h) => '<button class="habit ' + (today.includes(h.id) ? 'on' : '') + '" data-act="h" data-id="' + h.id + '"><span class="he">' + h.e + '</span><span class="ht"><span class="ur">' + h.ur + '</span><small>' + h.ro + '</small></span><span class="hs">⭐</span></button>').join('') + '</div>';
    },
    mount(root) {
      UI.bind(root, {
        async h(t) {
          const h = D.HABITS.find((x) => x.id === t.dataset.id);
          const on = Store.toggleHabit(h.id);
          t.classList.toggle('on', on);
          if (on) { AA.sfx.play('great'); V.seq(h.ar ? [h, { ar: h.ar }, AA.pick(D.PRAISE)] : [h, AA.pick(D.PRAISE)]); await UI.reward(1, 'habit'); UI.mission('deen'); }
          else AA.sfx.play('tap');
        }
      });
    }
  };
})();

</script>
<script>
/* js/album.js */
/* Aghaaz-e-Asaas Kids — album.js
   Sticker album + "Yaad ka Darakht" (har seekha hua harf ek phal; dohrane se phal pakta hai). */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;

  S.album = {
    render() {
      const have = Store.p.stickers, info = Store.nextStickerInfo();
      const pct = info.done ? 100 : AA.clamp(Math.round(((info.have - info.prev) / (info.need - info.prev)) * 100), 0, 100);
      const grid = D.STICKERS.map((s) => have.includes(s) ? '<div class="stk" data-act="stk" data-s="' + s + '">' + s + '</div>' : '<div class="stk locked">❔</div>').join('');
      return UI.topbar({ ur: 'میرا باغ', ro: 'Mere stickers' }) +
        '<div class="pad" style="padding-bottom:0"><button class="btn big green block" data-act="tree">🌳 Yaad ka Darakht ' + UI.icon('next') + '</button></div>' +
        '<div class="pa progress-sticker" style="margin:6px 16px 0"><div class="row" style="justify-content:space-between"><b>' + have.length + ' / ' + D.STICKERS.length + ' stickers</b><span>⭐ ' + Store.p.stars + (info.done ? '' : ' / ' + info.need) + '</span></div>' +
        '<div class="bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>' +
        '<p class="center" style="margin-top:6px">' + (info.done ? 'MashaAllah! Saari album poori 🎉' : 'Agle sticker ke liye ' + Math.max(0, info.need - info.have) + ' ⭐ aur') + '</p></div>' +
        '<div class="stk-grid">' + grid + '</div>';
    },
    mount(root) {
      UI.bind(root, { tree() { AA.sfx.play('whoosh'); UI.go('tree'); }, stk(t) { AA.sfx.play('pop'); UI.pulse(t, 'wob'); t.style.animation = 'wobble .5s'; setTimeout(() => { t.style.animation = ''; }, 520); } });
    }
  };

  /* ---------- Yaad ka Darakht ---------- */
  // 28 phal, canopy ke andar jagah (viewBox 360 x 420)
  const SPOTS = (function () {
    const out = [];
    const rows = [[5, 180, 70, 50], [7, 180, 110, 90], [8, 180, 150, 118], [8, 180, 190, 130]];
    // har row: (kitne, cx, cy, half-width)
    rows.forEach(([n, cx, cy, hw]) => { for (let k = 0; k < n; k++) out.push([cx - hw + (2 * hw * (k + 0.5)) / n, cy + (k % 2 ? 8 : -4)]); });
    return out.slice(0, 28);
  })();
  const FRUIT_COL = ['#FF6FA8', '#FFB020', '#7BD65A', '#3DA9FC', '#C75BFF', '#FF7A59', '#2ED1A0'];

  S.tree = {
    render() {
      const states = D.LETTERS.map((_, i) => Store.letterState(i));
      const cnt = [0, 0, 0, 0]; states.forEach((s) => cnt[s]++);
      const fruits = D.LETTERS.map((L, i) => {
        const st = states[i], [x, y] = SPOTS[i];
        const col = st === 0 ? '#C9D3C0' : st === 1 ? '#9ED86B' : st === 3 ? '#B79B6A' : FRUIT_COL[i % FRUIT_COL.length];
        return '<g class="fruit s' + st + '" data-act="fr" data-i="' + i + '" role="button" aria-label="' + L.n + '">' +
          '<circle cx="' + x + '" cy="' + y + '" r="' + (st === 0 ? 11 : 15) + '" fill="' + col + '" stroke="#2B2250" stroke-opacity=".35" stroke-width="2"/>' +
          (st === 0 ? '' : '<text x="' + x + '" y="' + (y + 7) + '" text-anchor="middle" font-size="19" font-family="Amiri,\'Noto Naskh Arabic\',serif" fill="#2B2250">' + L.ch + '</text>') +
          '</g>';
      }).join('');
      const ripe = cnt[2], growing = cnt[1], thirsty = cnt[3];
      const msg = thirsty ? '💧 ' + thirsty + ' phal ko paani chahiye!' : (ripe + growing + thirsty === 0 ? 'Harf seekho — pehla phal ugega 🌱' : ripe >= 28 ? 'Poora darakht pak gaya! MashaAllah 🎉' : 'Dohrate raho — phal pakte jayenge 🍎');
      return UI.topbar({ ur: 'یاد کا درخت', ro: 'Yaad ka Darakht' }) +
        '<div class="tree-wrap"><svg viewBox="0 0 360 420" role="img" aria-label="Yaad ka darakht">' +
        '<circle cx="300" cy="46" r="26" fill="#FFD84D"/>' +
        '<path d="M160 420 C165 330 170 290 168 240 L192 240 C190 290 196 330 200 420 Z" fill="#9B6B3F"/>' +
        '<ellipse cx="180" cy="130" rx="168" ry="118" fill="#4FBF6A"/><ellipse cx="110" cy="160" rx="90" ry="70" fill="#5ACB74"/><ellipse cx="256" cy="160" rx="90" ry="70" fill="#5ACB74"/>' +
        '<ellipse cx="180" cy="396" rx="150" ry="16" fill="#000" opacity=".06"/>' +
        fruits + '</svg></div>' +
        '<p class="tree-msg"><b>' + msg + '</b></p>' +
        '<div class="row wrap" style="justify-content:center;margin-top:10px"><span class="chip">🍎 ' + ripe + ' paka</span><span class="chip">🌱 ' + growing + ' ug raha</span><span class="chip">🥀 ' + thirsty + ' pyasa</span></div>' +
        '<div class="pad col" style="align-items:center"><button class="btn big blue" data-act="water">💧 Paani do</button></div>';
    },
    mount(root) {
      UI.bind(root, {
        fr(t) {
          const i = +t.dataset.i, L = D.LETTERS[i];
          AA.sfx.play('pop');
          if (Store.letterState(i) === 0) { UI.toast('Yeh harf abhi seekhna hai 🌱'); return; }
          V.seq([{ ar: L.say }]);
          UI.floatText(root, L.n, window.innerWidth / 2 - 30, window.innerHeight * 0.55, 'soft');
        },
        water() { AA.sfx.play('whoosh'); UI.go('play', { id: 'review' }); }
      });
    }
  };
})();

<script>
/* js/parent.js */
/* Aghaaz-e-Asaas Kids — parent.js
   Walidain ka hissa: hafta-waar report, settings, ammi/abbu ki awaaz record karna, bachon ka intezam. */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;
  const DAYN = ['Ait', 'Pir', 'Mang', 'Budh', 'Jum', 'Jumaa', 'Hafta'];
  const dayShort = (d) => ['Itwar', 'Peer', 'Mangal', 'Budh', 'Jumerat', 'Jumma', 'Hafta'][new Date(d + 'T12:00:00').getDay()].slice(0, 3);

  function report() {
    const days = AA.weekDays();
    const mins = days.map((d) => Math.round(((Store.p.days[d] && Store.p.days[d].sec) || 0) / 60));
    const max = Math.max(10, ...mins);
    const learned = Store.learnedList().length, mastered = Store.masteredList().length;
    const weak = Store.weakList(6);
    const activeDays = days.filter((d) => Store.active(d)).length;
    const duasKnown = Object.values(Store.p.duas).filter((x) => x.known).length;
    const surKnown = Object.values(Store.p.surahs).filter((x) => x.known).length;
    return { days, mins, max, learned, mastered, weak, activeDays, duasKnown, surKnown, total: mins.reduce((a, b) => a + b, 0) };
  }
  function shareText(r) {
    const n = Store.profile.name;
    return '📒 ' + n + ' ki hafta-waar report (Aghaaz-e-Asaas)\n' +
      '• Is hafte ' + r.activeDays + ' din practice, kul ' + r.total + ' minute\n' +
      '• Harf seekhe: ' + r.learned + '/28 (pakke yaad: ' + r.mastered + ')\n' +
      '• Duaein yaad: ' + r.duasKnown + '/' + D.DUAS.length + ', surahein yaad: ' + r.surKnown + '/' + D.SURAHS.length + '\n' +
      '• Sitare: ' + Store.p.stars + ', stickers: ' + Store.p.stickers.length + '\n' +
      (r.weak.length ? '• Dohrane wale harf: ' + r.weak.map((i) => D.LETTERS[i].n).join(', ') + '\n' : '');
  }

  const tg = (id, on) => '<button class="toggle ' + (on ? 'on' : '') + '" data-act="tg" data-k="' + id + '" role="switch" aria-checked="' + !!on + '"></button>';
  const pills = (k, opts, cur) => '<div class="pills">' + opts.map(([v, l]) => '<button class="pill ' + (String(cur) === String(v) ? 'on' : '') + '" data-act="pl" data-k="' + k + '" data-v="' + v + '">' + l + '</button>').join('') + '</div>';

  // record karne ki list: harf, alfaaz, duaein  (key = arabic text; Voice.arab pehle yahi clip bajata hai)
  function recItems(tab) {
    if (tab === 'letters') return D.LETTERS.map((L) => ({ key: L.say, ar: L.ch, nm: L.n }));
    if (tab === 'words') { const seen = {}; return D.LETTERS.filter((L) => L.w && L.w.ar).map((L) => ({ key: L.w.ar, ar: L.w.e, nm: L.w.ro + ' (' + L.w.ar + ')' })).filter((x) => !seen[x.key] && (seen[x.key] = 1)); }
    return D.DUAS.map((d) => ({ key: d.ar, ar: d.e, nm: d.ro }));
  }

  S.parent = {
    render() {
      const r = report(), st = Store.settings, prof = Store.profile;
      const bars = r.days.map((d, i) => '<div class="' + (d === AA.today() ? 'today' : '') + '"><span>' + (r.mins[i] || '') + '</span><i style="height:' + Math.round((r.mins[i] / r.max) * 70) + 'px"></i><span>' + dayShort(d) + '</span></div>').join('');
      return '<div class="parent">' + UI.topbar({ ro: 'Walidain ka hissa', right: '' }) +
        '<div class="pa"><h3>📒 ' + AA.esc(prof.name) + ' — is hafte ki report</h3>' +
        '<div class="kpis"><div class="kpi"><b>' + Store.streak() + '🔥</b><small>din lagatar</small></div><div class="kpi"><b>' + Store.todayMinutes() + '</b><small>minute aaj</small></div><div class="kpi"><b>' + r.learned + '/28</b><small>harf seekhe</small></div>' +
        '<div class="kpi"><b>' + r.mastered + '</b><small>pakke yaad</small></div><div class="kpi"><b>' + r.duasKnown + '/' + D.DUAS.length + '</b><small>duaein</small></div><div class="kpi"><b>' + r.surKnown + '/' + D.SURAHS.length + '</b><small>surahein</small></div></div>' +
        '<div class="bars">' + bars + '</div><p class="center">Minute har din (7 din)</p>' +
        (r.weak.length ? '<p><b>Dohrane wale harf:</b></p><div class="weak">' + r.weak.map((i) => '<span class="ar">' + D.LETTERS[i].ch + '</span>').join('') + '</div><button class="mini" style="margin-top:8px" data-act="rev">💧 Inhein dohrao</button>' : '<p>Abhi koi harf kamzor nahi 👍</p>') +
        '<div class="row wrap" style="margin-top:10px"><button class="mini gray" data-act="share">📤 Report bhejein</button></div></div>' +

        '<div class="pa"><h3>⚙️ Settings</h3>' +
        '<div class="set-row"><div class="lbl"><b>Awaaz</b><small>Awaaz aur effects</small></div>' + tg('sound', st.sound) + '</div>' +
        '<div class="set-row"><div class="lbl"><b>Bolne ki raftaar</b></div>' + pills('speed', [[0.8, 'Dheemi'], [1, 'Normal'], [1.15, 'Tez']], st.speed) + '</div>' +
        '<div class="set-row"><div class="lbl"><b>English bhi bolo</b><small>Urdu ke baad English lafz</small></div>' + tg('bilingual', st.bilingual) + '</div>' +
        '<div class="set-row"><div class="lbl"><b>Rozana waqt ki had</b><small>Poora hone par "aaram" screen</small></div>' + pills('limit', [[0, 'Band'], [10, '10'], [20, '20'], [30, '30'], [45, '45']], st.limit) + '</div>' +
        '<div class="set-row"><div class="lbl"><b>Theme</b></div>' + pills('theme', [['auto', 'Auto'], ['light', 'Din'], ['night', 'Raat']], st.theme) + '</div>' +
        '</div>' +

        '<div class="pa"><h3>🎙️ Ammi/Abbu ki awaaz</h3><p>Bachche apni ammi ya abbu ki awaaz mein seekhein to yaad zyada rehta hai. Neeche kisi bhi cheez par record dabayein — jahan recording ho, wahan phone ki awaaz ki jagah aap ki awaaz bajegi.</p>' +
        '<div class="pills" style="justify-content:flex-start;margin:8px 0">' + [['letters', 'Harf'], ['words', 'Alfaaz'], ['duas', 'Duaein']].map(([k, l]) => '<button class="pill ' + (k === 'letters' ? 'on' : '') + '" data-act="rtab" data-k="' + k + '">' + l + '</button>').join('') + '</div>' +
        '<div id="rec-list"></div>' +
        '<div class="row wrap" style="margin-top:10px"><button class="mini gray" data-act="rexp">⬇️ Backup</button><button class="mini gray" data-act="rimp">⬆️ Wapas laayein</button><input type="file" id="rfile" accept="application/json" hidden></div></div>' +

        '<div class="pa"><h3>📶 Offline aur install</h3><p>Phone ke browser menu se <b>"Add to Home Screen"</b> chunein — phir app internet ke baghair bhi chalegi.</p>' +
        '<button class="mini" data-act="cache">⬇️ Surahon ki qari awaaz offline karein</button><p id="cache-st" class="note" style="display:none"></p></div>' +

        '<div class="pa"><h3>👧 Bachon ka intezam</h3>' +
        '<div class="set-row"><div class="lbl"><b>' + prof.avatar + ' ' + AA.esc(prof.name) + '</b><small>' + (prof.age === 'bada' ? 'Bada (5–7 saal)' : 'Nanha (3–4 saal)') + '</small></div>' + pills('age', [['nanha', 'Nanha'], ['bada', 'Bada']], prof.age) + '</div>' +
        '<div class="row wrap" style="margin-top:8px"><button class="mini gray" data-act="switch">👥 Dost badlein</button><button class="mini gray" data-act="exp">📦 Progress save</button><button class="mini red" data-act="reset">🔄 Progress saaf</button><button class="mini red" data-act="del">🗑️ Hata dein</button></div></div>' +

        '<div class="pa"><h3>📚 Seekhne ka tareeqa</h3>' +
        '<p><b>1. Dekho</b> — harf ka bada rang-birangi nishan aur ek tasveer wala lafz.<br><b>2. Suno</b> — awaaz aur harf ek saath.<br><b>3. Chhoo kar likho</b> — ungli se (5+ saal).<br><b>4. Rang bharo</b> — harf ko apna rang do; rang aur harakat se yaad pakki hoti hai.<br><b>5. Pehchano</b> — galti par sazaa nahi, bas dobara mauqa.</p>' +
        '<p>Har seekha hua harf agle din, phir 2, 4, 8, 16 din baad khud wapas aata hai ("Paani do") — yeh yaad pakki karne ka tareeqa hai.</p>' +
        '<p class="note">Deeni matn (duaein/surahein) walidain ya ustad se zaroor sun kar tasdeeq kar lein. Tafseeli masail ke liye apne alim se rujoo karein.</p></div>' +
        '</div>';
    },
    mount(root) {
      const r = report();
      let tab = 'letters', rec = null, recKey = null;
      const list = AA.$('#rec-list', root);
      function drawList() {
        list.innerHTML = recItems(tab).map((it) => '<div class="rec-row ' + (recKey === it.key ? 'live' : '') + '" data-key="' + AA.esc(it.key) + '"><span class="ar-big ar">' + it.ar + '</span><span class="nm">' + AA.esc(it.nm) + '<small>' + (V.hasClip(it.key) ? '✅ Recording hai' : 'Phone ki awaaz') + '</small></span>' +
          '<button class="mini gray" data-act="rplay" data-key="' + AA.esc(it.key) + '" aria-label="Sunein">▶</button><button class="mini ' + (recKey === it.key ? 'red' : '') + '" data-act="rrec" data-key="' + AA.esc(it.key) + '">' + (recKey === it.key ? '⏹ Ruko' : '⏺ Record') + '</button>' +
          (V.hasClip(it.key) ? '<button class="mini gray" data-act="rdel" data-key="' + AA.esc(it.key) + '" aria-label="Hatayein">✕</button>' : '') + '</div>').join('');
      }
      drawList();
      async function toggleRec(key) {
        if (rec) { rec.stop(); return; }
        if (!navigator.mediaDevices || !window.MediaRecorder) { UI.toast('Is browser mein record nahi ho sakta'); return; }
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { UI.toast('Mic ki ijazat dein'); return; }
        const chunks = []; const mr = new MediaRecorder(stream);
        rec = mr; recKey = key; drawList();
        mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
          const url = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
          rec = null; recKey = null;
          if (blob.size > 800) { await V.saveClip(key, url); UI.toast('Recording save ✅'); }
          drawList();
        };
        mr.start();
        setTimeout(() => { if (rec === mr && mr.state === 'recording') mr.stop(); }, 8000);
      }
      const setK = (k, v) => { Store.settings[k] = v; Store.saveSettings(); };
      UI.bind(root, {
        tg(t) { const k = t.dataset.k; setK(k, !Store.settings[k]); t.classList.toggle('on', Store.settings[k]); t.setAttribute('aria-checked', Store.settings[k]); if (k === 'sound' && Store.settings.sound) AA.sfx.play('good'); },
        pl(t) {
          const k = t.dataset.k; let v = t.dataset.v;
          if (k === 'age') { Store.updateProfile(Store.profile.id, { age: v }); UI.refresh(); return; }
          if (k === 'speed' || k === 'limit') v = +v;
          setK(k, v);
          AA.$$('[data-act=pl][data-k=' + k + ']', root).forEach((b) => b.classList.toggle('on', b === t));
          if (k === 'speed') V.seq([D.T.shabash || AA.pick(D.PRAISE)]);
        },
        rev() { UI.go('play', { id: 'review' }); },
        async share() {
          const txt = shareText(r);
          try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (e) { return; }
          try { await navigator.clipboard.writeText(txt); UI.toast('Report copy ho gayi — WhatsApp mein paste karein'); } catch (e) { prompt('Copy karein:', txt); }
        },
        rtab(t) { tab = t.dataset.k; AA.$$('[data-act=rtab]', root).forEach((b) => b.classList.toggle('on', b === t)); drawList(); },
        rplay(t) { V.sayAr(t.dataset.key); },
        rrec(t) { toggleRec(t.dataset.key); },
        async rdel(t) { await V.deleteClip(t.dataset.key); drawList(); },
        async rexp() {
          const o = {}; Object.keys(V.clips).forEach((k) => { if (V.clips[k] && String(V.clips[k]).startsWith('data:')) o[k] = V.clips[k]; });
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' })); a.download = 'ustad-awaaz.json'; a.click();
        },
        rimp() { AA.$('#rfile', root).click(); },
        async cache() {
          const st = AA.$('#cache-st', root); st.style.display = 'block'; st.textContent = 'Download ho raha hai…';
          try { const o = await AA.cacheSurahAudio((i, n) => { st.textContent = 'Download: ' + i + ' / ' + n; }); st.textContent = o.ok === o.total ? '✅ Sab surahein offline ho gayin' : '⚠️ ' + o.ok + '/' + o.total + ' mil sakeen. Internet check karke dobara koshish karein.'; }
          catch (e) { st.textContent = 'Is browser mein offline cache nahi chalta.'; }
        },
        switch() { UI.go('profiles'); },
        exp() {
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Store.exportProfile()], { type: 'application/json' })); a.download = 'progress-' + Store.profile.name + '.json'; a.click();
        },
        reset() {
          const m = UI.modal('<div class="gate"><h3>Progress saaf karein?</h3><p class="sub">Sitare, stickers aur seekhe hue harf mita diye jayenge.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn red" data-y="1">Haan, saaf</button><button class="btn ghost" data-y="0">Nahi</button></div></div>');
          m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-y]'); if (!b) return; if (b.dataset.y === '1') { Store.resetProgress(); UI.toast('Saaf ho gaya'); UI.refresh(); } UI.closeModal(m); });
        },
        del() {
          const m = UI.modal('<div class="gate"><h3>' + AA.esc(Store.profile.name) + ' ko hata dein?</h3><p class="sub">Yeh wapas nahi aayega.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn red" data-y="1">Haan, hata do</button><button class="btn ghost" data-y="0">Nahi</button></div></div>');
          m.el.addEventListener('click', (e) => {
            const b = e.target.closest('[data-y]'); if (!b) return;
            UI.closeModal(m);
            if (b.dataset.y === '1') { Store.deleteProfile(Store.profile.id); if (Store.profiles.length) UI.go('profiles', {}, { root: true }); else UI.go('welcome', {}, { root: true }); }
          });
        }
      });
      AA.$('#rfile', root).addEventListener('change', async (e) => {
        const f = e.target.files[0]; if (!f) return;
        try { const j = JSON.parse(await f.text()); let n = 0; for (const k of Object.keys(j)) { if (String(j[k]).startsWith('data:')) { await V.saveClip(k, j[k]); n++; } } UI.toast(n + ' recording wapas aa gayin'); drawList(); }
        catch (err) { UI.toast('File sahi nahi hai'); }
      });
    },
    leave() { V.stop(); }
  };
})();

</script>
<script>
/* js/boot.js */
/* Aghaaz-e-Asaas Kids — boot.js : sab kuch shuru karta hai */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, V = AA.voice;

  function hideSplash() {
    const s = document.getElementById('splash');
    if (!s) return;
    s.classList.add('out');
    setTimeout(() => s.remove(), 600);
  }

  // koi galti ho to splash par likh do (taake pata chale), splash hamesha hat jaye
  window.addEventListener('error', (e) => {
    if (AA.booted) return;
    const sp = document.getElementById('splash');
    if (sp) { let d = document.getElementById('boot-err'); if (!d) { d = document.createElement('pre'); d.id = 'boot-err'; d.style.cssText = 'position:absolute;left:12px;right:12px;bottom:16px;font:12px/1.4 monospace;color:#b00020;white-space:pre-wrap;direction:ltr;text-align:left;max-height:40%;overflow:auto;background:#fff;padding:8px;border-radius:8px'; sp.appendChild(d); } d.textContent += (e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '') + '\n'; }
  });
  /* ---------- install popup ---------- */
  function offerInstall() {
    try {
      if (AA.installShown || !AA.booted || !/^https?:$/.test(location.protocol)) return;
      const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
      if (standalone) return;
      const st = AA.lsGet('aa:install', {}) || {};
      if (st.done || (st.later && Date.now() - st.later < 7 * 864e5)) return;
      const cur = UI.cur && UI.cur.name;
      if (cur !== 'home' && cur !== 'welcome') { setTimeout(offerInstall, 8000); return; }
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios && !AA.installPrompt) return;   // Android/Chrome: browser tayyar ho tab dikhao
      AA.installShown = true;
      const body = ios
        ? '<p class="sub">Safari mein neeche <b>Share</b> (⬆️) dabayein, phir <b>"Add to Home Screen"</b> chunein.</p>'
        : '<p class="sub">Home screen par rakhein — phir app internet ke baghair bhi chalegi.</p>';
      const m = UI.modal('<div class="gate"><div style="font-size:3rem">📲</div><h3>App phone mein rakh lein</h3>' + body +
        '<div class="row" style="justify-content:center;margin-top:12px">' + (ios ? '' : '<button class="btn green" data-i="yes">Install karein</button>') + '<button class="btn ghost" data-i="later">' + (ios ? 'Theek hai' : 'Baad mein') + '</button></div></div>');
      m.el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-i]'); if (!b) return;
        if (b.dataset.i === 'yes' && AA.installPrompt) {
          try { AA.installPrompt.prompt(); const r = await AA.installPrompt.userChoice; if (r && r.outcome === 'accepted') AA.lsSet('aa:install', { done: 1 }); else AA.lsSet('aa:install', { later: Date.now() }); } catch (x) {}
        } else AA.lsSet('aa:install', { later: Date.now() });
        UI.closeModal(m);
      });
    } catch (e) { console.warn(e); }
  }
  function start() {
    document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'ur');
    try { const n = document.getElementById('splash-noori'); if (n) n.innerHTML = UI.mascot('happy', 'splash-m'); } catch (e) {}
    try { V.init(); } catch (e) { console.error(e); }
    try { Store.init(); } catch (e) { console.error(e); }
    try { UI.startTimer(); } catch (e) { console.error(e); }
    try { UI.go(Store.profile ? 'home' : 'welcome', {}, { root: true }); AA.booted = true; } catch (e) { console.error(e); const d = document.getElementById('boot-err'); if (d) d.textContent += 'go: ' + e.message; return; }
    setTimeout(hideSplash, 700);

    // pehli touch par audio chalu (browser ki shart)
    const unlock = () => { try { AA.sfx.play('tap'); } catch (e) {} window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock, { once: true });

    // install
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); AA.installPrompt = e; setTimeout(offerInstall, 3500); });
    window.addEventListener('appinstalled', () => { AA.installPrompt = null; AA.lsSet('aa:install', { done: 1 }); });
    setTimeout(offerInstall, 6000);

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('sw', e));
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
