<!DOCTYPE html>
<html lang="ur-Latn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>آغازِ اساس - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37; --gold-light: #F3E5AB;
            --emerald: #0f5132; --emerald-light: #198754;
            --bg-dark: #0a192f; --text-light: #e0e1dd;
            --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.15);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Nunito', sans-serif; color: var(--text-light); background-image: radial-gradient(circle at 50% 0%, #172a45 0%, #0a192f 100%); min-height: 100vh; }

        /* LOGIN SCREEN */
        #login-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .login-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card img { width: 80px; border-radius: 20px; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .login-card h1 { font-family: 'Amiri', serif; color: var(--gold); font-size: 32px; margin: 15px 0 5px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 12px; color: var(--gold-light); margin-left: 5px; font-weight: bold; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; color: white; font-size: 16px; outline: none; font-family: 'Nunito'; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #b8860b); border: none; border-radius: 10px; color: #000; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); margin-top: 10px; }
        #login-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: bold; }

        /* MAIN APP HEADER */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(10, 25, 47, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--glass-border); }
        .header-title { font-family: 'Amiri', serif; font-size: 22px; color: var(--gold); margin: 0; }
        .user-info { text-align: right; }
        .user-info span { font-size: 12px; color: #a0a0a0; display: block; }
        .user-info strong { font-size: 14px; color: var(--gold-light); }
        .admin-panel { display: flex; gap: 10px; margin-top: 5px; }
        .admin-btn { background: var(--emerald); color: white; border: none; padding: 4px 8px; border-radius: 5px; font-size: 10px; cursor: pointer; font-weight: bold; }

        /* DASHBOARD */
        #dashboard { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .lesson-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px 15px; text-align: center; position: relative; cursor: pointer; transition: 0.3s; overflow: hidden; }
        .lesson-card:active { transform: scale(0.96); }
        .lesson-card.locked { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .lesson-card h3 { margin: 0 0 5px 0; font-size: 16px; color: var(--gold-light); }
        .lesson-card p { margin: 0; font-size: 12px; color: #a0a0a0; }
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 18px; }

        /* LESSON VIEW */
        #lesson-view { display: none; padding: 20px; flex-direction: column; align-items: center; text-align: center; }
        .back-btn { align-self: flex-start; background: transparent; border: none; color: var(--gold); font-size: 16px; font-weight: bold; margin-bottom: 20px; cursor: pointer; }
        .letter-display { font-family: 'Amiri', serif; font-size: 120px; color: var(--gold); text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); margin: 10px 0; line-height: 1; }
        .action-btns { display: flex; gap: 15px; margin-bottom: 20px; }
        .action-btn { background: var(--glass); border: 1px solid var(--gold); color: var(--gold-light); padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        /* VOICE RECOGNITION */
        .mic-container { margin: 10px 0 20px; text-align: center; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b, #dc3545); border: 4px solid rgba(255,255,255,0.2); color: white; font-size: 32px; cursor: pointer; box-shadow: 0 0 20px rgba(220, 53, 69, 0.5); transition: 0.3s; display: flex; justify-content: center; align-items: center; margin: 0 auto; }
        .mic-btn.listening { animation: pulse 1.5s infinite; background: #198754; box-shadow: 0 0 30px rgba(25, 135, 84, 0.7); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .voice-status { margin-top: 15px; font-size: 16px; font-weight: bold; color: #a0a0a0; min-height: 24px; }
        .voice-success { color: #2fbf71; }
        .voice-fail { color: #ff6b6b; }

        /* TRACING CANVAS */
        .canvas-container { position: relative; width: 300px; height: 300px; background: rgba(255,255,255,0.05); border: 2px dashed var(--glass-border); border-radius: 20px; overflow: hidden; margin: 20px 0; display: none; }
        .canvas-bg-letter { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-family: 'Amiri', serif; font-size: 180px; color: rgba(255, 255, 255, 0.1); pointer-events: none; }
        #tracing-canvas { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
        .clear-btn { background: rgba(255, 0, 0, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }

        /* SUCCESS MODAL */
        #success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { background: var(--bg-dark); padding: 30px; border-radius: 20px; text-align: center; border: 2px solid var(--gold); box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); max-width: 300px; }
        .modal-content h2 { color: var(--gold); font-family: 'Amiri'; font-size: 30px; margin: 0 0 10px; }
        .modal-content p { color: #a0a0a0; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <img src="qari-192.png" alt="Logo">
            <h1>آغازِ اساس</h1>
            <p style="font-size: 12px; color: #a0a0a0; margin-bottom: 20px;">Premium Noorani Qaida</p>
            
            <div class="input-group">
                <label>Role</label>
                <select id="role">
                    <option value="guest">Guest (Bacha)</option>
                    <option value="admin">Admin (Fauzan)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" id="name" placeholder="Misaal: Bilal">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">Start Learning</button>
            <p id="login-msg"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" style="display: none;">
        <header class="app-header">
            <h1 class="header-title">آغازِ اساس</h1>
            <div class="user-info">
                <span id="welcome-text">Welcome</span>
                <strong id="user-name-display">User</strong>
                <div class="admin-panel" id="admin-panel" style="display: none;">
                    <button class="admin-btn" onclick="unlockAll()">Unlock All</button>
                    <button class="admin-btn" style="background: #dc3545;" onclick="logout()">Logout</button>
                </div>
                <button class="admin-btn" id="logout-btn" style="display: none; background: #555; margin-top: 5px;" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="dashboard"></div>

        <!-- LESSON VIEW -->
        <div id="lesson-view">
            <button class="back-btn" onclick="closeLesson()">⬅ Wapas (Dashboard)</button>
            
            <div class="letter-display" id="current-letter">ا</div>
            <p style="color: var(--gold-light); margin-bottom: 10px; font-weight: bold; font-size: 20px;" id="current-roman">Alif</p>
            
            <div class="action-btns">
                <button class="action-btn" onclick="playAudio()">🔊 Suniye</button>
                <button class="action-btn" onclick="toggleTracing()">✍️ Likhna Seekhein</button>
            </div>

            <!-- VOICE RECOGNITION -->
            <div class="mic-container">
                <button class="mic-btn" id="mic-btn" onclick="startListening()">🎤</button>
                <div class="voice-status" id="voice-status">Mic dabayein aur bolain</div>
            </div>

            <!-- TRACING AREA -->
            <div class="canvas-container" id="canvas-box">
                <div class="canvas-bg-letter" id="bg-letter">ا</div>
                <canvas id="tracing-canvas"></canvas>
            </div>
            <button class="clear-btn" id="clear-btn" onclick="clearCanvas()">Clear Board</button>

            <!-- NEXT BUTTON -->
            <button class="btn-primary" id="next-btn" style="margin-top: 20px; max-width: 300px; display: none;" onclick="completeLesson()">Sahi Hai! Aage Barhein ➡</button>
        </div>
    </div>

    <!-- SUCCESS MODAL -->
    <div id="success-modal">
        <div class="modal-content">
            <h2>MashaAllah!</h2>
            <p>Aapne yeh sabaq mukammal kar liya hai. Agla sabaq unlock ho gaya hai!</p>
            <button class="btn-primary" onclick="closeSuccess()">Dashboard</button>
        </div>
    </div>

    <script src="courseData.js"></script>
    <script src="app.js"></script>
</body>
</html>
