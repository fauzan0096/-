<!DOCTYPE html>
<html lang="ur-Latn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>آغازِ اساس - Kids App</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF6B6B; --pink-dark: #EE5253;
            --blue: #48DBFB; --blue-dark: #0ABDE3;
            --yellow: #FECA57; --yellow-dark: #FF9F43;
            --purple: #9B59B6; --purple-dark: #8E44AD;
            --bg: #F0F8FF; --text: #2C3E50; --text-light: #7F8C8D;
            --card: #FFFFFF; --shadow: 0 8px 0 #D1D8E0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Fredoka', sans-serif; color: var(--text); padding-bottom: 80px; }

        /* LOGIN SCREEN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .login-card { background: var(--card); border: 4px solid #E2DFD8; padding: 30px 20px; border-radius: 35px; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .login-card img { width: 100px; border-radius: 25px; border: 4px solid var(--pink); box-shadow: 0 8px 0 var(--pink-dark); margin-bottom: 10px; }
        .login-card h1 { font-family: 'Amiri', serif; color: var(--pink-dark); font-size: 36px; margin: 15px 0 5px; text-shadow: 2px 2px 0px #FFE5B4; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 14px; color: var(--text-light); margin-left: 10px; font-weight: 700; }
        .input-group input { width: 100%; padding: 15px; background: #F8F9FA; border: 3px solid #E2DFD8; border-radius: 18px; color: var(--text); font-size: 16px; outline: none; font-family: 'Fredoka'; font-weight: 600; }
        .input-group input:focus { border-color: var(--blue); }
        .btn-login { width: 100%; padding: 16px; background: var(--pink); border: none; border-radius: 18px; color: #fff; font-weight: 700; font-size: 20px; cursor: pointer; box-shadow: 0 6px 0 var(--pink-dark); margin-top: 10px; font-family: 'Fredoka'; transition: 0.1s; }
        .btn-login:active { transform: translateY(6px); box-shadow: 0 0 0 var(--pink-dark); }
        #login-msg { color: #E74C3C; font-size: 14px; margin-top: 15px; min-height: 20px; font-weight: 700; }

        /* BOTTOM NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0 20px; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #A0A0A0; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.3s; border: none; background: none; font-family: 'Fredoka'; }
        .nav-item .icon { font-size: 26px; filter: grayscale(1); transition: 0.3s; }
        .nav-item.active { color: var(--pink-dark); transform: translateY(-5px); }
        .nav-item.active .icon { filter: grayscale(0); transform: scale(1.2); }

        /* PAGES */
        .page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .page-title { font-size: 28px; color: var(--text); margin: 10px 0 20px; text-align: center; text-shadow: 2px 2px 0 #fff; }

        /* Q CARDS */
        #qaida-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .q-card { background: var(--card); border: 4px solid #E2DFD8; border-radius: 25px; padding: 20px 10px; text-align: center; position: relative; cursor: pointer; box-shadow: 0 8px 0 #E2DFD8; transition: 0.1s; }
        .q-card:active { transform: translateY(8px); box-shadow: 0 0 0 #E2DFD8; }
        .q-card.locked { opacity: 0.7; filter: grayscale(1); cursor: not-allowed; }
        .q-card h3 { margin: 0 0 5px; font-size: 18px; color: var(--blue-dark); }
        .q-card p { margin: 0; font-size: 13px; color: var(--text-light); font-weight: 600; }
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 20px; }

        /* DUA & STORY CARDS */
        .dua-card { background: linear-gradient(135deg, #FFF, #F0F8FF); border: 4px solid var(--blue); border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 0 var(--blue-dark); text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .dua-info h3 { margin: 0 0 5px; font-family: 'Amiri', serif; font-size: 26px; color: var(--blue-dark); }
        .dua-info p { margin: 0; font-size: 16px; font-weight: 700; color: var(--text); }
        .btn-play-small { background: var(--yellow); border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 var(--yellow-dark); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .btn-play-small:active { transform: translateY(4px); box-shadow: none; }
        
        .story-card { background: linear-gradient(135deg, #FFF, #FFF5F5); border: 4px solid var(--pink); border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 0 var(--pink-dark); display: flex; align-items: center; gap: 15px; }
        .story-emoji { font-size: 40px; background: white; padding: 10px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .story-info h3 { margin: 0 0 5px; font-size: 20px; color: var(--pink-dark); }
        .story-info p { margin: 0; font-size: 15px; color: var(--text-light); font-weight: 600; line-height: 1.3; }

        /* MODALS & OVERLAYS (Lesson View) */
        #lesson-view { position: fixed; inset: 0; background: #F0F8FF; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; left: 20px; background: #fff; border: 3px solid #E2DFD8; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 #E2DFD8; display: flex; justify-content: center; align-items: center; }
        .close-btn:active { transform: translateY(4px); box-shadow: none; }
        .big-letter { font-family: 'Amiri', serif; font-size: 150px; color: var(--purple-dark); text-shadow: 4px 4px 0 #E2DFD8; margin: 20px 0 10px; }
        .roman-label { font-size: 24px; font-weight: 800; color: var(--pink); margin-bottom: 30px; }

        .voice-box { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #FF6B6B, #EE5253); border: 4px solid #fff; color: white; font-size: 40px; cursor: pointer; box-shadow: 0 8px 0 #C0392B; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .mic-btn.listening { animation: pulse 1.5s infinite; background: linear-gradient(135deg, #2ECC71, #27AE60); box-shadow: 0 8px 0 #1E8449, 0 0 30px rgba(46, 204, 113, 0.6); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .voice-status { margin-top: 15px; font-size: 16px; font-weight: 800; color: var(--text-light); background: white; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 0 #E2DFD8; }
        .voice-success { color: #27AE60; border: 2px solid #27AE60; }
        .voice-fail { color: #E74C3C; border: 2px solid #E74C3C; }
        
        .btn-next { background: var(--blue); color: white; padding: 15px 40px; border-radius: 20px; font-size: 20px; font-weight: 800; border: none; box-shadow: 0 6px 0 var(--blue-dark); margin-top: 20px; display: none; cursor: pointer; font-family: 'Fredoka'; }
        .btn-next:active { transform: translateY(6px); box-shadow: none; }

        /* BOARD */
        .board-container { width: 300px; height: 300px; background: #fff; border: 5px dashed var(--purple); border-radius: 25px; position: relative; display: none; margin: 15px 0; overflow: hidden; }
        .board-bg { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-family: 'Amiri'; font-size: 180px; color: rgba(0,0,0,0.06); pointer-events: none; }
        #tracing-canvas { position: absolute; inset: 0; touch-action: none; }
        .btn-clear { background: var(--pink); color: white; padding: 10px 20px; border-radius: 15px; border: none; box-shadow: 0 4px 0 var(--pink-dark); font-weight: bold; display: none; cursor: pointer; margin-bottom: 20px; }
        .btn-clear:active { transform: translateY(4px); box-shadow: none; }
        
        .action-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn-action { background: var(--yellow); border: none; padding: 12px 20px; border-radius: 15px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 var(--yellow-dark); cursor: pointer; color: var(--text); font-family: 'Fredoka'; display: flex; gap: 5px; align-items: center; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* ADMIN HEADER */
        .top-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 20px; margin: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .top-header h1 { font-family: 'Amiri'; margin: 0; color: var(--pink-dark); font-size: 24px; }
        .top-header .user { font-size: 14px; font-weight: 800; color: var(--blue-dark); text-align: right; }
        .admin-controls { display: none; gap: 10px; margin-top: 5px; }
        .btn-admin { background: var(--purple); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; font-family: 'Fredoka'; }

        /* SUCCESS MODAL */
        #success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; display: none; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(5px); }
        .modal-box { background: white; padding: 40px 30px; border-radius: 35px; text-align: center; border: 6px solid var(--yellow); box-shadow: 0 15px 0 var(--yellow-dark); max-width: 320px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        .modal-box h2 { color: var(--yellow-dark); font-family: 'Fredoka'; font-size: 32px; margin: 0 0 10px; }
        .modal-box p { color: var(--text-light); margin-bottom: 25px; font-weight: 600; font-size: 16px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN (Bina Dropdown Ke) -->
    <div id="login-screen">
        <div class="login-card">
            <img src="qari-192.png" alt="Logo">
            <h1>آغازِ اساس</h1>
            
            <div class="input-group" style="margin-top: 20px;">
                <label>Aapka Naam</label>
                <input type="text" id="name" placeholder="Misaal: Bilal ya Fauzan Gorme">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="login()">Khelna Shuru Karein 🚀</button>
            <p id="login-msg"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" style="display: none;">
        
        <div class="top-header">
            <h1>آغازِ اساس</h1>
            <div>
                <div class="user" id="user-display">User</div>
                <div class="admin-controls" id="admin-panel">
                    <button class="btn-admin" onclick="unlockAll()">Unlock All</button>
                    <button class="btn-admin" style="background: #E74C3C;" onclick="logout()">Logout</button>
                </div>
                <button class="btn-admin" id="guest-logout" style="display: none; background: #95A5A6; margin-top: 5px;" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- PAGE 1: QAIDA -->
        <div id="page-qaida" class="page active">
            <div id="qaida-grid"></div>
        </div>

        <!-- PAGE 2: DUAEIN -->
        <div id="page-duas" class="page">
            <h2 class="page-title">🤲 Choti Duaein</h2>
            <div id="duas-list"></div>
        </div>

        <!-- PAGE 3: WAQIAAT -->
        <div id="page-stories" class="page">
            <h2 class="page-title">📚 Islami Waqiaat</h2>
            <div id="stories-list"></div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('qaida', this)">
                <span class="icon">📖</span> Qaida
            </button>
            <button class="nav-item" onclick="switchTab('duas', this)">
                <span class="icon">🤲</span> Duaein
            </button>
            <button class="nav-item" onclick="switchTab('stories', this)">
                <span class="icon">📚</span> Waqiaat
            </button>
        </div>

    </div>

    <!-- LESSON VIEW -->
    <div id="lesson-view">
        <button class="close-btn" onclick="closeLesson()">✖</button>
        
        <div class="big-letter" id="current-letter">ا</div>
        <div class="roman-label" id="current-roman">Alif</div>
        
        <div class="action-row">
            <button class="btn-action" onclick="playAudio()">🔊 Suniye</button>
            <button class="btn-action" onclick="toggleBoard()">✍️ Likhna</button>
        </div>

        <div class="voice-box">
            <button class="mic-btn" id="mic-btn" onclick="startListening()">🎤</button>
            <div class="voice-status" id="voice-status">Mic dabayein</div>
        </div>

        <div class="board-container" id="board-box">
            <div class="board-bg" id="board-bg-letter">ا</div>
            <canvas id="tracing-canvas"></canvas>
        </div>
        <button class="btn-clear" id="clear-btn" onclick="clearCanvas()">Board Saaf Karein 🧹</button>

        <button class="btn-next" id="next-btn" onclick="completeLesson()">MashaAllah! Aage ➡</button>
    </div>

    <!-- SUCCESS MODAL -->
    <div id="success-modal">
        <div class="modal-box">
            <h2>MashaAllah! 🎉</h2>
            <p>Aapne yeh sabaq mukammal kar liya hai. Agla sabaq unlock ho gaya hai!</p>
            <button class="btn-login" style="background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-dark); color: var(--text);" onclick="closeSuccess()">Aage Barhein</button>
        </div>
    </div>

    <script src="courseData.js"></script>
    <script src="duas.js"></script>
    <script src="waqiaat.js"></script>
    <script src="app.js"></script>
</body>
</html>
