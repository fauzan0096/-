<!DOCTYPE html>
<html lang="ur-Latn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#fff8e7">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="qari-192.png">
    <title>آغازِ اساس</title>
    <style>
        body { margin: 0; height: 100vh; background: #fff8e7; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; text-align: center; }
        .box { padding: 20px; }
        img { width: 100px; border-radius: 20px; }
        h1 { color: #1f8a52; margin: 10px 0; }
        input { padding: 12px; font-size: 20px; width: 200px; text-align: center; border-radius: 10px; border: 2px solid #ccc; margin-bottom: 15px; letter-spacing: 3px; }
        button { padding: 12px 30px; font-size: 18px; background: #2fbf71; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="qari-192.png" alt="Logo">
        <h1>آغازِ اساس</h1>
        <p>Password daalein (Default: 1234)</p>
        <input type="password" id="c" placeholder="••••">
        <br>
        <button onclick="check()">Kholein</button>
    </div>

    <script>
        function check() {
            var code = document.getElementById('c').value.trim();
            if (code === '1234') {
                window.location.href = 'app.html'; // Seedha app.html khul jayega
            } else {
                alert('Galat Password! (Sahi password 1234 hai)');
            }
        }
        document.getElementById('c').addEventListener("keypress", function(event) {
            if (event.key === "Enter") { check(); }
        });
    </script>
</body>
</html>
