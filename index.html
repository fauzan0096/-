      '<button class="btn ghost small" data-r="more">' + UI.icon('lock') + ' Walidain: thoda aur waqt</button></div>',
      { cls: 'rest-modal', dismiss: false });
    AA.voice.seq([D.T.aaramKaWaqt]);
    m.el.addEventListener('click', async (e) => {
      if (!e.target.closest('[data-r=more]')) return;
      if (await UI.parentGate('Bachche ko 10 minute aur dene ke liye')) { extraSec += 600; restShown = false; UI.closeModal(m); }
    });
  };
  UI.resetRest = () => { restShown = false; extraSec = 0; };

  /* ------------------------- sound toggle ------------------------- */
  UI.toggleSound = function () {
    Store.settings.sound = !Store.settings.sound;
    Store.saveSettings();
    if (!Store.settings.sound) AA.voice.stop();
    return Store.settings.sound;
  };

  /* ------------------------- choti utilities ------------------------- */
  // Arabic harf ko jis font mein dikhana hai uski class
  UI.ar = (t, cls) => '<span class="ar ' + (cls || '') + '" lang="ar" dir="rtl">' + AA.esc(t) + '</span>';
  // Phir se phir se dabane par animation dobara chalane ke liye
  UI.pulse = function (el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 800); };
})();

</script>
<script>
/* js/home.js */
/* Aghaaz-e-Asaas Kids — home.js
   Welcome (naya bachcha), bachon ki list, aur Home. */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;

  /* ------------------------- Welcome: naya bachcha ------------------------- */
  S.welcome = {
    render(p) {
      const first = !Store.profiles.length;
      return '<div class="welcome">' + UI.mascot('happy') +
        '<div class="ur">السلام علیکم</div><h1>' + (first ? 'Assalamu Alaikum!' : 'Naya Dost') + '</h1>' +
        '<p class="sub">Bachche ka naam likhein (zaroori nahi), phir tasveer aur umar chunein.</p>' +
        '<div class="col" style="margin-top:14px"><input class="text-in" id="w-name" maxlength="14" placeholder="Naam" autocomplete="off" aria-label="Bachche ka naam">' +
        '<div class="avatars" id="w-av">' + D.AVATARS.map((a, i) => '<button data-act="av" data-v="' + a + '" class="' + (i === 0 ? 'on' : '') + '">' + a + '</button>').join('') + '</div>' +
        '<div class="age-pick" id="w-age"><button data-act="age" data-v="nanha" class="on"><span class="e">🧸</span>Nanha<small>3 – 4 saal</small></button>' +
        '<button data-act="age" data-v="bada" class=""><span class="e">🎒</span>Bada<small>5 – 7 saal</small></button></div>' +
        '<button class="btn big green block" data-act="go">Shuru Karein ' + UI.icon('next') + '</button>' +
        (first ? '' : '<button class="btn ghost block" data-act="back">Wapas</button>') + '</div></div>';
    },
    mount(root) {
      let av = D.AVATARS[0], age = 'nanha';
      UI.bind(root, {
        av(t) { av = t.dataset.v; AA.$$('#w-av button', root).forEach((b) => b.classList.toggle('on', b === t)); AA.sfx.play('tap'); },
        age(t) { age = t.dataset.v; AA.$$('#w-age button', root).forEach((b) => b.classList.toggle('on', b === t)); AA.sfx.play('tap'); },
        go() {
          const id = Store.addProfile({ name: AA.$('#w-name', root).value, avatar: av, age });
          Store.switchProfile(id);
          UI.resetRest();
          UI.go('home', {}, { root: true });
        }
      });
    }
  };

  /* ------------------------- Bachon ki list ------------------------- */
  S.profiles = {
    render() {
      return UI.topbar({ ur: 'کون کھیلے گا؟', ro: 'Kaun khelega?', right: '' }) +
        '<div class="pad"><div class="profile-list">' +
        Store.profiles.map((p) => '<button class="profile-row" data-act="pick" data-id="' + p.id + '"><span class="av">' + p.avatar + '</span><span class="grow"><b style="font-size:1.25rem">' + AA.esc(p.name) + '</b><br><small class="sub">' + (p.age === 'bada' ? '5 – 7 saal' : '3 – 4 saal') + '</small></span>' + UI.icon('next') + '</button>').join('') +
        '</div><button class="btn blue block" data-act="new">+ Naya dost</button></div>';
    },
    mount(root) {
      UI.bind(root, {
        pick(t) { Store.switchProfile(t.dataset.id); UI.resetRest(); UI.go('home', {}, { root: true }); },
        new() { UI.go('welcome'); }
      });
    }
  };

  /* ------------------------- Agla qadam ------------------------- */
  function nextStep() {
    const due = Store.dueList();
    const idx = D.LETTERS.findIndex((_, i) => !Store.isLearned(i));
    if (idx === 0 && !Store.learnedList().length) return { type: 'lesson', i: 0, t: 'Chalo seekhein!', s: 'Pehla harf: ' + D.LETTERS[0].n };
    if (due.length >= 3) return { type: 'review', t: 'Paani do 💧', s: 'Purane harf dohrayein (' + due.length + ')' };
    if (idx >= 0) return { type: 'lesson', i: idx, t: 'Chalo seekhein!', s: 'Agla harf: ' + D.LETTERS[idx].n };
    if (due.length) return { type: 'review', t: 'Paani do 💧', s: 'Dohrayein (' + due.length + ')' };
    return { type: 'games', t: 'Chalo khelein!', s: 'Sab harf seekh liye — MashaAllah!' };
  }
  AA.nextStep = nextStep;

  function tilesFor(age) {
    const T = {
      duniya: { id: 'duniya', ur: 'میری دنیا', ro: 'Rang • Jaanwar • Ginti', e: '🌈', a: '#FFB020', b: '#FF8A3D', d: '#C77700', go: 'early' },
      harf: { id: 'harf', ur: 'حرف سیکھو', ro: 'Qaida — Alif Ba Ta', e: '🔤', a: '#FF7A59', b: '#FF5E7E', d: '#C94430', go: 'learn' },
      khel: { id: 'khel', ur: 'کھیل', ro: 'Games', e: '🎮', a: '#3DA9FC', b: '#5B7CFA', d: '#2358B8', go: 'games' },
      rang: { id: 'rang', ur: 'رنگ بھرو', ro: 'Rang bharo', e: '🎨', a: '#FF6FA8', b: '#C75BFF', d: '#9A3AB8', go: 'art' },
      dua: { id: 'dua', ur: 'دعائیں', ro: 'Roz ki duaein', e: '🤲', a: '#2ED1A0', b: '#12B5A6', d: '#0B7F73', go: 'duas' },
      surah: { id: 'surah', ur: 'چھوٹی سورتیں', ro: 'Chhoti surahein', e: '📖', a: '#8B6CFF', b: '#6A4FDB', d: '#4631A8', go: 'surahs' },
      namaz: { id: 'namaz', ur: 'نماز', ro: 'Wudu aur namaz', e: '🕌', a: '#12B5A6', b: '#2E9BD6', d: '#0B6F88', go: 'namaz' },
      aadat: { id: 'aadat', ur: 'اچھی باتیں', ro: 'Achhi aadatein', e: '💚', a: '#7BD65A', b: '#2ED1A0', d: '#3B9B28', go: 'habits' },
      bagh: { id: 'bagh', ur: 'میرا باغ', ro: 'Darakht aur stickers', e: '🌳', a: '#FFC83D', b: '#7BD65A', d: '#B98A00', go: 'album' }
    };
    const order = age === 'bada'
      ? ['harf', 'khel', 'duniya', 'rang', 'dua', 'surah', 'namaz', 'aadat', 'bagh']
      : ['duniya', 'harf', 'khel', 'rang', 'dua', 'bagh', 'aadat', 'namaz', 'surah'];
    return order.map((k) => T[k]);
  }

  function badge(id) {
    const p = Store.p;
    if (id === 'harf') return Store.learnedList().length + '/28';
    if (id === 'surah') return Object.values(p.surahs).filter((x) => x.known).length + '/' + D.SURAHS.length;
    if (id === 'dua') return Object.values(p.duas).filter((x) => x.known).length + '/' + D.DUAS.length;
    if (id === 'bagh') return p.stickers.length + '/' + D.STICKERS.length;
    if (id === 'aadat') return Store.habitsToday().length + ' aaj';
    return '';
  }

  /* ------------------------- Home ------------------------- */
  let greeted = false;
  S.home = {
    render() {
      const pr = Store.profile, p = Store.p;
      const ns = nextStep();
      const m = Store.missionToday();
      const due = Store.dueCount();
      const say = due >= 3 ? 'Tumhare <b>darakht</b> ko paani chahiye 💧' : 'Aaj kya seekhein? <b>' + AA.esc(pr.name) + '</b>!';
      const week = AA.weekDays().map((d) => '<i class="' + (Store.active(d) ? 'on' : '') + '" title="' + d + '"></i>').join('');
      return '<div class="home-hero">' +
        '<div class="home-bar">' +
          '<button class="kid-chip" data-act="who" aria-label="Bachcha badlein"><span class="av">' + pr.avatar + '</span><b>' + AA.esc(pr.name) + '</b></button>' +
          '<span class="grow"></span>' + UI.starsChip() +
          '<button class="icon-btn sm" data-act="sound" aria-label="Awaaz">' + UI.icon(Store.settings.sound ? 'sound' : 'mute') + '</button>' +
          '<button class="icon-btn sm" data-act="parent" aria-label="Walidain">' + UI.icon('lock') + '</button>' +
        '</div>' +
        '<div class="hero-body"><div class="hero-noori" data-act="noori">' + UI.mascot('happy') + '</div>' +
          '<div class="hero-talk"><div class="bubble-say">' + say + '</div>' +
          '<button class="btn big cta" data-act="cta"><span class="t">' + ns.t + '<small>' + ns.s + '</small></span><span class="go">' + UI.icon('play') + '</span></button></div></div>' +
      '</div>' +
      '<div class="card missions">' +
        [['learn', '🔤', 'Seekho'], ['play', '🎮', 'Khelo'], ['deen', '🤲', 'Deen']].map((x) => '<div class="mis ' + (m[x[0]] ? 'on' : '') + '"><div class="st">' + (m[x[0]] ? '⭐' : x[1]) + '</div>' + x[2] + '</div>').join('') +
      '</div><div class="week" aria-label="Is hafte ke din">' + week + '</div>' +
      '<div class="tiles">' + tilesFor(pr.age).map((t) => {
        const b = badge(t.id);
        return '<button class="tile" data-act="tile" data-go="' + t.go + '" style="--a:' + t.a + ';--b:' + t.b + ';--d:' + t.d + '">' +
          (b ? '<span class="badge">' + b + '</span>' : '') +
          '<span class="te">' + t.e + '</span><span class="tt ur">' + t.ur + '</span><span class="ts">' + t.ro + '</span></button>';
      }).join('') + '</div>';
    },
    mount(root) {
      if (!greeted) { greeted = true; setTimeout(() => V.seq([D.T.salam]), 500); }
      UI.bind(root, {
        who() { UI.go('profiles'); },
        sound() { const on = UI.toggleSound(); root.querySelector('[data-act=sound]').innerHTML = UI.icon(on ? 'sound' : 'mute'); },
        async parent() { if (await UI.parentGate('Walidain ka hissa kholne ke liye')) UI.go('parent'); },
        noori(t) { V.seq([D.T.salam]); const n = t.querySelector('.noori'); n.dataset.mood = 'cheer'; setTimeout(() => (n.dataset.mood = 'happy'), 1400); },
        tile(t) { AA.sfx.play('whoosh'); UI.go(t.dataset.go); },
        cta() {
          const ns = nextStep();
          AA.sfx.play('whoosh');
          if (ns.type === 'lesson') UI.go('lesson', { i: ns.i });
          else if (ns.type === 'review') UI.go('play', { id: 'review' });
          else UI.go('games');
        }
      });
    }
  };
})();

</script>
<script>
/* js/learn.js */
/* Aghaaz-e-Asaas Kids — learn.js
   Harf seekhne ka safar (7 manzilein), Alif-Ba-Ta ka gaana, aur Harkat (zabar zer pesh). */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;

  /* ------------------------- Safar (path) ------------------------- */
  S.learn = {
    render() {
      const learned = Store.learnedList();
      const next = D.LETTERS.findIndex((_, i) => !Store.isLearned(i));
      const bada = Store.profile.age === 'bada';
      const manz = D.MANZIL.map((m) => {
        const idx = []; for (let i = m.from; i <= m.to; i++) idx.push(i);
        const done = idx.filter((i) => Store.isLearned(i)).length;
        return '<div class="manzil" style="--mc:' + m.color + '"><div class="manzil-h"><span class="me">' + m.e + '</span><div><b class="ur">' + m.ur + '</b><small>' + m.ro + '</small></div><span class="cnt">' + done + '/' + idx.length + '</span></div>' +
          '<div class="letters-row">' + idx.map((i) => {
            const L = D.LETTERS[i], st = Store.letterState(i);
            return '<button class="lchip ' + (st ? 'done' : '') + (i === next ? ' next' : '') + (st === 3 ? ' thirsty' : '') + '" data-act="letter" data-i="' + i + '" aria-label="' + L.n + '"><span class="ar-big">' + L.ch + '</span>' + (st ? '<span class="tick">' + UI.icon('check') + '</span>' : '') + '</button>';
          }).join('') + '</div>' +
          (done ? '<div class="manzil-f"><button class="btn small green" data-act="review" data-m="' + m.id + '">🧠 Dohrao</button></div>' : '<div style="height:10px"></div>') + '</div>';
      }).join('');
      const harkatOpen = bada && learned.length >= 10;
      return UI.topbar({ ur: 'حرف سیکھو', ro: 'Alif Ba Ta — ' + learned.length + '/28' }) +
        '<button class="song-card" data-act="song"><span class="se">🎵</span><span class="grow"><b style="font-size:1.25rem">Alif Ba Ta ka Gaana</b><br><small style="opacity:.9">Sab huroof suno aur saath bolo</small></span>' + UI.icon('play') + '</button>' +
        manz +
        (bada ? '<button class="card chapter" data-act="harkat" ' + (harkatOpen ? '' : 'style="opacity:.75"') + '><span class="ce">' + (harkatOpen ? '⬆️' : '🔒') + '</span><span class="grow"><b class="ur">زبر زیر پیش</b><b style="font-size:1rem">Zabar • Zer • Pesh</b><span class="lockmsg">' + (harkatOpen ? 'Harf ko awaaz dena seekho' : 'Pehle 10 harf seekh lo, phir yeh khulega') + '</span></span>' + UI.icon('next') + '</button>' : '');
    },
    mount(root) {
      const cur = root.querySelector('.lchip.next');
      if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250);
      UI.bind(root, {
        letter(t) { AA.sfx.play('tap'); UI.go('lesson', { i: +t.dataset.i }); },
        song() { UI.go('song'); },
        review(t) {
          const m = D.MANZIL.find((x) => x.id === +t.dataset.m);
          const ids = []; for (let i = m.from; i <= m.to; i++) if (Store.isLearned(i)) ids.push(i);
          UI.go('play', { id: 'review', letters: ids });
        },
        harkat() {
          if (Store.learnedList().length < 10) { UI.toast('Pehle 10 harf seekh lo 🙂'); V.seq([{ ur: 'پہلے دس حرف سیکھو', hi: 'पहले दस हर्फ़ सीखो', ro: 'Pehle das harf seekho' }]); return; }
          UI.go('harkat');
        }
      });
    }
  };

  /* ------------------------- Alif Ba Ta ka gaana ------------------------- */
  let songRun = 0;
  S.song = {
    render() {
      return UI.topbar({ ur: 'الف با تا', ro: 'Huroof ka gaana' }) +
        '<div class="pad col" style="align-items:center"><div class="step-say">Suno aur saath bolo 🎵</div>' +
        '<div class="letters-row" id="song-row" style="max-width:420px">' + D.LETTERS.map((L, i) => '<div class="lchip" data-sl="' + i + '"><span class="ar-big">' + L.ch + '</span></div>').join('') + '</div>' +
        '<div class="row"><button class="btn big green" data-act="play" id="song-btn">' + UI.icon('play') + ' Shuru</button></div></div>';
    },
    mount(root) {
      let running = false;
      const btn = root.querySelector('#song-btn');
      async function run() {
        const my = ++songRun; running = true;
        btn.innerHTML = UI.icon('close') + ' Ruko';
        for (let i = 0; i < 28 && my === songRun; i++) {
          AA.$$('[data-sl]', root).forEach((c) => c.classList.remove('next'));
          const chip = root.querySelector('[data-sl="' + i + '"]');
          if (chip) { chip.classList.add('next'); chip.scrollIntoView({ block: 'nearest' }); }
          V.stop();
          await V.arab(D.LETTERS[i].say, 0.9);
          await AA.wait(700 / (Store.settings.speed || 1));
        }
        if (my === songRun) {
          running = false; btn.innerHTML = UI.icon('play') + ' Dobara';
          AA.$$('[data-sl]', root).forEach((c) => c.classList.remove('next'));
          const today = AA.today();
          if (Store.p.song !== today) { Store.p.song = today; Store.save(); await UI.reward(2, 'song'); UI.mission('learn'); }
        }
      }
      UI.bind(root, { play() { if (running) { songRun++; running = false; V.stop(); btn.innerHTML = UI.icon('play') + ' Shuru'; AA.$$('[data-sl]', root).forEach((c) => c.classList.remove('next')); } else run(); } });
    },
    leave() { songRun++; }
  };

  /* ------------------------- Harkat ------------------------- */
  S.harkat = {
    render() {
      const seen = Store.p.harkat.seen;
      return UI.topbar({ ur: 'زبر زیر پیش', ro: 'Harkat' }) +
        '<div class="pad col"><p class="center sub">Harf ke upar ya neeche chhota nishan lagta hai — wohi harf ki awaaz badalta hai.</p>' +
        D.HARKAT.map((h) => '<button class="lrow ' + (seen.includes(h.id) ? 'done' : '') + '" data-act="open" data-id="' + h.id + '" style="--lc:' + h.color + '22"><span class="le" style="background:' + h.color + ';color:#fff"><span class="ar-big" style="font-size:2.6rem;line-height:1.5">بَ</span></span><span class="lt"><b class="ur">' + h.ur + '</b><small>' + h.ro + ' — ' + h.cue + '</small></span>' + (seen.includes(h.id) ? '<span class="lr">✅</span>' : '<span class="lr">▶</span>') + '</button>').join('') +
        '</div>';
    },
    mount(root) { UI.bind(root, { open(t) { UI.go('harkatLesson', { id: t.dataset.id }); } }); }
  };

  S.harkatLesson = {
    render(p) {
      const h = D.HARKAT.find((x) => x.id === p.id);
      return UI.topbar({ ur: h.ur, ro: h.ro }) +
        '<div class="pad col" style="align-items:center"><div class="step-say"><span class="ur">' + h.ur + '</span> — ' + h.cue + '</div>' +
        '<button class="letter-card" data-act="say" id="hk-card"><span class="ar-big big-letter" id="hk-ar"></span><span class="letter-name" id="hk-syl"></span><span class="speak-fab">' + UI.icon('sound') + '</span></button>' +
        '<div class="counter-dots" id="hk-dots">' + D.LETTERS.slice(0, 10).map(() => '<i></i>').join('') + '</div>' +
        '<div class="row"><button class="btn ghost" data-act="prev" aria-label="Pichla">' + UI.icon('back') + '</button><button class="btn big green" data-act="next">Agla ' + UI.icon('next') + '</button></div></div>';
    },
    mount(root, p) {
      const h = D.HARKAT.find((x) => x.id === p.id);
      let i = 0, maxSeen = 0, rewarded = Store.p.harkat.seen.includes(h.id);
      const show = (say) => {
        const L = D.LETTERS[i], txt = D.harakatLetter(i, h.mark);
        root.querySelector('#hk-ar').textContent = txt;
        const syl = i === 0 ? h.vow : D.SYL[i] + h.vow;
        root.querySelector('#hk-syl').textContent = syl;
        AA.$$('#hk-dots i', root).forEach((d, k) => d.classList.toggle('on', k <= Math.min(maxSeen, 9)));
        if (say) V.sayAr(txt, 0.8);
      };
      UI.bind(root, {
        say() { V.sayAr(D.harakatLetter(i, h.mark), 0.8); UI.pulse(root.querySelector('#hk-card'), 'pulse-once'); },
        async next() {
          i = (i + 1) % 28; maxSeen = Math.max(maxSeen, i); show(true); AA.sfx.play('tap');
          if (!rewarded && maxSeen >= 9) {
            rewarded = true; Store.p.harkat.seen.push(h.id); Store.save();
            await UI.reward(2, 'harkat'); UI.mission('learn');
            UI.celebrate({ title: 'Shabash!', big: '<span class="ar-big" style="font-size:5rem">بَ بِ بُ</span>', sub: h.ro + ' ke 10 harf sun liye', voice: [AA.pick(D.PRAISE)] });
          }
        },
        prev() { i = (i + 27) % 28; show(true); }
      });
      show(false);
      setTimeout(() => V.seq([h, 300, { ar: D.harakatLetter(0, h.mark) }]), 400);
    }
  };
})();

</script>
<script>
/* js/trace.js */
/* Aghaaz-e-Asaas Kids — trace.js
   Harf par ungli phera kar "bharna" (tracing) aur rang bharna (colouring).
   Ungli sirf harf ke ANDAR rang chhodti hai — bahar ki lakeer nazar nahi aati,
   is liye bachcha kabhi "galat" mehsoos nahi karta. Kitna bhara — woh % se pata chalta hai. */
(function () {
  'use strict';
  const AA = window.AA;
  const FONT = '"Noto Naskh Arabic","Amiri","Traditional Arabic","DejaVu Sans",serif';
  const G = 96; // coverage grid

  AA.trace = {
    PALETTE: ['#FF4D4D', '#FF9A3D', '#FFD23D', '#2ED1A0', '#3DA9FC', '#8B6CFF', '#FF6FA8', '#8B5A2B'],

    /* o: { ch, mode:'trace'|'colour', nanha:bool, color, doneAt, onProgress(pct), onDone() } */
    create(host, o) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const S = Math.round(host.clientWidth || 340);
      const mk = () => { const c = document.createElement('canvas'); c.width = c.height = Math.round(S * dpr); return c; };
      const view = mk(), raw = mk(), mask = mk(), tmp = mk();
      view.setAttribute('aria-label', 'Likhne ki jagah');
      host.appendChild(view);
      const vx = view.getContext('2d'), rx = raw.getContext('2d'), mx = mask.getContext('2d'), tx = tmp.getContext('2d');
      [vx, rx, mx, tx].forEach((c) => c.setTransform(dpr, 0, 0, dpr, 0, 0));

      const state = { color: o.color || AA.trace.PALETTE[4], rainbow: false, hue: 0, drawing: false, last: null, pct: 0, done: false, alive: true, dirty: true, frame: 0, strokes: 0, covT: 0 };
      const doneAt = o.doneAt || (o.mode === 'colour' ? 0.6 : o.nanha ? 0.5 : 0.62);
      const brush = S * (o.mode === 'colour' ? 0.12 : o.nanha ? 0.14 : 0.1);
      let fs = 100, gx = 0, gy = 0, maskCells = null, maskTotal = 1;

      function layout() {
        const t = document.createElement('canvas').getContext('2d');
        t.font = '700 100px ' + FONT;
        const m = t.measureText(o.ch);
        const l = m.actualBoundingBoxLeft || 0, r = m.actualBoundingBoxRight || m.width, a = m.actualBoundingBoxAscent || 70, d = m.actualBoundingBoxDescent || 20;
        const w = Math.max(1, l + r), h = Math.max(1, a + d);
        const k = Math.min((S * 0.78) / w, (S * 0.74) / h);
        fs = 100 * k;
        gx = S / 2 - ((r - l) / 2) * k;
        gy = S / 2 - ((d - a) / 2) * k;
      }
      function glyph(ctx, mode) {
        ctx.font = '700 ' + fs + 'px ' + FONT;
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.direction = 'ltr';
        if (mode === 'fill') ctx.fillText(o.ch, gx, gy); else ctx.strokeText(o.ch, gx, gy);
      }
      function buildMask() {
        mx.clearRect(0, 0, S, S);
        mx.fillStyle = '#000'; glyph(mx, 'fill');
        const small = document.createElement('canvas'); small.width = small.height = G;
        const sx = small.getContext('2d'); sx.drawImage(mask, 0, 0, G, G);
        const d = sx.getImageData(0, 0, G, G).data;
        maskCells = new Uint8Array(G * G); maskTotal = 0;
        for (let i = 0; i < G * G; i++) if (d[i * 4 + 3] > 110) { maskCells[i] = 1; maskTotal++; }
        if (!maskTotal) maskTotal = 1;
      }
      function paint() {
        vx.clearRect(0, 0, S, S);
        vx.fillStyle = document.documentElement.dataset.theme === 'night' ? '#E4E1FF' : '#E8EAFE';
        glyph(vx, 'fill');
        // rang — sirf harf ke andar
        tx.save(); tx.setTransform(1, 0, 0, 1, 0, 0);
        tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, tmp.width, tmp.height);
        tx.drawImage(raw, 0, 0);
        tx.globalCompositeOperation = 'destination-in'; tx.drawImage(mask, 0, 0);
        tx.restore();
        vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.drawImage(tmp, 0, 0); vx.restore();
        // dotted kinara
        vx.save(); vx.lineWidth = 3; vx.strokeStyle = '#7A68E8'; vx.setLineDash([9, 8]); vx.lineJoin = 'round';
        glyph(vx, 'stroke'); vx.restore();
      }
      function measure() {
        const small = document.createElement('canvas'); small.width = small.height = G;
        const sx = small.getContext('2d'); sx.drawImage(tmp, 0, 0, G, G);
        const d = sx.getImageData(0, 0, G, G).data;
        let c = 0;
        for (let i = 0; i < G * G; i++) if (maskCells[i] && d[i * 4 + 3] > 40) c++;
        const pct = Math.min(1, c / maskTotal);
        state.pct = pct;
        if (o.onProgress) o.onProgress(pct, state);
        if (!state.done && pct >= doneAt) { state.done = true; if (o.onDone) o.onDone(); }
      }
      function loop() {
        state.frame = 0;
        if (!state.alive) return;
        if (state.dirty) { paint(); state.dirty = false; }
        const now = performance.now();
        if (state.needMeasure && now - state.covT > 140) { state.needMeasure = false; state.covT = now; measure(); }
        if (state.drawing || state.dirty || state.needMeasure) state.frame = requestAnimationFrame(loop);
      }
      const kick = () => { if (!state.frame && state.alive) state.frame = requestAnimationFrame(loop); };

      function pos(e) { const r = view.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * S, y: ((e.clientY - r.top) / r.height) * S }; }
      function col() {
        if (!state.rainbow) return state.color;
        state.hue = (state.hue + 9) % 360;
        return 'hsl(' + state.hue + ',90%,58%)';
      }
      function seg(a, b) {
        rx.strokeStyle = col(); rx.lineWidth = brush; rx.lineCap = 'round'; rx.lineJoin = 'round';
        rx.beginPath(); rx.moveTo(a.x, a.y); rx.lineTo(b.x + 0.01, b.y + 0.01); rx.stroke();
      }
      const down = (e) => { e.preventDefault(); state.drawing = true; try { view.setPointerCapture(e.pointerId); } catch (x) {} state.last = pos(e); seg(state.last, state.last); state.strokes++; state.dirty = state.needMeasure = true; kick(); };
      const move = (e) => { if (!state.drawing) return; e.preventDefault(); const p = pos(e); seg(state.last, p); state.last = p; state.dirty = state.needMeasure = true; kick(); };
      const up = () => { if (!state.drawing) return; state.drawing = false; state.needMeasure = true; state.dirty = true; kick(); };
      view.addEventListener('pointerdown', down);
      view.addEventListener('pointermove', move);
      view.addEventListener('pointerup', up);
      view.addEventListener('pointercancel', up);

      layout(); buildMask(); paint();
      // font der se aaye to dobara naap lo
      if (document.fonts && document.fonts.load) {
        Promise.race([document.fonts.load('700 100px "Noto Naskh Arabic"', o.ch), AA.wait(1500)]).then(() => {
          if (!state.alive) return;
          if (!state.strokes) { layout(); buildMask(); state.dirty = true; kick(); }
        }).catch(() => {});
      }

      return {
        setColor(c) { if (c === 'rainbow') { state.rainbow = true; } else { state.rainbow = false; state.color = c; } },
        clear() { rx.clearRect(0, 0, S, S); state.pct = 0; state.done = false; state.strokes = 0; state.dirty = true; if (o.onProgress) o.onProgress(0, state); kick(); },
        pct: () => state.pct,
        isDone: () => state.done,
        destroy() { state.alive = false; cancelAnimationFrame(state.frame); view.remove(); }
      };
    }
  };
})();

</script>
<script>
/* js/lesson.js */
/* Aghaaz-e-Asaas Kids — lesson.js
   Ek harf ka poora safar:  👀 Dekho  →  🔊 Suno  →  ✍️ Likho  →  🎨 Rang bharo  →  🧠 Yaad karo
   (Nanhe bachon ke liye "Likho" nahi hota — unki ungliyan abhi taiyar nahi hoti.)
   Bachon ke seekhne ke 3 usool: kai hawas (dekhna+sunna+chhoona), chhoti chhoti baatein, aur dohrana. */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;
  const ICONS = { see: '👀', hear: '🔊', trace: '✍️', colour: '🎨', recall: '🧠' };

  S.lesson = {
    render() {
      return '<div class="lesson"><div class="lesson-top"><button class="icon-btn" data-act="back" aria-label="Wapas">' + UI.icon('back') + '</button>' +
        '<div class="steps" id="l-steps"></div>' + UI.starsChip() + '</div>' +
        '<div class="lesson-main" id="l-main"></div><div class="lesson-foot" id="l-foot"></div></div>';
    },
    mount(root, p) {
      const i = p.i, L = D.LETTERS[i], bada = Store.profile.age === 'bada';
      const steps = bada ? ['see', 'hear', 'trace', 'colour', 'recall'] : ['see', 'hear', 'colour', 'recall'];
      const main = AA.$('#l-main', root), foot = AA.$('#l-foot', root), stepsEl = AA.$('#l-steps', root);
      let si = 0, alive = true, timers = [], tr = null, canNext = false;
      Store.markSeen(i);
      root._kill = () => { alive = false; timers.forEach(clearTimeout); if (tr) tr.destroy(); };

      const later = (fn, ms) => { const t = setTimeout(() => alive && fn(), ms); timers.push(t); return t; };
      const enable = () => { canNext = true; const b = AA.$('[data-act=next]', foot); if (b) { b.disabled = false; b.classList.add('pulse'); } };

      function drawChrome() {
        stepsEl.innerHTML = steps.map((s, k) => '<span class="step-dot ' + (k === si ? 'on' : k < si ? 'done' : '') + '">' + (k < si ? '✓' : ICONS[s]) + '</span>').join('');
        const last = si === steps.length - 1;
        foot.innerHTML = (si > 0 ? '<button class="btn ghost" data-act="prev" aria-label="Pichla">' + UI.icon('back') + '</button>' : '') +
          (last ? '' : '<button class="btn big green" data-act="next" disabled>Aage ' + UI.icon('next') + '</button>');
        canNext = false;
      }
      function go(n) {
        timers.forEach(clearTimeout); timers = [];
        if (tr) { tr.destroy(); tr = null; }
        V.stop();
        si = AA.clamp(n, 0, steps.length - 1);
        drawChrome();
        main.innerHTML = ''; main.scrollTop = 0;
        STEP[steps[si]](main);
      }

      /* ---------- 👀 Dekho ---------- */
      function stepSee(el) {
        const w = L.w;
        let forms = '';
        if (bada) {
          const f = D.forms(L.ch, L.join);
          const cells = L.join ? [['start', 'shuru'], ['mid', 'beech'], ['end', 'aakhir']] : [['end', 'aakhir mein']];
          forms = '<div class="forms">' + cells.map((c) => '<div><span class="ar-big">' + f[c[0]] + '</span><small>' + c[1] + '</small></div>').join('') + '</div>';
        }
        el.innerHTML = '<div class="step-say"><span class="ur">یہ ہے</span></div>' +
          '<button class="letter-card" data-act="say"><span class="ar-big big-letter">' + L.ch + '</span><span class="letter-name">' + L.n + '</span><span class="speak-fab">' + UI.icon('sound') + '</span></button>' +
          '<button class="pic-card" data-act="word"><span class="pe">' + w.e + '</span><span class="pw"><span class="ar-big">' + w.ar + '</span><span class="ur">' + w.ur + '</span><small>' + w.ro + '</small></span></button>' +
          '<div class="cue">💡 ' + AA.esc(L.cue) + '</div>' + forms;
        V.seq([D.T.yehHai, { ar: L.say }, 450, { ar: w.ar }, w]);
        later(enable, 1800);
        UI.bind(el, {
          say() { V.sayAr(L.say); UI.pulse(AA.$('.letter-card', el), 'pulse-once'); },
          word() { V.seq([{ ar: w.ar }, w]); UI.pulse(AA.$('.pic-card', el), 'pulse-once'); }
        });
      }

      /* ---------- 🔊 Suno aur bolo ---------- */
      function stepHear(el) {
        el.innerHTML = '<div class="step-say"><span class="ur">سنو اور بولو</span></div>' +
          '<div class="letter-card" style="max-width:300px"><span class="ar-big big-letter" style="font-size:130px">' + L.ch + '</span><span class="letter-name">' + L.n + '</span></div>' +
          '<div class="echo"><div class="mic-ring" id="mic">🗣️</div><div class="counter-dots" id="cd"><i></i><i></i><i></i></div><div class="q-text" id="hear-t">Suno…</div></div>' +
          '<button class="btn ghost" data-act="again">' + UI.icon('redo') + ' Dobara</button>';
        const mic = AA.$('#mic', el), dots = AA.$$('#cd i', el), t = AA.$('#hear-t', el);
        let run = 0;
        async function loop() {
          const my = ++run; V.stop();
          dots.forEach((d) => d.classList.remove('on'));
          for (let k = 0; k < 3 && alive && my === run; k++) {
            mic.classList.remove('live'); t.textContent = 'Suno…';
            await V.arab(L.say, 0.85);
            if (!alive || my !== run) return;
            dots[k].classList.add('on');
            t.textContent = 'Ab tum bolo! 🗣️'; mic.classList.add('live');
            if (k === 0) await V.word(D.T.abBolo);
            await AA.wait(1500 / (Store.settings.speed || 1));
          }
          if (alive && my === run) { mic.classList.remove('live'); t.textContent = 'Shabash! 👏'; AA.sfx.play('good'); enable(); }
        }
        later(loop, 400);
        later(enable, 6000);
        UI.bind(el, { again() { loop(); } });
      }

      /* ---------- ✍️ Likho  /  🎨 Rang bharo ---------- */
      function stepPaint(el, mode) {
        const trace = mode === 'trace';
        el.innerHTML = '<div class="step-say"><span class="ur">' + (trace ? 'ungli phero — harf bharo' : 'rang bharo') + '</span></div>' +
          '<div class="meter"><i id="pm"></i><b id="pt">0%</b></div>' +
          '<div class="board" id="pb"></div>' +
          (trace ? '' : '<div class="palette" id="pal">' + AA.trace.PALETTE.map((c, k) => '<button class="swatch ' + (k === 4 ? 'on' : '') + '" style="--sw:' + c + '" data-act="sw" data-c="' + c + '" aria-label="Rang"></button>').join('') + '<button class="swatch rainbow" data-act="sw" data-c="rainbow" aria-label="Rainbow"></button></div>') +
          '<div class="tools"><button class="btn ghost small" data-act="clear">' + UI.icon('erase') + ' Saaf</button></div>';
        const meter = AA.$('#pm', el), pt = AA.$('#pt', el);
        let celebrated = false;
        tr = AA.trace.create(AA.$('#pb', el), {
          ch: L.ch, mode, nanha: !bada, color: AA.trace.PALETTE[4],
          onProgress(p) { const v = Math.round(p * 100); meter.style.width = v + '%'; pt.textContent = v + '%'; if (p >= 0.3) enable(); },
          onDone() {
            if (celebrated) return; celebrated = true;
            AA.sfx.play('great'); V.praise(); UI.confetti(AA.$('#pb', el), 24); enable();
            UI.floatText(AA.$('#pb', el), 'Shabash! ⭐', 90, 120, '');
          }
        });
        V.seq([trace ? { ur: 'ungli se harf bharo', hi: 'उँगली से हर्फ़ भरो', ro: 'Ungli se harf bharo' } : { ur: 'اپنی پسند کا رنگ چنو', hi: 'अपनी पसंद का रंग चुनो', ro: 'Apni pasand ka rang chuno' }]);
        later(enable, 25000);
        UI.bind(el, {
          sw(t) { AA.$$('.swatch', el).forEach((b) => b.classList.toggle('on', b === t)); tr.setColor(t.dataset.c); AA.sfx.play('tap'); },
          clear() { tr.clear(); celebrated = false; }
        });
      }

      /* ---------- 🧠 Yaad karo ---------- */
      function stepRecall(el) {
        const nOpt = bada ? 3 : 2, total = 3;
        const types = bada ? ['hear', 'pic', 'hear'] : ['hear', 'hear', 'pic'];
        let r = 0, wrong = 0, locked = false;
        const dots = () => '<div class="dots-row">' + types.map((_, k) => '<i class="' + (k < r ? 'ok' : k === r ? 'cur' : '') + '"></i>').join('') + '</div>';
        function round() {
          locked = false; wrong = 0;
          const type = types[r];
          const opts = AA.letterOpts(i, nOpt, { similar: false });
          const prompt = type === 'hear'
            ? '<button class="listen-btn" data-act="hear" aria-label="Suno">' + UI.icon('sound') + '</button>'
            : '<span class="big">' + L.w.e + '</span>';
          el.innerHTML = '<div class="q-card">' + dots() +
            '<div class="q-text"><span class="ur">' + (type === 'hear' ? 'سنو اور ڈھونڈو' : 'اس کا حرف کون سا؟') + '</span></div>' +
            '<div class="q-prompt ' + (type === 'hear' ? 'listen' : '') + '">' + prompt + '</div>' +
            '<div class="opt-grid" style="--cols:' + nOpt + '">' + opts.map((k) => '<button class="opt" data-act="pick" data-k="' + k + '"><span class="ar-big">' + D.LETTERS[k].ch + '</span></button>').join('') + '</div></div>';
          if (type === 'hear') V.seq([{ ar: L.say }]); else V.seq([{ ar: L.w.ar }, L.w, D.T.kaunSaHarf]);
        }
        async function pick(t) {
          if (locked) return;
          const k = +t.dataset.k;
          if (k === i) {
            locked = true; t.classList.add('right'); AA.sfx.play('good');
            await V.seq([{ ar: L.say }]);
            r++;
            if (r >= total) { await AA.wait(250); if (alive) finish(); } else { await AA.wait(350); if (alive) round(); }
          } else {
            wrong++; t.classList.add('wrong'); AA.sfx.play('oops'); V.seq([D.T.dobara]);
            setTimeout(() => t.classList.remove('wrong'), 500);
            if (wrong >= 2) { const good = AA.$('[data-k="' + i + '"]', el); if (good) good.classList.add('hint'); }
          }
        }
        UI.bind(el, { pick, hear() { V.seq([{ ar: L.say }]); } });
        round();
      }

      async function finish() {
        if (!alive) return;
        const first = Store.finishLetter(i);
        await UI.reward(first ? 3 : 1, 'lesson');
        UI.mission('learn');
        if (!alive) return;
        const res = await UI.celebrate({
          title: 'MashaAllah!', big: '<span class="ar-big" style="font-size:5.5rem">' + L.ch + '</span>',
          sub: L.n + ' seekh liya!', btn: i < 27 ? 'Agla harf' : 'Wapas', btn2: i < 27 ? 'Safar par wapas' : '', voice: [AA.pick(D.PRAISE)]
        });
        if (!alive) return;
        if (res === 'ok' && i < 27) UI.go('lesson', { i: i + 1 }, { replace: true }); else UI.back();
      }

      const STEP = { see: stepSee, hear: stepHear, trace: (e) => stepPaint(e, 'trace'), colour: (e) => stepPaint(e, 'colour'), recall: stepRecall };
      UI.bind(root, {
        next() { if (!canNext) return; AA.sfx.play('whoosh'); go(si + 1); },
        prev() { go(si - 1); }
      });
      go(0);
    },
    leave(root) { if (root && root._kill) root._kill(); }
  };
})();

</script>
<script>
/* js/games.js */
/* Aghaaz-e-Asaas Kids — games.js
   Games ka menu + dhancha (session) + sawal-jawab wale games.
   USOOL:  1) koi "out" nahi — galat par narm awaaz, dobara koshish, 2 galti ke baad sahi jawab chamakta hai.
           2) Level khud adjust hota hai — aasaan lage to upar, mushkil lage to neeche.
           3) Hamesha kam az kam 1 sitara — koshish ki qadar.
           4) Jo harf bachche ne seekhe hain wohi aate hain; bhoolne wale zyada aate hain (yaad ka nizam). */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;
  const { rand, pick, shuffle } = AA;

  /* ------------------------- madadgar ------------------------- */
  // sahi harf + n-1 doosre (similar=true ho to milte julte harf)
  AA.letterOpts = function (correct, n, o) {
    o = o || {};
    const pool = (o.pool || Store.pool(Math.max(n + 1, 4))).filter((x) => x !== correct);
    const sim = D.similarTo(correct);
    let out;
    if (o.similar) out = shuffle(pool.filter((x) => sim.includes(x))).concat(shuffle(pool.filter((x) => !sim.includes(x))));
    else out = shuffle(pool.filter((x) => !sim.includes(x)));
    out = out.slice(0, n - 1);
    if (out.length < n - 1) {
      const rest = shuffle(D.LETTERS.map((_, i) => i).filter((x) => x !== correct && !out.includes(x) && (o.similar || !sim.includes(x))));
      out = out.concat(rest.slice(0, n - 1 - out.length));
    }
    return shuffle([correct].concat(out));
  };
  // sawalon ke liye harf chuno: due/kamzor pehle
  AA.pickLetters = function (n, pool) {
    const pri = shuffle(Array.from(new Set(Store.dueList().concat(Store.weakList(3))))).filter((x) => pool.includes(x));
    const rest = shuffle(pool.filter((x) => !pri.includes(x)));
    const list = pri.slice(0, Math.ceil(n / 2)).concat(rest, pri.slice(Math.ceil(n / 2)));
    const out = [];
    for (let k = 0; out.length < n; k++) {
      let c = list[k % list.length];
      if (out.length && out[out.length - 1] === c && list.length > 1) c = list[(k + 1) % list.length];
      out.push(c);
    }
    return out;
  };
  AA.shapeSvg = (s, color) => '<svg class="shape" viewBox="0 0 100 100" style="fill:' + color + ';stroke:rgba(0,0,0,.18);stroke-width:3">' + s.svg + '</svg>';
  const L = (i) => D.LETTERS[i];
  const letterOpt = (i) => '<span class="ar-big">' + L(i).ch + '</span>';
  const dotsHtml = (ctx) => '<div class="dots-row">' + Array.from({ length: ctx.total }, (_, k) => '<i class="' + (ctx.results[k] === 'ok' ? 'ok' : ctx.results[k] === 'helped' ? 'helped' : k === ctx.results.length ? 'cur' : '') + '"></i>').join('') + '</div>';

  /* ------------------------- registry ------------------------- */
  const REG = (AA.games.list = []);
  AA.games.add = (g) => { REG.push(g); AA.games[g.id] = g; };

  /* ------------------------- Menu ------------------------- */
  S.games = {
    render() {
      const bada = Store.profile.age === 'bada';
      const learned = Store.learnedList().length;
      const due = Store.dueCount();
      const list = REG.filter((g) => g.ages.includes(Store.profile.age)).sort((a, b) => (bada ? a.ob : a.on) - (bada ? b.ob : b.on));
      const tile = (g) => {
        const rec = Store.game(g.id), lock = g.need ? g.need() : null;
        const st = Math.min(3, rec.best || 0);
        return '<button class="gtile" data-act="game" data-id="' + g.id + '" style="--a:' + g.a + ';--b:' + g.b + ';--d:' + g.d + (lock ? ';opacity:.7' : '') + '">' +
          (rec.played ? '<span class="glvl">Level ' + rec.lvl + '</span>' : '') +
          '<span class="ge">' + (lock ? '🔒' : g.e) + '</span><span class="gt ur">' + g.ur + '</span><span class="gs">' + g.ro + '</span>' +
          '<span class="gstars">' + '⭐'.repeat(st) + '<span style="opacity:.3;filter:grayscale(1)">' + '⭐'.repeat(3 - st) + '</span></span></button>';
      };
      return UI.topbar({ ur: 'کھیل', ro: 'Khelte khelte seekho' }) +
        (learned ? '<div class="pad" style="padding-top:4px"><button class="tile wide" data-act="game" data-id="review" style="--a:#2ED1A0;--b:#12B5A6;--d:#0B7F73;min-height:92px;width:100%"><span class="te">🧠</span><span class="grow"><span class="tt ur" style="display:block">دہراؤ</span><span class="ts">Dohrao — ' + (due ? due + ' harf intezar mein 💧' : 'Seekhe hue harf phir se') + '</span></span></button></div>' : '') +
        '<div class="tiles" style="padding-top:12px">' + list.map(tile).join('') + '</div>';
    },
    mount(root) {
      UI.bind(root, {
        game(t) {
          const id = t.dataset.id, g = AA.games[id];
          const lock = g && g.need ? g.need() : null;
          if (lock) { UI.toast(lock); V.seq([{ ur: lock, ro: lock }]); return; }
          AA.sfx.play('whoosh'); UI.go('play', { id });
        }
      });
    }
  };

  /* ------------------------- Session screen ------------------------- */
  S.play = {
    render(p) {
      const g = AA.games[p.id];
      return '<div class="game"><div class="game-top"><button class="icon-btn" data-act="back" aria-label="Wapas">' + UI.icon('back') + '</button>' +
        '<div class="gt-mid"><b class="ur">' + g.ur + '</b><small class="sub">' + g.ro + '</small></div>' + UI.starsChip() + '</div>' +
        '<div class="game-stage" id="g-stage"></div></div>';
    },
    mount(root, p) {
      const g = AA.games[p.id];
      const rec = g.id === 'review' ? { lvl: 2 } : Store.game(g.id);
      const ctx = {
        game: g, params: p, root, stage: AA.$('#g-stage', root), age: Store.profile.age, bada: Store.profile.age === 'bada',
        lvl: rec.lvl, alive: true, timers: [], cleanups: [], total: 0, results: [], extra: null,
        later(fn, ms) { const t = setTimeout(() => ctx.alive && fn(), ms); ctx.timers.push(t); return t; },
        say(list) { return V.seq(list); },
        setTotal(n) { ctx.total = n; },
        record(ok) { ctx.results.push(ok ? 'ok' : 'helped'); },
        async finish(opt) {
          if (!ctx.alive) return;
          ctx.alive = false; V.stop();
          ctx.cleanups.forEach((f) => { try { f(); } catch (e) {} });
          const total = ctx.results.length || 1;
          const good = ctx.results.filter((x) => x === 'ok').length;
          const ratio = opt && opt.ratio != null ? opt.ratio : good / total;
          const stars = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1;
          if (g.id !== 'review') {
            const r = Store.game(g.id);
            r.played++; r.best = Math.max(r.best || 0, stars);
            if (ratio >= 0.8) r.lvl = Math.min(4, r.lvl + 1); else if (ratio < 0.4) r.lvl = Math.max(1, r.lvl - 1);
          }
          Store.save();
          showResult(ctx, stars, good, total, opt);
          await UI.reward(stars, g.id);
          UI.mission(g.id === 'review' ? 'learn' : 'play');
        }
      };
      root._ctx = ctx;
      const lock = g.need ? g.need() : null;
      if (lock) { ctx.stage.innerHTML = '<div class="result"><div class="q-text">' + AA.esc(lock) + '</div></div>'; return; }
      g.start(ctx);
    },
    leave(root) {
      const c = root && root._ctx;
      if (c) { c.alive = false; c.timers.forEach(clearTimeout); c.cleanups.forEach((f) => { try { f(); } catch (e) {} }); }
    }
  };

  function showResult(ctx, stars, good, total, opt) {
    const msg = stars === 3 ? 'ماشاءاللہ! کمال کر دیا' : stars === 2 ? 'بہت خوب!' : 'شاباش! کوشش کرتے رہو';
    ctx.stage.innerHTML = '<div class="result">' + UI.mascot('cheer') + '<h2 class="ur">' + msg + '</h2>' +
      '<div class="rstars">' + '⭐'.repeat(stars) + '<span class="off">' + '⭐'.repeat(3 - stars) + '</span></div>' +
      '<p class="sub">' + (opt && opt.note ? AA.esc(opt.note) : 'Pehli koshish mein sahi: ' + good + ' / ' + total) + '</p>' +
      '<button class="btn big green block" data-act="again">' + UI.icon('redo') + ' Phir khelo</button>' +
      '<button class="btn ghost block" data-act="back">Wapas</button></div>';
    AA.sfx.play(stars === 3 ? 'win' : 'great');
    UI.confetti(ctx.stage, stars === 3 ? 44 : 22);
    V.seq([AA.pick(D.PRAISE)]);
    UI.bind(ctx.stage, { again() { UI.go('play', ctx.params, { replace: true }); } });
  }

  /* ------------------------- Quiz engine ------------------------- */
  // rounds: [{ label, prompt, pcls, opts:[{html,ok,cls}], cols, intro:[say], onOk:[say], letter, reveal }]
  function runQuiz(ctx, rounds) {
    let idx = 0, wrong = 0, locked = false;
    ctx.setTotal(rounds.length);
    function show() {
      const r = rounds[idx]; locked = false; wrong = 0;
      ctx.stage.innerHTML = '<div class="q-card">' + dotsHtml(ctx) +
        '<div class="q-text"><span class="ur">' + r.label + '</span></div>' +
        '<div class="q-prompt ' + (r.pcls || '') + '" id="q-prompt">' + r.prompt + '</div>' +
        '<div class="opt-grid" style="--cols:' + (r.cols || r.opts.length) + '">' + r.opts.map((o, k) => '<button class="opt ' + (o.cls || '') + '" data-act="pick" data-k="' + k + '" ' + (o.aria ? 'aria-label="' + AA.esc(o.aria) + '"' : '') + '>' + o.html + '</button>').join('') + '</div></div>';
      ctx.stage.scrollTop = 0;
      if (r.intro) ctx.say(r.intro);
    }
    async function next() {
      idx++;
      if (idx >= rounds.length) { ctx.finish(); return; }
      show();
    }
    UI.bind(ctx.stage, {
      hear() { const r = rounds[idx]; if (r && r.intro) ctx.say(r.intro); UI.pulse(AA.$('.listen-btn', ctx.stage), 'pulse-once'); },
      count(t) {
        if (t.classList.contains('counted')) return;
        t.classList.add('counted');
        const n = AA.$$('.cobj.counted', ctx.stage).length;
        t.insertAdjacentHTML('beforeend', '<span class="cn">' + n + '</span>');
        AA.sfx.play('pop'); V.say(D.NUMBERS[n - 1] || D.NUMBERS[9]);
      },
      async pick(t) {
        if (locked) return;
        const r = rounds[idx], o = r.opts[+t.dataset.k];
        if (o.ok) {
          locked = true; t.classList.add('right'); AA.sfx.play('good');
          AA.$$('.opt', ctx.stage).forEach((b) => { if (b !== t) b.classList.add('fade'); });
          ctx.record(wrong === 0);
          if (r.letter != null) Store.srs(r.letter, wrong === 0);
          if (r.reveal) { const pr = AA.$('#q-prompt', ctx.stage); if (pr) pr.innerHTML = r.reveal; }
          UI.floatText(ctx.stage, wrong === 0 ? '⭐' : '👍', t.offsetLeft + t.offsetWidth / 2 - 14, t.offsetTop, '');
          await ctx.say((r.onOk || []).concat([wrong === 0 ? AA.pick(D.PRAISE) : D.T.ekBaarAur].slice(0, wrong === 0 ? 1 : 0)));
          await AA.wait(350);
          if (ctx.alive) next();
        } else {
          wrong++; t.classList.add('wrong'); AA.sfx.play('oops');
          setTimeout(() => t.classList.remove('wrong'), 480);
          if (wrong === 1) V.seq([D.T.dobara]);
          if (wrong >= 2) {
            const good = AA.$$('.opt', ctx.stage)[r.opts.findIndex((x) => x.ok)];
            if (good) good.classList.add('hint');
          }
        }
      }
    });
    show();
  }
  AA.runQuiz = runQuiz;

  /* ------------------------- Game definitions ------------------------- */
  const listen = '<button class="listen-btn" data-act="hear" aria-label="Suno">' + UI.icon('sound') + '</button>';

  // 🧠 Dohrao — yaad ka nizam
  AA.games.add({
    id: 'review', ur: 'دہراؤ', ro: 'Dohrao', e: '🧠', a: '#2ED1A0', b: '#12B5A6', d: '#0B7F73', ages: [], on: 0, ob: 0,
    need: () => null,
    start(ctx) {
      let letters = ctx.params.letters && ctx.params.letters.length ? ctx.params.letters.slice() : Store.dueList(6).concat(Store.weakList(3));
      letters = Array.from(new Set(letters));
      if (letters.length < 3) letters = Array.from(new Set(letters.concat(shuffle(Store.learnedList()).slice(0, 6 - letters.length))));
      const n = Math.min(6, Math.max(4, letters.length));
      const seq = AA.pickLetters(n, letters.length ? letters : Store.pool());
      const nOpt = ctx.bada ? 4 : 3, pool = Store.pool(nOpt + 1);
      const rounds = seq.map((i, k) => {
        const type = k % 3 === 0 ? 'pic' : k % 3 === 1 ? 'hear' : 'letterPic';
        const opts = AA.letterOpts(i, nOpt, { pool, similar: ctx.bada && Store.letterState(i) >= 1 && k > 2 });
        if (type === 'hear') return { label: 'سنو اور ڈھونڈو', prompt: listen, pcls: 'listen', letter: i, intro: [{ ar: L(i).say }], onOk: [{ ar: L(i).say }], cols: nOpt > 3 ? 2 : nOpt, opts: opts.map((x) => ({ html: letterOpt(x), ok: x === i })) };
        if (type === 'pic') return { label: 'یہ کس حرف سے شروع ہوتا ہے؟', prompt: '<span class="big">' + L(i).w.e + '</span>', letter: i, intro: [{ ar: L(i).w.ar }, L(i).w], onOk: [{ ar: L(i).say }], cols: nOpt > 3 ? 2 : nOpt, opts: opts.map((x) => ({ html: letterOpt(x), ok: x === i })) };
        const pics = opts.map((x) => ({ html: '<span>' + L(x).w.e + '</span>', ok: x === i }));
        return { label: 'اس حرف کی تصویر کون سی؟', prompt: '<span class="ar-big big">' + L(i).ch + '</span>', letter: i, intro: [{ ar: L(i).say }], onOk: [L(i).w], cols: nOpt > 3 ? 2 : nOpt, opts: pics };
      });
      runQuiz(ctx, rounds);
    }
  });

  // 🔊 Harf Suno
  AA.games.add({
    id: 'suno', ur: 'حرف سنو', ro: 'Harf Suno', e: '🔊', a: '#3DA9FC', b: '#5B7CFA', d: '#2358B8', ages: ['nanha', 'bada'], on: 7, ob: 0,
    need: () => null,
    start(ctx) {
      const pool = Store.pool(5), nOpt = AA.clamp(ctx.lvl + (ctx.bada ? 1 : 0), 2, 4);
      const seq = AA.pickLetters(ctx.bada ? 7 : 5, pool);
      runQuiz(ctx, seq.map((i) => ({
        label: 'سنو اور ڈھونڈو', prompt: listen, pcls: 'listen', letter: i, intro: [{ ar: L(i).say }, 200, D.T.dhoondo], onOk: [{ ar: L(i).say }],
        cols: nOpt > 3 ? 2 : nOpt, opts: AA.letterOpts(i, nOpt, { pool, similar: ctx.lvl >= 3 }).map((x) => ({ html: letterOpt(x), ok: x === i }))
      })));
    }
  });

  // 🖼️ Harf aur Tasveer
  AA.games.add({
    id: 'tasveer', ur: 'حرف اور تصویر', ro: 'Harf aur Tasveer', e: '🖼️', a: '#FF7A59', b: '#FF5E7E', d: '#C94430', ages: ['nanha', 'bada'], on: 8, ob: 1,
    need: () => null,
    start(ctx) {
      const pool = Store.pool(5), nOpt = AA.clamp(ctx.lvl + 1, 2, 4);
      const seq = AA.pickLetters(ctx.bada ? 7 : 5, pool);
      runQuiz(ctx, seq.map((i, k) => {
        const opts = AA.letterOpts(i, nOpt, { pool, similar: ctx.lvl >= 3 });
        if (k % 2 === 0) return { label: 'یہ کس حرف سے شروع ہوتا ہے؟', prompt: '<span class="big">' + L(i).w.e + '</span>', letter: i, intro: [{ ar: L(i).w.ar }, L(i).w], onOk: [{ ar: L(i).say }], cols: nOpt > 3 ? 2 : nOpt, opts: opts.map((x) => ({ html: letterOpt(x), ok: x === i })) };
        return { label: 'اس حرف کی تصویر کون سی؟', prompt: '<span class="ar-big big">' + L(i).ch + '</span>', letter: i, intro: [{ ar: L(i).say }], onOk: [L(i).w], cols: nOpt > 3 ? 2 : nOpt, opts: opts.map((x) => ({ html: '<span>' + L(x).w.e + '</span>', ok: x === i })) };
      }));
    }
  });

  // 🔍 Alag Harf (shakal pehchano)
  AA.games.add({
    id: 'alag', ur: 'الگ حرف', ro: 'Alag Harf Dhoondo', e: '🔍', a: '#8B6CFF', b: '#6A4FDB', d: '#4631A8', ages: ['bada'], on: 99, ob: 2,
    start(ctx) {
      const cells = [4, 6, 9, 12][ctx.lvl - 1], cols = cells <= 4 ? 2 : cells === 12 ? 4 : 3;
      const pool = Store.pool(5);
      const rounds = [];
      for (let k = 0; k < 6; k++) {
        const a = pick(pool);
        const sims = D.similarTo(a);
        const b = ctx.lvl >= 3 && sims.length ? pick(sims) : pick(D.LETTERS.map((_, i) => i).filter((x) => x !== a && !sims.includes(x)));
        const odd = rand(0, cells - 1);
        rounds.push({
          label: 'کون سا الگ ہے؟', prompt: '<span class="q-text">👀 <span class="ur">غور سے دیکھو</span></span>', cols,
          opts: Array.from({ length: cells }, (_, j) => ({ html: letterOpt(j === odd ? b : a), ok: j === odd, cls: 'sm' })),
          letter: null, onOk: [{ ar: L(b).say }], intro: [D.T.kaunSaAlag]
        });
      }
      runQuiz(ctx, rounds);
    }
  });

  // 🪜 Agla Harf
  AA.games.add({
    id: 'agla', ur: 'اگلا حرف', ro: 'Agla Harf', e: '🪜', a: '#FFB020', b: '#FF8A3D', d: '#C77700', ages: ['bada'], on: 99, ob: 6,
    need: () => null,
    start(ctx) {
      const maxI = Math.max(6, Math.max.apply(null, Store.learnedList()) + 1);
      const rounds = [];
      for (let k = 0; k < 6; k++) {
        const s = rand(0, Math.max(0, Math.min(25, maxI - 3)));
        const trio = [s, s + 1, s + 2], miss = pick([2, 2, 0, 1]);
        const c = trio[miss];
        const nOpt = ctx.lvl >= 3 ? 4 : 3;
        const others = shuffle(D.LETTERS.map((_, i) => i).filter((x) => !trio.includes(x))).slice(0, nOpt - 1);
        const chips = trio.map((x, j) => j === miss ? '<span class="ar-big" style="color:var(--c1)">؟</span>' : letterOpt(x));
        rounds.push({
          label: miss === 2 ? 'ان کے بعد کون سا حرف؟' : miss === 0 ? 'ان سے پہلے کون سا حرف؟' : 'بیچ میں کون سا حرف؟',
          prompt: '<span class="row" style="direction:rtl;gap:18px;font-size:3.4rem">' + chips.join('<span style="font-size:1.6rem;color:var(--ink2)">←</span>') + '</span>',
          cols: nOpt > 3 ? 2 : 3, opts: shuffle([c].concat(others)).map((x) => ({ html: letterOpt(x), ok: x === c })), letter: Store.isLearned(c) ? c : null, onOk: [{ ar: L(c).say }],
          intro: [D.T.aglaHarf]
        });
      }
      runQuiz(ctx, rounds);
    }
  });

  // ⬆️ Harkat Dhoondo
  AA.games.add({
    id: 'harkatGame', ur: 'حرکت ڈھونڈو', ro: 'Zabar Zer Pesh', e: '⬆️', a: '#12B5A6', b: '#2E9BD6', d: '#0B6F88', ages: ['bada'], on: 99, ob: 5,
    need: () => (Store.p.harkat.seen.length ? null : 'Pehle "Zabar Zer Pesh" seekho'),
    start(ctx) {
      const pool = Store.pool(5);
      const rounds = [];
      for (let k = 0; k < 6; k++) {
        const h = pick(D.HARKAT), li = pick(pool);
        const opts = shuffle(D.HARKAT).map((x) => ({ html: '<span class="ar-big">' + D.harakatLetter(li, x.mark) + '</span>', ok: x.id === h.id }));
        rounds.push({ label: h.ur + ' والا ڈھونڈو', prompt: '<span class="big">' + h.e + '</span>', cols: 3, opts, intro: [h, D.T.dhoondo], onOk: [{ ar: D.harakatLetter(li, h.mark) }], letter: null });
      }
      runQuiz(ctx, rounds);
    }
  });

  // 🎨 Rang Pehchano
  AA.games.add({
    id: 'rang', ur: 'رنگ پہچانو', ro: 'Rang Pehchano', e: '🎨', a: '#FF6FA8', b: '#C75BFF', d: '#9A3AB8', ages: ['nanha', 'bada'], on: 1, ob: 8,
    start(ctx) {
      const avail = D.COLORS.slice(0, [4, 6, 8, 10][ctx.lvl - 1]);
      const nOpt = ctx.lvl === 1 ? 2 : ctx.lvl >= 3 ? 4 : 3;
      const rounds = [];
      const seq = shuffle(avail).concat(shuffle(avail)).slice(0, ctx.bada ? 7 : 5);
      seq.forEach((c, k) => {
        const others = shuffle(avail.filter((x) => x !== c)).slice(0, nOpt - 1);
        const opts = shuffle([c].concat(others)).map((x) => ({ html: '<span class="disc" style="--hex:' + x.hex + '"></span>', ok: x === c, aria: x.ro }));
        if (k % 2 === 0) rounds.push({ label: c.ur + ' رنگ ڈھونڈو', prompt: listen, pcls: 'listen', cols: nOpt > 2 ? 2 : 2, opts, intro: [c, D.T.dhoondo], onOk: [c] });
        else rounds.push({ label: 'یہ کس رنگ کا ہے؟', prompt: '<span class="big">' + pick(c.things) + '</span>', cols: nOpt > 2 ? 2 : 2, opts, intro: [D.T.kaunSaRang], onOk: [c] });
      });
      runQuiz(ctx, rounds);
    }
  });

  // 🐄 Jaanwar
  AA.games.add({
    id: 'jaanwar', ur: 'جانور', ro: 'Jaanwar ki Awaaz', e: '🐮', a: '#7BD65A', b: '#2ED1A0', d: '#3B9B28', ages: ['nanha'], on: 2, ob: 99,
    start(ctx) {
      const nOpt = ctx.lvl === 1 ? 2 : ctx.lvl === 2 ? 3 : 4;
      const avail = D.ANIMALS.slice(0, [6, 8, 10, 12][ctx.lvl - 1]);
      const seq = shuffle(avail).slice(0, 5);
      runQuiz(ctx, seq.map((a, k) => {
        const others = shuffle(avail.filter((x) => x !== a)).slice(0, nOpt - 1);
        const opts = shuffle([a].concat(others)).map((x) => ({ html: '<span>' + x.e + '</span>', ok: x === a, aria: x.ro }));
        const cols = nOpt === 2 ? 2 : 2;
        if (k % 2 === 0) return { label: 'کون بول رہا ہے؟', prompt: listen, pcls: 'listen', cols, opts, intro: [{ lang: 'en', en: a.snd }], onOk: [a, { lang: 'en', en: a.snd }] };
        return { label: a.ur + ' کہاں ہے؟', prompt: listen, pcls: 'listen', cols, opts, intro: [a, D.T.dhoondo], onOk: [{ lang: 'en', en: a.snd }] };
      }));
    }
  });

  // 🔢 Ginti
  AA.games.add({
    id: 'ginti', ur: 'گنتی', ro: 'Ginti Karo', e: '🔢', a: '#FFB020', b: '#FF7A59', d: '#C77700', ages: ['nanha', 'bada'], on: 3, ob: 9,
    start(ctx) {
      const max = [3, 5, 7, 10][ctx.lvl - 1], rounds = [];
      const used = [];
      for (let k = 0; k < 5; k++) {
        let n; do { n = rand(1, max); } while (used.includes(n) && used.length < max); used.push(n);
        const thing = pick(D.COUNT_THINGS);
        let others = shuffle(Array.from({ length: Math.max(max, 4) }, (_, j) => j + 1).filter((x) => x !== n)).slice(0, 2);
        const opts = shuffle([n].concat(others)).map((x) => ({ html: '<span class="num" style="font-size:3.6rem;font-weight:700;color:var(--c1)">' + x + '</span>', ok: x === n, aria: String(x) }));
        rounds.push({
          label: 'گنو — کتنے ہیں؟', pcls: 'field',
          prompt: '<div class="count-field" style="box-shadow:none;min-height:0;padding:0">' + Array.from({ length: n }, () => '<button class="cobj" data-act="count">' + thing + '</button>').join('') + '</div>',
          cols: 3, opts, intro: [D.T.gino, D.T.kitne], onOk: [D.NUMBERS[n - 1]]
        });
      }
      runQuiz(ctx, rounds);
    }
  });

  // 🔷 Shakal
  AA.games.add({
    id: 'shakal', ur: 'شکلیں', ro: 'Shakal Pehchano', e: '🔷', a: '#3DA9FC', b: '#12B5A6', d: '#2184D6', ages: ['nanha', 'bada'], on: 4, ob: 10,
    start(ctx) {
      const avail = D.SHAPES.slice(0, [3, 4, 5, 6][ctx.lvl - 1]);
      const nOpt = Math.min(3, avail.length);
      const cols = D.COLORS.slice(0, 8);
      const seq = shuffle(avail).concat(shuffle(avail)).slice(0, 5);
      runQuiz(ctx, seq.map((s, k) => {
        const others = shuffle(avail.filter((x) => x !== s)).slice(0, nOpt - 1);
        const colors = shuffle(cols);
        const opts = shuffle([s].concat(others)).map((x, j) => ({ html: AA.shapeSvg(x, colors[j].hex), ok: x === s, aria: x.ro }));
        if (k % 2 === 0) return { label: s.ur + ' ڈھونڈو', prompt: listen, pcls: 'listen', cols: nOpt, opts, intro: [s, D.T.dhoondo], onOk: [s] };
        return { label: 'یہ کون سی شکل ہے؟', prompt: AA.shapeSvg(s, colors[4].hex), cols: nOpt, opts, intro: [D.T.kaunSaShakal], onOk: [s] };
      }));
    }
  });
})();

</script>
<script>
/* js/games2.js */
/* Aghaaz-e-Asaas Kids — games2.js
   Khaas games: Gubbare, Harf ki Tokri, Yaad ka Khel, Lafz Banao, Shakal ka Ghar.
   (Yahan bhi koi "out" nahi — galti par sirf narm awaaz aur dobara koshish.) */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const { rand, pick, shuffle } = AA;
  const L = (i) => D.LETTERS[i];
  const dotsHtml = (ctx) => '<div class="dots-row">' + Array.from({ length: ctx.total }, (_, k) => '<i class="' + (ctx.results[k] === 'ok' ? 'ok' : ctx.results[k] === 'helped' ? 'helped' : k === ctx.results.length ? 'cur' : '') + '"></i>').join('') + '</div>';
  function darken(hex, k) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  const BUB = ['#5BC8F5', '#7BE0B8', '#F7C265', '#C79BE8', '#FF9AA2', '#8FD0FF'];

  /* =====================================================
     🫧 GUBBARE — nanha: rang, bada: harf
     ===================================================== */
  AA.games.add({
    id: 'gubbare', ur: 'غبارے', ro: 'Gubbare Phoro', e: '🫧', a: '#5BC8F5', b: '#3DA9FC', d: '#2184D6', ages: ['nanha', 'bada'], on: 0, ob: 7,
    need: () => null,
    start(ctx) {
      const st = ctx.stage; st.classList.add('free');
      const letterMode = ctx.bada;
      const goal = letterMode ? 8 : 6;
      const pool = letterMode ? Store.pool(5) : null;
      const colors = D.COLORS.filter((c) => c.id !== 'safed').slice(0, [4, 6, 8, 9][ctx.lvl - 1]);
      let ok = 0, bad = 0, target = null, streak = 0;
      st.innerHTML = '<div style="position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;z-index:5;pointer-events:none"><span class="target-pill" id="gb-t"></span></div><div id="gb-f" style="position:absolute;inset:0;overflow:hidden"></div>';
      const field = AA.$('#gb-f', st), pill = AA.$('#gb-t', st);
      function newTarget() {
        if (letterMode) { const prev = target; do { target = pick(pool); } while (target === prev && pool.length > 1); pill.innerHTML = 'ڈھونڈو <span class="ar-big">' + L(target).ch + '</span>'; ctx.say([{ ar: L(target).say }, D.T.phoro]); }
        else { const prev = target; do { target = pick(colors); } while (target === prev && colors.length > 1); pill.innerHTML = '<span class="disc-s" style="--hex:' + target.hex + '"></span> ' + target.ur + ' <span class="ur" style="font-size:1.1rem">غبارہ پھوڑو</span>'; ctx.say([target, D.T.phoro]); }
      }
      pill.addEventListener('click', () => ctx.say(letterMode ? [{ ar: L(target).say }] : [target]));
      pill.style.pointerEvents = 'auto';
      newTarget();
      function spawn() {
        if (!ctx.alive) return;
        const W = field.clientWidth, H = field.clientHeight;
        if (W) {
          const isT = Math.random() < 0.45;
          const item = isT ? target : letterMode ? pick(pool) : pick(colors);
          const b = document.createElement('button');
          b.className = 'bubble-b';
          const col = letterMode ? pick(BUB) : item.hex;
          b.style.setProperty('--bc1', col); b.style.setProperty('--bc2', darken(col, 0.78));
          b.style.left = rand(6, Math.max(8, W - 100)) + 'px';
          const dist = H + 150, speed = (ctx.bada ? 88 : 70) + ctx.lvl * 16;
          b.style.setProperty('--rise', -dist + 'px'); b.style.setProperty('--sway', rand(-26, 26) + 'px');
          b.style.setProperty('--dur', (dist / speed).toFixed(2) + 's');
          b.dataset.ok = item === target ? '1' : '0';
          if (letterMode) b.innerHTML = '<span class="ar-big">' + L(item).ch + '</span>';
          b.setAttribute('aria-label', letterMode ? L(item).n : item.ro);
          b.addEventListener('animationend', (e) => { if (e.animationName === 'rise') b.remove(); });
          b.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(b, item); });
          field.appendChild(b);
        }
        ctx.later(spawn, Math.max(420, 950 - ctx.lvl * 100));
      }
      function tap(b, item) {
        if (b.dataset.done || !ctx.alive) return;
        b.dataset.done = '1';
        const fr = field.getBoundingClientRect(), r = b.getBoundingClientRect();
        const m = new DOMMatrixReadOnly(getComputedStyle(b).transform);
        b.style.setProperty('--tf', 'translate(' + m.m41 + 'px,' + m.m42 + 'px)');
        b.classList.add('popped'); setTimeout(() => b.remove(), 300);
        const x = r.left - fr.left + 30, y = r.top - fr.top;
        if (b.dataset.ok === '1') {
          ok++; streak++; AA.sfx.play('pop');
          UI.floatText(field, '+1', x, y, '');
          ctx.say(letterMode ? [{ ar: L(item).say }] : [item]);
          if (ok >= goal) { ctx.finish({ ratio: ok / (ok + bad), note: 'Sahi gubbare: ' + ok + ' • Doosre: ' + bad }); return; }
          if (streak >= 3) { streak = 0; ctx.later(newTarget, 700); }
        } else {
          bad++; AA.sfx.play('oops');
          UI.floatText(field, 'Yeh nahi 🙂', x - 20, y, 'soft');
        }
      }
      spawn();
    }
  });

  /* =====================================================
     🧺 HARF KI TOKRI
     ===================================================== */
  AA.games.add({
    id: 'tokri', ur: 'حرف کی ٹوکری', ro: 'Harf ki Tokri', e: '🧺', a: '#8B6CFF', b: '#C75BFF', d: '#6A3AB8', ages: ['bada'], on: 99, ob: 4,
    need: () => null,
    start(ctx) {
      const st = ctx.stage; st.classList.add('free');
      const pool = Store.pool(5), goal = 8;
      let target = pick(pool), caught = 0, bad = 0, dir = 0, run = 0;
      st.innerHTML = '<div style="position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;z-index:5"><span class="target-pill" id="tk-t"></span></div><div id="tk-f" style="position:absolute;inset:0;overflow:hidden;touch-action:none"><div class="basket" id="tk-b">🧺</div></div>' +
        '<button class="drive l" id="tk-l" aria-label="Left">' + UI.icon('back') + '</button><button class="drive r" id="tk-r" aria-label="Right">' + UI.icon('next') + '</button>';
      const field = AA.$('#tk-f', st), basket = AA.$('#tk-b', st), pill = AA.$('#tk-t', st);
      const say = () => { pill.innerHTML = 'پکڑو <span class="ar-big">' + L(target).ch + '</span>'; ctx.say([{ ar: L(target).say }, D.T.pakdo]); };
      pill.addEventListener('click', () => ctx.say([{ ar: L(target).say }])); say();
      let bx = field.clientWidth / 2;
      const move = (e) => { const r = field.getBoundingClientRect(); bx = AA.clamp(e.clientX - r.left, 50, r.width - 50); };
      field.addEventListener('pointermove', move); field.addEventListener('pointerdown', move);
      [['tk-l', -1], ['tk-r', 1]].forEach(([id, d]) => {
        const b = AA.$('#' + id, st);
        b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); dir = d; });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, () => { if (dir === d) dir = 0; }));
      });
      const items = []; let last = performance.now(), spawnIn = 0.4, raf = 0;
      function frame(now) {
        if (!ctx.alive) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const W = field.clientWidth, H = field.clientHeight;
        bx = AA.clamp(bx + dir * 520 * dt, 50, W - 50);
        basket.style.left = bx + 'px';
        spawnIn -= dt;
        if (spawnIn <= 0 && W) {
          spawnIn = Math.max(0.6, 1.25 - ctx.lvl * 0.14);
          const ch = Math.random() < 0.45 ? target : pick(pool);
          const el = document.createElement('div'); el.className = 'fall' + (ch === target ? ' is-target' : '');
          el.innerHTML = '<span class="ar-big">' + L(ch).ch + '</span>'; field.appendChild(el);
          items.push({ el, ch, x: rand(40, Math.max(42, W - 40)), y: -70, vy: (H + 90) / (4.6 - ctx.lvl * 0.5 + Math.random() * 0.6) });
        }
        const top = H - 14 - 70;
        for (let k = items.length - 1; k >= 0; k--) {
          const it = items[k]; it.y += it.vy * dt;
          it.el.style.transform = 'translate(' + (it.x - 33) + 'px,' + it.y + 'px)';
          if (it.y + 60 >= top && it.y <= top + 40 && Math.abs(it.x - bx) < 58) {
            items.splice(k, 1); it.el.remove();
            if (it.ch === target) {
              caught++; AA.sfx.play('good'); basket.classList.remove('good'); void basket.offsetWidth; basket.classList.add('good');
              UI.floatText(field, '+1', it.x - 10, top - 20, '');
              ctx.say([{ ar: L(it.ch).say }]);
              if (caught >= goal) { ctx.finish({ ratio: caught / (caught + bad), note: 'Pakde: ' + caught + ' • Doosre: ' + bad }); return; }
              if (caught % 4 === 0) { target = pick(pool); ctx.later(say, 700); }
            } else { bad++; AA.sfx.play('oops'); UI.floatText(field, 'Yeh nahi 🙂', it.x - 30, top - 20, 'soft'); }
          } else if (it.y > H + 10) { items.splice(k, 1); it.el.remove(); }
        }
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame((t) => { last = t; frame(t); });
      ctx.cleanups.push(() => cancelAnimationFrame(raf));
    }
  });

  /* =====================================================
     🃏 YAAD KA KHEL
     ===================================================== */
  AA.games.add({
    id: 'yaad', ur: 'یاد کا کھیل', ro: 'Yaad ka Khel', e: '🃏', a: '#FF6FA8', b: '#FF7A59', d: '#C94430', ages: ['nanha', 'bada'], on: 5, ob: 3,
    need: () => null,
    start(ctx) {
      const pairs = ctx.bada ? [3, 4, 6, 8][ctx.lvl - 1] : [3, 4, 5, 6][ctx.lvl - 1];
      const cols = pairs <= 3 ? 3 : 4;
      let cards = [];
      if (ctx.bada) {
        const letters = shuffle(Store.pool(pairs)).slice(0, pairs);
        letters.forEach((i) => {
          cards.push({ key: 'l' + i, html: '<span class="ar-big">' + L(i).ch + '</span>', say: [{ ar: L(i).say }], letter: i });
          cards.push({ key: 'l' + i, html: '<span>' + L(i).w.e + '</span>', say: [{ ar: L(i).w.ar }, L(i).w], letter: i });
        });
      } else {
        shuffle(D.ANIMALS).slice(0, pairs).forEach((a) => { for (let k = 0; k < 2; k++) cards.push({ key: a.id, html: '<span>' + a.e + '</span>', say: [a] }); });
      }
      cards = shuffle(cards);
      st_render();
      function st_render() {
        ctx.stage.innerHTML = '<div class="q-text"><span class="ur">جوڑی ملاؤ</span></div><div class="mem-grid" style="--cols:' + cols + '">' +
          cards.map((c, k) => '<button class="mcard flip" data-act="card" data-k="' + k + '" aria-label="Card"><span class="mc-in"><span class="back">❓</span><span class="face">' + c.html + '</span></span></button>').join('') + '</div><div class="sub" id="mv">Chaalein: 0</div>';
      }
      let open = [], moves = 0, matched = 0, locked = true;
      ctx.say([D.T.dekho]);
      ctx.later(() => { AA.$$('.mcard', ctx.stage).forEach((c) => c.classList.remove('flip')); locked = false; }, ctx.bada ? 1800 + pairs * 250 : 2300 + pairs * 250);
      UI.bind(ctx.stage, {
        card(t) {
          if (locked || t.classList.contains('flip')) return;
          const k = +t.dataset.k;
          t.classList.add('flip'); AA.sfx.play('tap'); open.push(k);
          if (open.length === 2) {
            moves++; AA.$('#mv', ctx.stage).textContent = 'Chaalein: ' + moves;
            const [a, b] = open; locked = true;
            if (cards[a].key === cards[b].key) {
              matched++; AA.sfx.play('good');
              [a, b].forEach((x) => AA.$('[data-k="' + x + '"]', ctx.stage).classList.add('match'));
              if (cards[a].letter != null) Store.srs(cards[a].letter, true);
              ctx.say(cards[a].say);
              open = []; locked = false;
              if (matched === pairs) ctx.later(() => ctx.finish({ ratio: Math.min(1, (pairs / moves) * 1.4), note: pairs + ' jodiyan ' + moves + ' chaalon mein' }), 1200);
            } else {
              ctx.later(() => { [a, b].forEach((x) => AA.$('[data-k="' + x + '"]', ctx.stage).classList.remove('flip')); open = []; locked = false; }, 950);
            }
          }
        }
      });
    }
  });

  /* =====================================================
     🧩 LAFZ BANAO
     ===================================================== */
  AA.games.add({
    id: 'lafz', ur: 'لفظ بناؤ', ro: 'Lafz Banao', e: '🧩', a: '#FF9A3D', b: '#FF6FA8', d: '#C96B1F', ages: ['bada'], on: 99, ob: 6,
    need: () => (Store.learnedList().length >= 6 ? null : 'Pehle 6 harf seekho'),
    start(ctx) {
      const lvl = ctx.lvl, learned = new Set(Store.learnedList().map((i) => L(i).ch));
      let words = D.WORDS.filter((w) => (lvl === 1 ? w.lv === 1 : lvl === 2 ? w.lv <= 2 : lvl === 3 ? w.lv === 2 || w.lv === 3 : w.lv >= 3));
      // pehle woh lafz jinke harf seekhe ja chuke hain
      const easy = words.filter((w) => Array.from(w.w).every((c) => learned.has(c)));
      words = shuffle(easy.length >= 4 ? easy : words).slice(0, 4);
      ctx.setTotal(words.length);
      let wi = 0, cur = null;
      function round() {
        const w = words[wi], letters = Array.from(w.w);
        const extra = shuffle(D.LETTERS.map((x) => x.ch).filter((c) => !letters.includes(c))).slice(0, lvl >= 4 ? 2 : lvl >= 3 ? 1 : 0);
        const bank = shuffle(letters.map((c, k) => ({ c, id: k })).concat(extra.map((c, k) => ({ c, id: 100 + k }))));
        cur = { w, letters, next: 0, wrong: 0, locked: false };
        ctx.stage.innerHTML = '<div class="q-card">' + dotsHtml(ctx) + '<div class="q-text"><span class="ur">لفظ بناؤ</span></div>' +
          '<div class="q-prompt"><button class="big" data-act="hearw" style="font-size:4.6rem">' + w.e + '</button></div>' +
          '<div class="slots" id="lz-s">' + letters.map(() => '<div class="slot"></div>').join('') + '</div>' +
          '<div class="tiles-bank" id="lz-b">' + bank.map((b) => '<button class="ltile" data-act="tile" data-id="' + b.id + '" data-c="' + b.c + '"><span class="ar-big">' + b.c + '</span></button>').join('') + '</div></div>';
        ctx.say([w, D.T.lafzBanao]);
      }
      UI.bind(ctx.stage, {
        hearw() { ctx.say([cur.w, D.T.lafzBanao]); },
        async tile(t) {
          const c = cur;
          if (c.locked || t.classList.contains('used')) return;
          if (t.dataset.c === c.letters[c.next]) {
            AA.sfx.play('pop'); t.classList.add('used');
            const slot = AA.$$('.slot', ctx.stage)[c.next]; slot.classList.add('fill'); slot.innerHTML = '<span class="ar-big">' + t.dataset.c + '</span>';
            c.next++; V.stop();
            if (c.next === c.letters.length) {
              c.locked = true; ctx.record(c.wrong === 0); AA.sfx.play('great');
              AA.$('#lz-s', ctx.stage).innerHTML = '<span class="ar-big word-done">' + c.w.w + '</span>';
              AA.$('#lz-b', ctx.stage).innerHTML = '<div class="q-text"><span class="ur">' + c.w.ur + '</span><br><small class="sub">' + c.w.ro + '</small></div>';
              await ctx.say([{ ar: c.w.w }, c.w, AA.pick(D.PRAISE)]);
              await AA.wait(400); wi++;
              if (!ctx.alive) return;
              if (wi >= words.length) ctx.finish(); else round();
            }
          } else {
            c.wrong++; t.classList.add('wrong'); AA.sfx.play('oops'); setTimeout(() => t.classList.remove('wrong'), 450);
            if (c.wrong >= 2) { const g = AA.$$('.ltile:not(.used)', ctx.stage).find((x) => x.dataset.c === c.letters[c.next]); if (g) g.classList.add('hint'); }
          }
        }
      });
      round();
    }
  });

  /* =====================================================
     🔷 SHAKAL KA GHAR — ungli se khench kar sahi jagah rakho
     ===================================================== */
  AA.games.add({
    id: 'shakalGhar', ur: 'شکل کا گھر', ro: 'Shakal ka Ghar', e: '🧩', a: '#12B5A6', b: '#3DA9FC', d: '#0B6F88', ages: ['nanha'], on: 6, ob: 99,
    start(ctx) {
      const n = [3, 4, 5, 6][ctx.lvl - 1], shapes = shuffle(D.SHAPES).slice(0, n);
      const cols = shuffle(D.COLORS.filter((c) => !['safed', 'kala', 'bhura'].includes(c.id)));
      ctx.stage.innerHTML = '<div class="q-text"><span class="ur">شکل کو اس کے گھر میں رکھو</span></div><div class="shape-board" id="sb"></div>';
      const board = AA.$('#sb', ctx.stage), W = board.clientWidth || 360, H = 300, pc = Math.min(n, 3);
      const holes = [], pieces = [];
      shapes.forEach((s, k) => {
        const row = Math.floor(k / pc), col = k % pc, cnt = Math.min(pc, n - row * pc);
        const hx = (W / cnt) * (col + 0.5) - 48, hy = 6 + row * 104;
        const h = document.createElement('div'); h.className = 'hole'; h.style.left = hx + 'px'; h.style.top = hy + 'px'; h.style.setProperty('--sc', cols[k].hex);
        h.innerHTML = AA.shapeSvg(s, 'currentColor').replace('fill:currentColor;', ''); board.appendChild(h); holes.push({ el: h, s, x: hx, y: hy });
      });
      const order = shuffle(shapes.map((s, k) => ({ s, k })));
      order.forEach((o, j) => {
        const rows = Math.ceil(n / pc), py = 14 + rows * 104 + 8;
        const cnt = Math.min(pc, n); const px = (W / cnt) * (j % cnt + 0.5) - 48 + rand(-6, 6), pyy = py + Math.floor(j / cnt) * 100;
        const p = document.createElement('div'); p.className = 'piece'; p.style.left = px + 'px'; p.style.top = Math.min(pyy, H - 96) + 'px'; p.style.setProperty('--sc', cols[o.k].hex);
        p.innerHTML = AA.shapeSvg(o.s, cols[o.k].hex); p.dataset.k = o.k; board.appendChild(p);
        pieces.push({ el: p, s: o.s, hx: px, hy: Math.min(pyy, H - 96), k: o.k });
      });
      let good = 0, bad = 0, placed = 0;
      pieces.forEach((pc2) => {
        const el = pc2.el; let ox = 0, oy = 0;
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); el.classList.remove('back');
          const r = el.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top; ctx.say([pc2.s]);
        });
        el.addEventListener('pointermove', (e) => {
          if (!el.classList.contains('drag')) return;
          const br = board.getBoundingClientRect();
          el.style.left = (e.clientX - br.left - ox) + 'px'; el.style.top = (e.clientY - br.top - oy) + 'px';
        });
        const drop = () => {
          if (!el.classList.contains('drag')) return;
          el.classList.remove('drag');
          const cx = parseFloat(el.style.left) + 48, cy = parseFloat(el.style.top) + 48;
          let hit = null, bestD = 70;
          holes.forEach((h) => { const d = Math.hypot(h.x + 48 - cx, h.y + 48 - cy); if (d < bestD) { bestD = d; hit = h; } });
          if (hit && hit.s === pc2.s) {
            good++; placed++; el.classList.add('placed'); hit.el.classList.add('filled'); AA.sfx.play('good');
            ctx.say([pc2.s, AA.pick(D.PRAISE)]);
            if (placed === n) ctx.later(() => ctx.finish({ ratio: good / (good + bad), note: 'Sahi: ' + good + ' • Dobara: ' + bad }), 900);
          } else {
            if (hit) { bad++; AA.sfx.play('oops'); }
            el.classList.add('back'); el.style.left = pc2.hx + 'px'; el.style.top = pc2.hy + 'px';
          }
        };
        el.addEventListener('pointerup', drop); el.addEventListener('pointercancel', drop);
      });
      ctx.say([D.T.chalo]);
    }
  });
})();

</script>
<script>
/* js/early.js */
/* Aghaaz-e-Asaas Kids — early.js
   "Meri Duniya": rang, jaanwar, ginti, shakal — nanhe bachon ke liye dekho-suno wale card. */
(function () {
  'use strict';
  const AA = window.AA, UI = AA.ui, Store = AA.store, D = AA.data, V = AA.voice;
  const S = AA.screens;

  const CATS = {
    rang: { ur: 'رنگ', ro: 'Rang', e: '🎨', items: () => D.COLORS, a: '#FF6FA8', b: '#C75BFF', d: '#9A3AB8', game: 'rang' },
    jaanwar: { ur: 'جانور', ro: 'Jaanwar', e: '🐮', items: () => D.ANIMALS, a: '#7BD65A', b: '#2ED1A0', d: '#3B9B28', game: 'jaanwar' },
    ginti: { ur: 'گنتی', ro: 'Ginti 1–10', e: '🔢', items: () => D.NUMBERS, a: '#FFB020', b: '#FF7A59', d: '#C77700', game: 'ginti' },
    shakal: { ur: 'شکلیں', ro: 'Shakalein', e: '🔷', items: () => D.SHAPES, a: '#3DA9FC', b: '#12B5A6', d: '#2184D6', game: 'shakal' }
  };

  S.early = {
    render() {
      const bada = Store.profile.age === 'bada';
      return UI.topbar({ ur: 'میری دنیا', ro: 'Dekho • Suno • Seekho' }) +
        '<div class="cat-grid">' + Object.keys(CATS).map((k) => {
          const c = CATS[k], seen = (Store.p.early[k] && Store.p.early[k].seen) ? Store.p.early[k].seen.length : 0, tot = c.items().length;
          return '<button class="tile" data-act="cat" data-k="' + k + '" style="--a:' + c.a + ';--b:' + c.b + ';--d:' + c.d + '"><span class="badge">' + seen + '/' + tot + '</span><span class="te">' + c.e + '</span><span class="tt ur">' + c.ur + '</span><span class="ts">' + c.ro + '</span></button>';
