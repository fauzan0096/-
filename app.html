<!DOCTYPE html>
<html lang="ur-Latn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>آغازِ اساس</title>
    <!-- Google Fonts for Professional Arabic Look -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <!-- Top Header -->
    <header class="app-header">
        <div class="header-content">
            <img src="qari-192.png" alt="Logo" class="logo">
            <div>
                <h1>آغازِ اساس</h1>
                <p id="header-subtitle">Noorani Qaida</p>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="global-progress" style="width: 10%;"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- Content will be injected by app.js -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('qaida', this)">
            <span class="icon">📖</span> Qaida
        </button>
        <button class="nav-btn" onclick="switchTab('duas', this)">
            <span class="icon">🤲</span> Duaein
        </button>
        <button class="nav-btn" onclick="switchTab('stories', this)">
            <span class="icon">🕌</span> Stories
        </button>
        <button class="nav-btn" onclick="switchTab('games', this)">
            <span class="icon">⭐</span> Games
        </button>
    </nav>

    <!-- Hidden Audio Player -->
    <audio id="audio-player"></audio>

    <!-- Scripts -->
    <script src="courseData.js"></script>
    <script src="app.js"></script>
</body>
</html>
